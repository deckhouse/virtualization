{{- /*
  VM snapshot Secret guard. A VirtualMachineSnapshot is stored as a Secret of type
  virtualmachine.virtualization.deckhouse.io/snapshot holding the full VM manifest, applied by the
  privileged virtualization-controller on restore/clone with no integrity protection. Only module
  ServiceAccounts write it, so deny CREATE/UPDATE of this type for every other subject.
*/ -}}
{{- $kubeVersion := .Values.global.discovery.kubernetesVersion }}
{{- $apiVersion := "" }}
{{- if semverCompare ">=1.30.0" $kubeVersion }}
{{- $apiVersion = "admissionregistration.k8s.io/v1" }}
{{- else if semverCompare ">=1.28.0" $kubeVersion }}
{{- $apiVersion = "admissionregistration.k8s.io/v1beta1" }}
{{- else if semverCompare ">=1.26.0" $kubeVersion }}
{{- $apiVersion = "admissionregistration.k8s.io/v1alpha1" }}
{{- end }}

{{- if $apiVersion }}
apiVersion: {{ $apiVersion }}
kind: ValidatingAdmissionPolicy
metadata:
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
  name: virtualization-snapshot-secret-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  matchConditions:
    - name: only-snapshot-secret
      expression: >
        has(object.type) && object.type == "virtualmachine.virtualization.deckhouse.io/snapshot"
    - name: not-module-service-account
      expression: >
        !(request.userInfo.username.startsWith("system:serviceaccount:kube-system:") ||
          request.userInfo.username.startsWith("system:serviceaccount:d8-system:") ||
          request.userInfo.username.startsWith("system:serviceaccount:d8-virtualization:"))
  validations:
    - expression: "false"
      message: "Secret of type virtualmachine.virtualization.deckhouse.io/snapshot is managed by the virtualization module and can only be written by its ServiceAccounts."
      reason: Forbidden
---
apiVersion: {{ $apiVersion }}
kind: ValidatingAdmissionPolicyBinding
metadata:
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
  name: virtualization-snapshot-secret-policy-binding
spec:
  policyName: virtualization-snapshot-secret-policy
  validationActions:
    - "Deny"
  matchResources:
    namespaceSelector: {}
    objectSelector: {}
{{- end }}
