{{- if and (eq (include "d8.securityPolicyException.isEnabled" .) "true") (has "Peering" (.Values.virtualization.internal | dig "moduleConfig" "featureGates" list)) }}
---
apiVersion: deckhouse.io/v1alpha1
kind: SecurityPolicyException
metadata:
  name: virt-synchronization-controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" .Chart.Name)) | nindent 2 }}
spec:
  network:
    hostNetwork:
      allowedValue: true
      metadata:
        description: |
          The synchronization controller of another cluster connects to this one directly:
          the address it publishes is the node's, as pod addresses are not routable between clusters.
    hostPorts:
      - port: {{ include "virt_synchronization_controller.port" . }}
        protocol: TCP
        metadata:
          description: |
            Allow the hostPort for the synchronization API of migrations between clusters.
      - port: {{ include "virt_synchronization_controller.health_port" . }}
        protocol: TCP
        metadata:
          description: |
            Allow the hostPort for the health check service of the synchronization controller.
{{- end }}
