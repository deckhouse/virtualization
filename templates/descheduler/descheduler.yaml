{{ if has "deckhouse.io/v1alpha2/Descheduler" .Values.global.discovery.apiVersions }}
apiVersion: deckhouse.io/v1alpha2
kind: Descheduler
metadata:
  name: virtualization
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
spec:
  evictLocalStoragePods: true
  podLabelSelector:
    matchExpressions:
      - key: vm.kubevirt.internal.virtualization.deckhouse.io/name
        operator: Exists
      # A machine that cannot be live migrated is left alone: the only other way off its node is a
      # restart, and that happens solely on a node under maintenance and only with the permission
      # of an administrator.
      - key: vm.virtualization.deckhouse.io/live-migratable
        operator: In
        values:
          - "true"
  strategies:
    lowNodeUtilization:
      enabled: true
      thresholds:
        cpu: 50
      targetThresholds:
        cpu: 80
    removePodsViolatingInterPodAntiAffinity:
      enabled: true
    removePodsViolatingNodeAffinity:
      enabled: true
      nodeAffinityType:
        - requiredDuringSchedulingIgnoredDuringExecution
{{- end }}
