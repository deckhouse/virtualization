apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
{{- if eq (include "virtualization.rbacv2_new_scheme" .) "true" }}
  name: d8:namespace-capability:virtualization:execute_vmsnapshot_ops
  annotations:
    en.meta.deckhouse.io/title: "Virtualization: virtual machine snapshot operations"
    ru.meta.deckhouse.io/title: "Виртуализация: операции со снимками виртуальных машин"
    en.meta.deckhouse.io/description: "Run operations on virtual machine snapshots in a namespace through VirtualMachineSnapshotOperation."
    ru.meta.deckhouse.io/description: "Выполнение операций со снимками виртуальных машин в пространстве имён через VirtualMachineSnapshotOperation."
  labels:
    heritage: deckhouse
    module: virtualization
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/scope: namespace
    rbac.deckhouse.io/capability: "namespace-capability.virtualization.execute_vmsnapshot_ops"
    rbac.deckhouse.io/aggregate-to-namespace-as: user
{{- else }}
  labels:
    heritage: deckhouse
    module: virtualization
    rbac.deckhouse.io/aggregate-to-virtualization-as: user
    rbac.deckhouse.io/kind: use
  name: d8:use:capability:virtualization:execute_virtualmachinesnapshot_operations
{{- end }}
rules:
- apiGroups:
  - virtualization.deckhouse.io
  resources:
  - virtualmachinesnapshotoperations
  verbs:
  - create
  - update
  - patch
  - delete
  - deletecollection
