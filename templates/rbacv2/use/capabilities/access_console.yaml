apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
{{- if eq (include "virtualization.rbacv2_new_scheme" .) "true" }}
  name: d8:namespace-capability:virtualization:access_console
  annotations:
    en.meta.deckhouse.io/title: "Virtualization: virtual machine serial console"
    ru.meta.deckhouse.io/title: "Виртуализация: серийная консоль виртуальных машин"
    en.meta.deckhouse.io/description: "Connect to the serial console of virtual machines in a namespace."
    ru.meta.deckhouse.io/description: "Подключение к серийной консоли виртуальных машин в пространстве имён."
  labels:
    heritage: deckhouse
    module: virtualization
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/scope: namespace
    rbac.deckhouse.io/capability: "namespace-capability.virtualization.access_console"
    rbac.deckhouse.io/aggregate-to-namespace-as: user
{{- else }}
  labels:
    heritage: deckhouse
    module: virtualization
    rbac.deckhouse.io/aggregate-to-virtualization-as: user
    rbac.deckhouse.io/kind: use
  name: d8:use:capability:virtualization:access_console
{{- end }}
rules:
- apiGroups:
  - subresources.virtualization.deckhouse.io
  resources:
  - virtualmachines/console
  verbs:
  - get
  - create
  - update
