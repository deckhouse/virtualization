apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
{{- if eq (include "virtualization.rbacv2_new_scheme" .) "true" }}
  name: d8:system-capability:virtualization:manage_resources
  annotations:
    en.meta.deckhouse.io/title: "Virtualization: manage cluster resources"
    ru.meta.deckhouse.io/title: "Виртуализация: управление кластерными ресурсами"
    en.meta.deckhouse.io/description: "Manage cluster virtual images, virtual machine classes, node devices, nodes, namespaces, priority classes and the virtualization module configuration."
    ru.meta.deckhouse.io/description: "Управление кластерными образами, классами виртуальных машин, устройствами узлов, узлами, пространствами имён, классами приоритета и конфигурацией модуля virtualization."
  labels:
    heritage: deckhouse
    module: virtualization
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/capability: "system-capability.virtualization.manage_resources"
    rbac.deckhouse.io/aggregate-to-cluster-as: manager
    rbac.deckhouse.io/namespace: d8-virtualization
{{- else }}
  labels:
    heritage: deckhouse
    module: virtualization
    rbac.deckhouse.io/aggregate-to-virtualization-as: manager
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-virtualization
  name: d8:manage:permission:subsystem:virtualization:manage_resources
{{- end }}
rules:
  - apiGroups:
      - virtualization.deckhouse.io
    resources:
      - clustervirtualimages
      - virtualmachineclasses
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
  - apiGroups:
      - virtualization.deckhouse.io
    resources:
      - nodeusbdevices
      - nodepcidevices
    verbs:
      - update
      - patch
      - delete
      - deletecollection
  - apiGroups:
      - deckhouse.io
    resourceNames:
      - virtualization
    resources:
      - moduleconfigs
    verbs:
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - nodes/log
      - nodes/metrics
      - nodes/proxy
      - nodes/stats
    verbs:
      - '*'
  - apiGroups:
      - scheduling.k8s.io
    resources:
      - priorityclasses
    verbs:
      - create
      - update
      - patch
      - delete
