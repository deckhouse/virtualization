apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
{{- if eq (include "virtualization.rbacv2_new_scheme" .) "true" }}
  name: d8:system-capability:virtualization:view_resources
  annotations:
    en.meta.deckhouse.io/title: "Virtualization: view cluster resources"
    ru.meta.deckhouse.io/title: "Виртуализация: просмотр кластерных ресурсов"
    en.meta.deckhouse.io/description: "Read-only access to cluster virtual images, virtual machine classes, node devices, address leases, nodes, namespaces and the virtualization module configuration."
    ru.meta.deckhouse.io/description: "Доступ только на чтение к кластерным образам, классам виртуальных машин, устройствам узлов, арендам адресов, узлам, пространствам имён и конфигурации модуля virtualization."
  labels:
    heritage: deckhouse
    module: virtualization
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/capability: "system-capability.virtualization.view_resources"
    rbac.deckhouse.io/aggregate-to-cluster-as: viewer
    rbac.deckhouse.io/namespace: d8-virtualization
{{- else }}
  labels:
    heritage: deckhouse
    module: virtualization
    rbac.deckhouse.io/aggregate-to-virtualization-as: viewer
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-virtualization
  name: d8:manage:permission:subsystem:virtualization:view_resources
{{- end }}
rules:
  - apiGroups:
      - virtualization.deckhouse.io
    resources:
      - clustervirtualimages
      - virtualmachineclasses
      - virtualmachineipaddressleases
      - virtualmachinemacaddressleases
      - nodeusbdevices
      - nodepcidevices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - deckhouse.io
    resourceNames:
      - virtualization
    resources:
      - moduleconfigs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - namespaces
      - namespaces/status
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - scheduling.k8s.io
    resources:
      - priorityclasses
    verbs:
      - get
      - list
      - watch
