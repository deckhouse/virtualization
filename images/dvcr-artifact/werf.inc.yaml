---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
final: false
fromImage: builder/src
git:
{{- include "workspace go files" . }}
- add: {{ .ModuleDir }}/images/{{ .ImageName }}
  to: /src/images/dvcr-artifact
  stageDependencies:
    install:
    - go.mod
    - go.sum
    - "**/*.go"
- add: {{ .ModuleDir }}/api
  to: /src/api
  stageDependencies:
    install:
    - "**/*"
- add: {{ .ModuleDir }}/images/pvc-artifact/staging
  to: /src/images/pvc-artifact/staging
  stageDependencies:
    install:
    - "**/*"
---
{{- $builderName := print .ImageName "-builder-dependencies" -}}
{{- define "$builderName" -}}
# libnbd and libxml2: the importer links against them with CGO through
# pkg-config, so the builder needs the same packages the runtime image gets.
# git: go.work replaces kubevirt.io/api with the fox fork, and GOPRIVATE
# routes it past the proxy, so go needs a git client for the direct fetch.
pmPackages:
- git
- pkgconf
- libnbd libnbd-devel
- libxml2 libxml2-devel
{{- end -}}

{{ $goBuilderDependencies := include "$builderName" . | fromYaml }}

image: {{ .ModuleNamePrefix }}{{ .ImageName }}-builder
final: false
fromImage: builder/golang-1.25
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
{{- include "fox module auth secret" . }}
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
shell:
  install:
  {{- include "pm packages install" (list $goBuilderDependencies.pmPackages "/") | nindent 2 }}
  - export GOPROXY=$(cat /run/secrets/GOPROXY)
{{- include "fox module auth" . | nindent 2 }}
  - cd /src/images/dvcr-artifact
  - go mod download
{{- include "fox module auth cleanup" . | nindent 2 }}
  setup:
  - mkdir /out
  - cd /src/images/dvcr-artifact
  - |
    export GO111MODULE=on
    export GOOS=linux
    export CGO_ENABLED=1
    export GOARCH=amd64
    # wrappers.h in the libnbd Go bindings declares its callbacks the K&R way
    # (`extern int chunk_callback ();`). Under C23, which this toolchain's gcc
    # defaults to, an empty parameter list means (void), so those declarations
    # conflict with the prototypes cgo generates.
    export CGO_CFLAGS="-std=gnu17"
  - |
    {{- $_ := set $ "ProjectName" (list .ImageName "dvcr-importer" | join "/") }}
    {{- include "image-build.build" (set $ "BuildCommand" `go build -tags=dvcr_no_gost_tls -ldflags="-s -w" -o /out/dvcr-importer ./cmd/dvcr-importer`) | nindent 6 }}
    {{- $_ := set $ "ProjectName" (list .ImageName "dvcr-uploader" | join "/") }}
    {{- include "image-build.build" (set $ "BuildCommand" `go build -tags=dvcr_no_gost_tls -ldflags="-s -w" -o /out/dvcr-uploader ./cmd/dvcr-uploader`) | nindent 6 }}
  - |
    export CGO_ENABLED=0
    {{- $_ := set $ "ProjectName" (list .ImageName "dvcr-cleaner" | join "/") }}
    {{- include "image-build.build" (set $ "BuildCommand" `go build -ldflags="-s -w" -o /out/dvcr-cleaner ./cmd/dvcr-cleaner`) | nindent 6 }}
  - chown -R 64535:64535 /out

---
{{- $name := print .ImageName "-dependencies" -}}
{{- define "$name" -}}
pmPackages:
- bzip2 file xz libxml2
- libseccomp zlib zstd
- libffi gmp gnutls nettle libidn2
- p11-kit libtasn1 libfuse
- liburing libaio libaudit libcap-ng numactl
- libunistring glib2 libnbd gnu-glibc
{{- end -}}

{{ $builderDependencies := include "$name" . | fromYaml }}

image: {{ .ModuleNamePrefix }}{{ .ImageName }}-bins
final: false
fromImage: builder/distroless
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-builder
  add: /out
  to: /relocate/usr/local/bin
  before: install
- image: {{ .ModuleNamePrefix }}qemu
  add: /qemu-img
  to: /relocate
  before: install
shell:
  install:
  {{- include "pm packages install" (list $builderDependencies.pmPackages "/relocate") | nindent 2 }}
