---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
# base/distroless keeps a single library directory (/usr/lib64 -> lib), unlike
# the module's distroless, which has /usr/lib and /usr/lib64 as separate dirs.
# pm installs everything but glibc into /usr/lib, and ld.so.cache lists only
# /lib64 and /usr/lib64, so qemu-img there fails to load libzstd, libaio and
# liburing.
fromImage: base/distroless
git:
  {{- include "image mount points" . }}
import:
- image: {{ .ModuleNamePrefix }}pvc-artifact-bins
  add: /relocate
  to: /
  before: setup
# Binaries are built from images/pvc-artifact by images/pvc-artifact/werf.inc.yaml.
imageSpec:
  config:
    entrypoint: ["/usr/bin/pvc-importer", "-alsologtostderr"]
    user: 64535
