---
# The factory base/distroless already has what the module images need: the
# deckhouse user (64535), CA certificates, zoneinfo, nsswitch.conf and /tmp.
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
final: false
from: {{ index $.Images "base/distroless" }}
imageSpec:
  config:
    env:
      PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      LANG: ""
      LC_ALL: POSIX
    user: 64535
