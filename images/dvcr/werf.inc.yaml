---
{{- $gitRepoName := "distribution" }}
{{- $gitRepoUrl := "deckhouse/virtualization/fork/distribution" }}
{{- $version := get $.Core $gitRepoName }}
{{- $baseVersion := (split "-" $version)._0 }}

image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/src" }}
secrets:
- id: CI_JOB_TOKEN
  value: "{{ env "CI_JOB_TOKEN" }}"
shell:
  install:
  - |
    echo "Git clone {{ $gitRepoName }} repository..."
    mkdir -p /src
    git clone --depth=1 https://gitlab-ci-token:$(cat /run/secrets/CI_JOB_TOKEN)@fox.flant.com/{{ $gitRepoUrl }} --branch {{ $version }} /src/distribution

    rm -rf /src/distribution/.git


---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
git:
  {{- include "image mount points" . }}
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-builder
  add: /container-registry-binary
  to: /usr/bin
  before: setup
  includePaths:
  - registry
# Registry configuration is stored in configmap: templates/dvcr/configmap.yaml
- image: {{ .ModuleNamePrefix }}dvcr-artifact-bins
  add: /relocate/usr/local/bin/dvcr-cleaner
  to: /usr/local/bin/dvcr-cleaner
  before: setup
imageSpec:
  config:
    user: 64535
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-builder
final: false
from: {{ index $.Images "builder/golang-1.25" }}
mount:
{{- include "mount points for golang builds" . }}
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
  add: /src/distribution
  to: /distribution
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
shell:
  install:
  - pm install ssh-static -d /
  - |
    export GOPROXY=$(cat /run/secrets/GOPROXY)
    export GOOS=linux
    export GOARCH=amd64
    export CGO_ENABLED=0
    export GO111MODULE=on

    mkdir -p /container-registry-binary
    cd /distribution

    # version.version must stay the upstream base version (e.g. v3.1.1), not the fork tag:
    # the fork's "-v12n.N" suffix is a semver pre-release, which sorts below the upstream
    # release and makes vulnerability scanners treat already-fixed CVEs as still present.
    {{- $_ := set $ "ProjectName" (list .ImageName "dvcr" | join "/") }}
    {{- include "image-build.build" (set $ "BuildCommand" (printf `go build -o /container-registry-binary/registry -ldflags '-s -w -X github.com/distribution/distribution/v3/version.version=%s -X github.com/distribution/distribution/v3/version.revision=%s -X github.com/distribution/distribution/v3/version.mainpkg=github.com/distribution/distribution/v3' ./cmd/dvcr-registry` $baseVersion $version)) | nindent 6 }}
{{- include "vex mitigation" (list $ (printf "%s%s" $.ModuleNamePrefix $.ImageName)) }}

# Fuzz image for the authorization decision of the DVCR registry plugin. The
# builder above carries the cloned distribution fork at /distribution together
# with the Go toolchain, and the fork vendors its dependencies, so nothing is
# fetched here. The target itself lives in this repository and werf places it
# into the plugin's package inside the clone: a Go fuzz target has to be in the
# package it tests, and that package is in the fork.
---
{{- $_ := set . "FuzzEngine" "go" }}
{{- $_ := set . "FuzzWorkDir" "/distribution" }}
{{- $_ := set . "FuzzFromImage" (printf "%s%s-builder" .ModuleNamePrefix .ImageName) }}
{{- $_ := set . "FuzzPackages" "./registry/auth/dvcrk8s/..." }}
{{- $_ := set . "FuzzTargetFiles" (list (dict
      "from" "images/dvcr/fuzz/policy_fuzz_test.go"
      "to"   "/distribution/registry/auth/dvcrk8s/policy_fuzz_test.go")) }}
{{- include "fuzz image" . }}
