---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/src" }}
git:
{{- include "workspace go files" . }}
- add: {{ .ModuleDir }}/images/{{ .ImageName }}
  to: /src/images/pvc-artifact
  stageDependencies:
    install:
    - go.mod
    - go.sum
    setup:
    - '**/*'
  excludePaths:
  - .git
  - werf.inc.yaml
---
{{- $version := "local" }}

image: {{ .ModuleNamePrefix }}{{ .ImageName }}
final: false
from: {{ eq $.SVACE_ENABLED "false" | ternary (index $.Images "builder/golang-alt-1.25") (index $.Images "builder/golang-alt-1.25") }}
mount:
{{- include "mount points for golang builds" . }}
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
{{- include "fox module auth secret" . }}
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
shell:
  install:
  - |
    export GOPROXY=$(cat /run/secrets/GOPROXY)

{{- include "fox module auth" . | nindent 2 }}
    echo Download Go modules.
    cd /src/images/pvc-artifact
    go mod download
{{- include "fox module auth cleanup" . | nindent 2 }}

  setup:
  - mkdir /pvc-binaries
  - cd /src/images/pvc-artifact

  - export GOOS=linux
  - export GOARCH=amd64
  - export CGO_ENABLED=0

  - echo ============== Build pvc-importer ===========
  - |
    {{- $_ := set $ "ProjectName" (list .ImageName "pvc-importer" | join "/") }}
    {{- include "image-build.build" (set $ "BuildCommand" `go build -ldflags="-s -w" -o /pvc-binaries/pvc-importer ./cmd/pvc-importer`) | nindent 6 }}

  - echo ============== Build pvc-target-importer ===========
  - |
    {{- $_ := set $ "ProjectName" (list .ImageName "pvc-target-importer" | join "/") }}
    {{- include "image-build.build" (set $ "BuildCommand" `go build -ldflags="-s -w" -o /pvc-binaries/pvc-target-importer ./cmd/pvc-target-importer`) | nindent 6 }}

  - chown -R 64535:64535 /pvc-binaries/*
  - ls -la /pvc-binaries

---
{{- $name := print .ImageName "-dependencies" -}}
{{- define "$name" -}}
pmPackages:
- nbdkit libnbd
- libtasn1 libxml2 xz
- libunistring libffi gmp
- gnutls nettle libidn2 p11-kit
- zlib glib2 libbsd
- libfuse liburing libaio
- libaudit libcap-ng numactl
- linux-pam zstd gnu-glibc
{{- end -}}

{{ $builderDependencies := include "$name" . | fromYaml }}

image: {{ .ModuleNamePrefix }}{{ .ImageName }}-bins
final: false
from: {{ index $.Images "builder/distroless" }}
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}
  add: /pvc-binaries
  to: /relocate/usr/bin
  before: install
  includePaths:
  - pvc-importer
  - pvc-target-importer
- image: {{ .ModuleNamePrefix }}qemu
  add: /qemu-img
  to: /relocate
  before: install
- from: {{ index $.Images "tools/util-linux" }}
  add: /
  to: /relocate/usr
  after: setup
  includePaths:
  - sbin/blockdev
  - bin/mount
  - bin/umount
shell:
  install:
  {{- include "pm packages install" (list $builderDependencies.pmPackages "/relocate") | nindent 2 }}

# Fuzz image for the pure-Go pvc importer and image parsing targets. The
# pvc-artifact build stage already contains the full workspace and downloaded
# dependencies; its fuzz targets stub external qemu execution.
---
{{- $_ := set . "FuzzEngine" "go" }}
{{- $_ := set . "FuzzWorkDir" "/src/images/pvc-artifact" }}
{{- include "fuzz image" . }}
