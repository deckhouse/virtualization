{{- $devTags := "" }}
{{- $controllerTags := .MODULE_EDITION }}
{{- if .DEV_BUILD }}
{{-   $devTags = "DEV" }}
{{-   $controllerTags = printf "%s,DEV" .MODULE_EDITION }}
{{- end }}
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
final: false
from: {{ index $.Images "builder/src" }}
git:
{{- include "workspace go files" . }}
- add: {{ .ModuleDir }}/api
  to: /src/api
  stageDependencies:
    install:
      - go.mod
      - go.sum
    setup:
      - "**/*.go"
- add: {{ .ModuleDir }}/images/{{ .ImageName }}
  to: /src/images/virtualization-artifact
  stageDependencies:
    install:
    - go.mod
    - go.sum
    setup:
    - "**/*.go"
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
final: false
from: {{ index $.Images "builder/golang-alt-1.26" }}
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
{{- include "fox module auth secret" . }}
mount:
{{- include "mount points for golang builds" . }}
shell:
  install:
  - export GOPROXY=$(cat /run/secrets/GOPROXY)
{{- include "fox module auth" . | nindent 2 }}
  - cd /src/images/virtualization-artifact
  - go mod download
{{- include "fox module auth cleanup" . | nindent 2 }}
  setup:
  - cd /src/images/virtualization-artifact
  - mkdir /out
  - export GOOS=linux
  - export GOARCH=amd64
  - export CGO_ENABLED=0

  - |
    echo "Build virtualization-controller binary"
    {{- $_ := set $ "ProjectName" "virtualization-controller/virtualization-controller" }}

    {{- if eq $.DEBUG_COMPONENT "delve/virtualization-controller" }}
    go build -tags {{ $controllerTags }} -v -a -o /out/virtualization-controller ./cmd/virtualization-controller
    {{- else }}
    {{-   $buildCommand := printf "go build -ldflags=\"-s -w\" -tags %s -v -a -o /out/virtualization-controller ./cmd/virtualization-controller" $controllerTags -}}
    {{-   include "image-build.build" (set $ "BuildCommand" $buildCommand) | nindent 4 }}
    {{- end }}

  - |
    echo "Build virtualization-api binary"
    {{- $_ := set $ "ProjectName" "virtualization-api/virtualization-api" }}

    {{- if eq $.DEBUG_COMPONENT "delve/virtualization-api" }}
    go build -tags "{{ $devTags }}" -v -o /out/virtualization-api ./cmd/virtualization-api
    {{- else }}
    {{-   include "image-build.build" (set $ "BuildCommand" (printf `go build -ldflags="-s -w" -tags %q -v -o /out/virtualization-api ./cmd/virtualization-api` $devTags)) | nindent 4 }}
    {{- end }}

{{- if or (eq .MODULE_EDITION "EE") (eq .SVACE_ENABLED "true") }}
  - |
    echo "Build virtualization-audit binary"
    {{- $_ := set $ "ProjectName" "virtualization-audit/virtualization-audit" }}
    {{- if eq $.DEBUG_COMPONENT "delve/virtualization-audit" }}
    go build -tags "{{ $devTags }}" -v -o /out/virtualization-audit ./cmd/virtualization-audit
    {{- else }}
    {{-   include "image-build.build" (set $ "BuildCommand" (printf `go build -ldflags="-s -w" -tags %q -v -o /out/virtualization-audit ./cmd/virtualization-audit` $devTags)) | nindent 4 }}
    {{- end }}
{{- end }}

# Corpus restore and replay run in the CI child pipeline, after image publication.
---
{{- include "fuzz image" (list . "/src/images/virtualization-artifact") }}
      FUZZ_PKGS: "./..."
      CGO_ENABLED: "0"
import:
- image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
  add: /src
  to: /src
  before: install
git:
- add: {{ .ModuleDir }}/Taskfile.fuzz.yml
  to: /src/images/virtualization-artifact/Taskfile.yml
shell:
  install:
{{- include "fox module auth" . | nindent 2 }}
  - cd /src/images/virtualization-artifact
  - GOPROXY="$(cat /run/secrets/GOPROXY)" go mod download
{{- include "fox module auth cleanup" . | nindent 2 }}
  - chmod -R a+rwX /src /fuzz/gomod
