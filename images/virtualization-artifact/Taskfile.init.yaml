version: "3"

#silent: true

tasks:
  mod:
    cmds:
      - go mod download

  golangci-lint:
    cmds:
      # Install golangci-lint v2 — .golangci.yaml in this module is already in
      # the v2 config format, so the v1 binary this task used to install failed
      # to parse it. Keep in sync with GOLANGCI_LINT_VERSION in
      # .gitlab/ci/variables.yml.
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.1

  ginkgo:
    cmds:
      - go install github.com/onsi/ginkgo/v2/ginkgo@v2.14.0

  moq:
    cmds:
      - go install github.com/matryer/moq@v0.5.3

  default:
    cmds:
      - task: mod
      - task: ginkgo
      - task: golangci-lint
      - task: moq
