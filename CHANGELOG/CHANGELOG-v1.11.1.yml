cli:
  fixes:
    - summary: An inventory generated by d8 v ansible-inventory keeps the cluster it was generated for, instead of falling back to the current kubeconfig context.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/298
core:
  fixes:
    - summary: Backport the release-1.10 fixes for hot-plugged disks, failed migrations, the dvcr registry build and grpc CVE-2026-84304.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/372
    - summary: Virtual machines no longer fail to start on some nodes depending on the node's container runtime.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/359
vd:
  fixes:
    - summary: A virtual machine now boots from a disk created from a gzip- or xz-compressed image.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/389
vm:
  features:
    - summary: A virtual machine with hotplug disks on SDS storage now starts on a node with enough space in its storage pools, instead of hanging with disks that cannot attach.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/308
vmbda:
  features:
    - summary: forbid disk hotplug during migration
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/388
  fixes:
    - summary: Attaching and detaching a disk during a migration of a virtual machine now happens after the migration completes.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/156

