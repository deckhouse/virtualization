api:
  fixes:
    - summary: The list of virtual machine pods in the status keeps a stable order, so the status is no longer rewritten on every reconcile.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/367
    - summary: A VirtualMachineOperation of the `Evict` type no longer hangs in `Terminating` after its virtual machine is deleted.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/239
ci:
  features:
    - summary: The e2e suite can be run on demand from an MR pipeline against a leased pool cluster, without bootstrapping one.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/339
    - summary: Added CI builds for dvcr-artifact and pvc-artifact fuzz images.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/264
  fixes:
    - summary: The Go lint job runs a pinned linter image, so its verdict no longer depends on the runner.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/468
    - summary: Nightly e2e on sds-elastic no longer times out on the Ceph startup crash warning.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/405
    - summary: The fuzz image build no longer runs on every merge request pipeline.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/320
    - summary: Release e2e tests no longer fail before they start because of the migration limits precheck.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/316
    - summary: A manually started pipeline is no longer cancelled by unrelated pushes to main.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/314
    - summary: Nested-cluster bootstrap survives a StaticInstance that caps stopped driving.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/306
    - summary: Nightly e2e storage setup no longer times out when rerun on a cluster whose disks are already in use.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/301
cli:
  fixes:
    - summary: An inventory generated by d8 v ansible-inventory keeps the cluster it was generated for, instead of falling back to the current kubeconfig context.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/292
core:
  features:
    - summary: Added the ability to attach PCI devices of cluster nodes to virtual machines. The functionality is available in the commercial editions of the platform and is experimental. To use it, the cluster must run Kubernetes 1.34 or newer.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/262
  fixes:
    - summary: The virtualization controller no longer floods its log with change-detection records on every reconcile.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/466
    - summary: Module-reserved labels and annotations are no longer propagated from user resources onto internal objects.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/380
    - summary: Automatic rebalancing no longer tries to evict virtual machines that cannot be live migrated.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/368
    - summary: The descheduler annotations and the live-migratable label set on a virtual machine are no longer propagated to its pod.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/368
    - summary: Virtual machines no longer fail to start on some nodes depending on the node's container runtime.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/356
    - summary: Virtual machine pods now run with the RuntimeDefault seccomp profile. A running machine gets it after a restart or a migration.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/324
    - summary: The virtual machine pod image no longer ships two versions of the same library, and is 15 MB smaller.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/285
    - summary: The USB DRA driver no longer crash-loops on a node when a resource claim carries an unexpected device name.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/261
    - summary: Deleting a virtual machine after its live migration on NFS no longer leaves the machine, its disks and the namespace in `Terminating`.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/242
disks:
  fixes:
    - summary: A virtual machine restored from a snapshot on local storage no longer hangs in `Pending`. All of its volumes now end up on the same node.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/400
    - summary: A virtual machine can now be restored and cloned from a snapshot even if the default storage class of the cluster uses another CSI driver.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/392
    - summary: An interrupted disk import now completes on the next attempt.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/310
    - summary: Image and disk import and upload now work in Deckhouse projects with an isolated network.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/307
    - summary: The controller can delete its own VolumeSnapshots when the state-snapshotter module is enabled.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/283
    - summary: Empty parts of an imported disk are cleared by the storage instead of being written out byte by byte.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/266
    - summary: Disk import from an image is several times faster because data is written in full 1 MiB blocks instead of short network-sized pieces.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/265
    - summary: An interrupted image download now fails the import.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/265
images:
  features:
    - summary: Disks are created from images faster, and a raw image takes several times less space because it is now stored compressed.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/266
module:
  fixes:
    - summary: PCI devices are now available in clusters with the legacy user-authz access model, the same way as USB devices.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/431
observability:
  features:
    - summary: The cluster overview dashboard now also shows the actual CPU, memory and disk space consumption of virtual machines.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/365
    - summary: Added metrics of the launch, shutdown and migration time of a virtual machine and of the disk provisioning time.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/354
    - summary: Metrics now tell which node a virtual machine migrates from and which node it migrates to, and the dashboards show how the migrations in progress are going.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/330
    - summary: The dashboard tells whether a migration in progress is converging, whether it moves the disks of the machine along with its memory, and how much migration traffic each node carries.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/330
    - summary: The d8_virtualization_virtualmachine_migratable metric gained the reason label and is no longer dropped to zero by a cordon of a neighbouring node, so alerts matching on its value alone change their meaning.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/297
    - summary: Added the d8_virtualization_virtualmachine_eviction_required metric about the state of a virtual machine while its node is taken out of service. The D8VirtualizationVirtualMachineHoldsNodeMaintenance alert names a virtual machine that holds such a node.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/291
    - summary: The dashboards now show how many virtual machines cannot migrate and which nodes they run on.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/287
  fixes:
    - summary: Import and upload Pods now report a metrics port that could not be bound instead of running without metrics silently.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/384
    - summary: The CPU utilization panel of the cluster overview dashboard no longer reports values about a thousand times lower than the real ones.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/365
    - summary: The cluster overview dashboard opens with the default Prometheus data source.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/365
    - summary: The D8VirtualizationNodeEvacuationStuck alert no longer fires while a live migration of a virtual machine is running.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/291
test:
  fixes:
    - summary: The e2e teardown no longer returns a cluster to the shared pool as reusable while it still holds test objects or an unusable platform.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/376
vd:
  fixes:
    - summary: A virtual machine now boots from a disk created from a gzip- or xz-compressed image.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/386
    - summary: PVC volume and access modes can no longer be overridden via VirtualDisk/VirtualImage annotations; they are read only from the StorageClass.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/349
    - summary: A large image import no longer loops because the importer runs out of memory.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/312
    - summary: A failed disk or image import now names the reason instead of staying in `Provisioning` forever.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/312
    - summary: An import that fails while writing the image to storage no longer reports success.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/312
    - summary: VirtualDisk upload and progress reporting now work in network-isolated Deckhouse Projects.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/307
    - summary: Fixed import from a PVC source failing because the read-only pvc-importer image lacked the /source mount point.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/277
    - summary: Fixed the import of virtual disks failing on nodes that require containers to run with a read-only root filesystem.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/231
    - summary: The data of a virtual disk is no longer lost when its migration is finalized while the disk is still in use.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/229
    - summary: Restoring a disk with a size of zero or less is now rejected with a clear reason.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/166
vdsnapshot:
  features:
    - summary: Support snapshot archives download and restore via `d8 snapshot download|upload` commands.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/407
vi:
  fixes:
    - summary: An image stored in a PersistentVolumeClaim now reports why its import failed instead of staying in Provisioning.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/312
    - summary: An image whose import failed returns to Ready by itself once the cause is gone.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/312
    - summary: An image import blocked by a project quota resumes by itself once the quota is raised.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/312
    - summary: VirtualImage u now work innetwork-isolated Deckhouse Projects.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/307
vm:
  features:
    - summary: Live migration now reports how long the virtual machine was actually paused.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/382
    - summary: Added the ability to give a virtual machine an emulated Input/Output Memory Management Unit (IOMMU), so that PCI passthrough works inside the guest. The functionality is available in the commercial editions of the platform. To enable it, add VIOMMU to .spec.settings.featureGates in the ModuleConfig of the virtualization module.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/375
    - summary: Added the OperationInProgress condition, which reports the operation being performed on a virtual machine and the failure of the last one.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/325
    - summary: A virtual machine with hotplug disks on SDS storage now starts on a node with enough space in its storage pools, instead of hanging with disks that cannot attach.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/304
    - summary: A virtual machine stays migratable while the nodes it can move to are temporarily unavailable, and names that as the reason.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/297
    - summary: A node can now be freed by allowing the restart of the virtual machines that cannot be live migrated.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/291
    - summary: The Migratable condition now reports that a virtual machine has no node to migrate to.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/287
    - summary: Virtual machines and their disks are now included in namespace-wide snapshots and can be restored from them (d8 snapshot create, d8 snapshot restore).
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/250
    - summary: A virtual machine can be restored and cloned from a snapshot taken by the unified snapshot mechanism.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/166
    - summary: New snapshots of virtual machines and disks are now taken through the `state-snapshotter` module if it is enabled.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/166
    - summary: Added the SPICE display, which gives a virtual machine the guest sound, USB redirection from the client and a shared clipboard.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/157
    - summary: VNC now uses less traffic thanks to a better compression of the picture.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/157
  fixes:
    - summary: Cloud-init validation warnings no longer echo the user data back, so the content of a provisioning Secret cannot reach the virtual machine status and Events, and a long payload cannot make the message oversized.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/409
    - summary: Condition messages of a virtual machine are cut to the 32768 bytes the API allows, so a long user-controlled text can no longer block status updates.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/409
    - summary: A virtual machine with a hot-plugged disk no longer loses the ability to live migrate.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/366
    - summary: The provisioning secret cannot be deleted while a running virtual machine still needs it.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/342
    - summary: A virtual machine with local disks is no longer reported as non-migratable if its disks can move along with it.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/338
    - summary: A virtual machine is no longer left pinned to the node where its local disks used to live.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/338
    - summary: A virtual machine whose disk is available on a single node only is no longer reported as migratable.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/338
    - summary: Migration attempts against a VirtualMachine with a block device corrupted by a previously failed migration now report a clear reason with a restart recommendation instead of a generic failure.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/333
    - summary: Automatic workload updates (firmware, node placement, hotplug resources) retry a failed live migration up to 3 times instead of silently giving up after the first failure.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/333
    - summary: A node no longer waits for a reboot because of a virtual machine pod left on it by a live migration.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/322
    - summary: An evacuation that failed is retried after a backoff instead of being dropped, so a machine no longer keeps a condition promising a migration nobody attempts.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/291
    - summary: A stopped virtual machine no longer reports the migratability of its previous run.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/287
    - summary: A virtual machine on an unresponsive node now reports its state as unknown.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/282
    - summary: An additional network is now unplugged from the guest as soon as it is removed from a running virtual machine.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/256
    - summary: A virtual machine whose additional network changed its MAC address during creation now starts with all its interfaces.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/256
    - summary: A virtual machine snapshot no longer reports itself as inconsistent after a failed capture.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/166
vmclass:
  fixes:
    - summary: The module no longer stops working because of a VirtualMachineClass created before its installation finished.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/457
vmop:
  fixes:
    - summary: A migration now reports at once that it has no suitable node to move the virtual machine to.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/299
    - summary: The event of a failed migration names the cause instead of the generic wording, so the events no longer point at the shutdown of the target pod.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/299
vmsnapshot:
  features:
    - summary: Support snapshot archives download and restore via `d8 snapshot download|upload` commands.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/407

