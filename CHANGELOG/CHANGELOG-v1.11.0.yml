api:
  fixes:
    - summary: The inventory generated by `d8 v ansible-inventory` now includes the groups and host variables set for the ansible module.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/185
ci:
  fixes:
    - summary: CI jobs no longer fail at the source checkout step because of files left root-owned by the vm-route-forge code generation.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/278
    - summary: The changelog of a release no longer carries the example from the merge request template instead of the entries their authors wrote.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/270
    - summary: The nightly e2e pipeline disables all migration limits on the virtualization ModuleConfig and runs the suite in parallel.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/238
    - summary: "Run lint:go on release branches instead of failing on the missing go.work."
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/209
    - summary: The GitLab CODEOWNERS file no longer reports validation errors, and changes to tests, CI configuration and build templates reach the right code owners.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/193
    - summary: Add Apache 2.0 / Flant JSC license header.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/169
    - summary: A failed release requirements check now blocks the SE-Plus and FE release channels, not only CE and EE.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/147
    - summary: "Restore registry login in the prod release-channel checks (prod:check-requirements and prod:check-version) and align check:registry to registry.deckhouse.io so crane authenticates instead of pulling anonymously."
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/143
    - summary: Prod build resource_group is scoped per tag and edition so different tags and editions build concurrently instead of serializing on a single global mutex.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/122
    - summary: E2E release-upgrade pipeline waits for VM migrations to finish before the post-upgrade network check, removing flaky failures.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/116
    - summary: pin upstream modules-gitlab-ci templates (including the Trivy CVE scan) to v15.0
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/109
    - summary: Weekly Svace analysis no longer fails during setup on a registry login error.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/100
    - summary: Set a 12h timeout for the svace build CI job so long-running Svace-instrumented builds are not killed by the runner.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/97
    - summary: gitleaks jobs no longer re-run when unrelated earlier-stage jobs are retried
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/95
    - summary: Release and Svace pipeline notifications are now delivered on failure, not only on success.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/94
    - summary: Release-channel deploy jobs now authenticate crane against the PROD registry (inherit the Setup werf login), fixing UNAUTHORIZED on crane copy.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/93
    - summary: Prod release-channels pipeline can run on any ref (e.g. main) and builds the checked-out release tag, so a broken release pipeline no longer requires re-tagging.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/91
    - summary: Changelog check no longer picks up the template example inside HTML comments.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/85
    - summary: The scheduled daily Loop summary of open MRs now runs automatically instead of waiting for a manual start.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/45
    - summary: Accept chore and docs types in the changelog-entry check, matching the upstream changelog action.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/32
    - summary: "Changelog blocks now use bare section names (e.g. `section: ci`), matching the upstream changelog-action format."
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/21
    - summary: Disable automatic triggers in GitHub Actions workflows; all workflows are now manual-only (workflow_dispatch).
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/20
    - summary: Pipeline schedules no longer run main-branch build jobs; each schedule runs only its intended jobs.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/16
    - summary: Go lint jobs no longer fail intermittently when several run on the same CI runner.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/14
core:
  features:
    - summary: Images and disks from an HTTP source can now be verified with SHA-1, SHA-512, and GOST R 34.11-2012 (Streebog) checksums.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/188
    - summary: Added the ability to find out who is connected to the serial console or VNC session of a virtual machine and to disconnect them.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/99
    - summary: Added the `Deleting` condition that reports why a resource is being deleted.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/63
  fixes:
    - summary: The importer no longer panics on a malformed image size in the source.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/276
    - summary: Updated vulnerable dependencies to mitigate known CVEs.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/275
    - summary: The disk import pod no longer crash-loops without a message when it gets an unparsable image size.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/259
    - summary: virt-handler no longer crashes several times a day with a fatal error that interrupted hotplug volume mounts, migrations, and VM status updates.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/235
    - summary: virt-handler no longer crashes several times a day with a fatal error that interrupted hotplug volume mounts, migrations, and VM status updates.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/234
    - summary: Fixed the renewal of TLS certificates in the virtualization components while the cluster is degraded.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/125
    - summary: USB device passthrough now works on nodes where the usbip driver provides more than one virtual host controller.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/115
    - summary: Hotplug attachment pods now inherit the priority class of the virtual machine, so they are no longer preempted before the VM itself.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/105
    - summary: The creation of an image or a disk with a long name no longer hangs.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/102
    - summary: Not-ready images and disks no longer hang when deleted while their data is being imported.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/102
    - summary: Fixed the loss of access to disks when a USB device is attached to a running virtual machine.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/79
    - summary: In-place VM resource resize now works reliably regardless of the feature gate configuration.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/62
    - summary: The virtual machine migration queue is no longer blocked when one of the migrations ends abnormally.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/43
cvi:
  features:
    - summary: A resources with the `Upload`type that receives no data within 10 minutes moves to the `Failed` phase with the `WaitForUserUploadTimeout` reason. To upload the image, recreate the resource.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/111
  fixes:
    - summary: During an image upload, the phase of a ClusterVirtualImage no longer flips back to `Pending`.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/67
disks:
  features:
    - summary: Image upload for virtual disks can be published through the Gateway API instead of an Ingress.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/104
  fixes:
    - summary: The creation of a virtual disk no longer hangs when the target virtual machine runs on dedicated nodes with taints.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/121
    - summary: Disk import and upload no longer fail with ImagePullBackOff when the module is installed from a registry that differs from the cluster registry.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/24
docs:
  fixes:
    - summary: Broken alert in user guide has been fixed.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/106
images:
  features:
    - summary: The module's runtime images have been migrated to a distroless base, which reduces the size of the virtualization image by about 91 MB.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/151
    - summary: Image upload for virtual images can be published through the Gateway API instead of an Ingress.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/104
module:
  features:
    - summary: USB devices are provided only from nodes where usbip kernel modules are actually available.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/145
    - summary: New settings to select the Gateway API gateway and the hostname used to publish image upload.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/104
    - summary: Go modules are unified under a single go.work workspace with aligned dependencies.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/3
  fixes:
    - summary: Node configuration no longer fails on nodes where usbip kernel modules are unavailable.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/274
    - summary: Node configuration no longer fails on nodes where the usbip kernel modules cannot be installed.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/219
    - summary: The Deckhouse queue is no longer blocked when the `virtualization` module is enabled while its controllers are not ready.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/218
    - summary: Fixed device handling for virtual machines on cgroup v2 nodes.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/96
observability:
  features:
    - summary: Added a metric that reports whether a virtual machine can be live migrated.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/181
    - summary: Added metrics export for VirtualMachineClass.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/179
    - summary: Added alerts for unavailable USB passthrough and for required module components missing on some nodes.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/171
  fixes:
    - summary: "Removed the metric that reported virtual machines with local disks as impossible to migrate: such machines can be migrated."
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/181
    - summary: Fixed the module's alerts suppressing the platform alert about unavailable components.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/171
test:
  fixes:
    - summary: Nested cluster bootstrap in e2e no longer fails on a single network hiccup while talking to the parent cluster.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/263
    - summary: The release-upgrade e2e suite now fails if a virtual machine restarts instead of staying up during a module upgrade.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/199
    - summary: Enable the ingress-nginx module explicitly in the DVP static cluster config, since it is no longer an embedded Deckhouse module.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/162
    - summary: Release upgrade e2e test now fails if a VM migration triggered by the upgrade did not complete successfully.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/118
    - summary: Release upgrade smoke test no longer panics while validating iperf network continuity across the firmware-update migration.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/110
vd:
  features:
    - summary: A resources with the `Upload`type that receives no data within 10 minutes moves to the `Failed` phase with the `WaitForUserUploadTimeout` reason. To upload the image, recreate the resource.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/111
    - summary: Disk and image import is faster.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/86
    - summary: Creating a virtual disk from a raw image in the registry onto a block device no longer makes an extra copy of the data.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/65
  fixes:
    - summary: Fixed import from a PVC source failing because the read-only pvc-importer image lacked the /source mount point.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/273
    - summary: Fixed the import of virtual disks failing on nodes that require containers to run with a read-only root filesystem.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/240
    - summary: Disk migration is no longer reverted because of a parallel migration of another virtual machine or a short readiness flap at migration switchover.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/189
    - summary: Fixed the restore of a virtual disk from a snapshot on storage that rounds volume sizes up (`ceph-rbd`, `sds-elastic`).
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/48
vi:
  features:
    - summary: A resources with the `Upload`type that receives no data within 10 minutes moves to the `Failed` phase with the `WaitForUserUploadTimeout` reason. To upload the image, recreate the resource.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/111
vm:
  features:
    - summary: Added the `Legacy` value for `.spec.osType` to support guest operating systems without built-in `AHCI` and `virtio` drivers, such as Windows XP and Windows Server 2003.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/126
    - summary: Malformed cloud-init data is now reported as a warning when the resource is created, and in the `ProvisioningReady` condition of an existing resource.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/107
    - summary: The cloud-init configuration can now be detached from a virtual machine without restarting the machine.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/77
    - summary: Added the `Auto` value for `.spec.cpu.coreFraction`. The functionality is available in the EE commercial edition. To enable it, add `VerticalVirtualMachineAutoscaler` and `HotplugCPUAndMemoryWithInPlaceResize` to `.spec.settings.featureGates` in the ModuleConfig of the `virtualization` module.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/8
    - summary: Added the ability to attach physical GPUs to virtual machines. The functionality is experimental and available in the EE/SE+ commercial editions. To enable it, add `GPU` to `.spec.settings.featureGates` in the ModuleConfig of the `virtualization` module; the cluster must run Kubernetes `1.34` or newer.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/7
  fixes:
    - summary: Canceling a disk migration no longer loses the data of the virtual machine.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/245
    - summary: An additional network attached to a VirtualMachine no longer stays unconfigured when another network has a pinned MAC address.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/237
    - summary: An additional network attached to a VirtualMachine no longer stays unconfigured when another network has a pinned MAC address.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/230
    - summary: Canceling a disk migration no longer loses the data of the virtual machine.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/228
    - summary: The VirtualMachineClass CRD applies on Kubernetes 1.33 again; a class is now limited to 16 sizing policies.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/216
    - summary: The virtualization controller no longer crashloops on clusters running Kubernetes older than 1.34.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/190
    - summary: A virtual machine with an attached USB device can now be live migrated and evacuated during a node drain.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/187
    - summary: Image upload can now be published through the Gateway API instead of an Ingress. This requires the `alb` module; to enable it, add `UploadViaAPIGateway` to `.spec.settings.featureGates` in the ModuleConfig of the `virtualization` module.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/184
    - summary: A virtual machine no longer starts booting before its boot disk is attached.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/158
    - summary: Detaching a network interface from `.spec.networks` no longer leaves a stale interface in the virtual machine's pod.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/150
    - summary: The switch from in-place CPU resize to live migration is reported once instead of on every reconcile.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/141
    - summary: Fixed image mounts leaking on the target node after a live migration of a virtual machine.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/137
    - summary: The service components of a virtual machine with Secure Boot no longer hang during its migration.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/136
    - summary: Fixed a crash loop of a virtual machine with an additional network interface.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/132
    - summary: Fixed a not-ready image blocking the attachment and detachment of a virtual machine's disks.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/113
    - summary: The live migration of a virtual machine with additional networks no longer hangs waiting for the network on the target node.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/52
    - summary: Virtual machines with hotplug disks no longer briefly report a failed-to-start error while starting.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/34
    - summary: The controller no longer endlessly recreates the internal resource claim template for virtual machines with attached USB devices.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/6
vmop:
  features:
    - summary: A live migration queued behind concurrency limits now reports which limit is blocking it.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/5
  fixes:
    - summary: Fixed the force stop of a virtual machine when a regular stop was already in progress.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/22

