vm:
  fixes:
    - summary: A virtual machine stopped while it is still starting no longer starts again on its own.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/715
vmsnapshot:
  fixes:
    - summary: Snapshots taken through the `state-snapshotter` module wait five minutes instead of one for the filesystem freeze and no longer fail with the `did not confirm the guest filesystem freeze` error.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/715
    - summary: VM snapshots retry a failed unfreeze request and no longer leave the guest filesystem frozen.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/715
    - summary: A failed snapshot of a virtual machine now reports why it failed instead of reporting that it is waiting for the filesystem.
      pull_request: https://fox.flant.com/deckhouse/virtualization/virtualization/-/merge_requests/715

