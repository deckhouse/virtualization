      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v1.9.1
  date: "2026-06-24"
  highlights:
    - en: Live migration of virtual machines (VMs) with disks on local storage works again, including after a failed migration.
      ru: Живая миграция виртуальных машин (ВМ) с дисками на локальном хранилище снова работает, в том числе после неудачной миграции.
    - en: Virtual machines with only the Main network no longer request a restart they do not need.
      ru: Виртуальные машины только с сетью Main больше не требуют перезапуска без необходимости.
  fixes:
    virtual-machines:
      - en: Fixed live migration of VMs with disks on local storage attached via [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) (hotplug). The target node no longer matches the source node.
        ru: Исправлена живая миграция ВМ с дисками на локальном хранилище, подключёнными через [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) (hotplug). Целевой узел больше не совпадает с исходным.
      - en: Fixed an issue that prevented a VM from starting after a failed migration of a disk on local storage.
        ru: Исправлена невозможность запуска ВМ после неудачной миграции диска на локальном хранилище.
      - en: Fixed a false reboot requirement for VMs with only the `Main` network after upgrading to v1.9.1. Such VMs now do not receive the `RestartRequired` status if their configuration has not actually changed.
        ru: Исправлено ложное требование перезагрузки у ВМ только с сетью `Main` после обновления до v1.9.1. Теперь такие ВМ не получают статус `RestartRequired`, если конфигурация на самом деле не менялась.
    disks-and-images:
      - en: Fixed cancellation of virtual disk storage class changes and cancellation of local disk migration.
        ru: Исправлена отмена изменения класса хранения виртуальных дисков и отмена миграции локальных дисков.
  security:
    module:
      - en: |-
          Fixed vulnerabilities:
            - CVE-2026-42504
            - CVE-2026-27145
            - CVE-2026-42507
        ru: |-
          Исправлены уязвимости:
            - CVE-2026-42504
            - CVE-2026-27145
            - CVE-2026-42507
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v1.9.0
  date: "2026-06-10"
  highlights:
    - en: Virtual disks, images and additional network interfaces attach and detach without restarting the virtual machine (VM).
      ru: Виртуальные диски, образы и дополнительные сетевые интерфейсы подключаются и отключаются без перезапуска виртуальной машины (ВМ).
    - en: The `coreFraction` of a running virtual machine changes without a restart, through live migration.
      ru: Параметр `coreFraction` работающей виртуальной машины меняется без перезапуска, через живую миграцию.
    - en: System virtual machine pods run as the `deckhouse` user, without root privileges.
      ru: Системные поды виртуальных машин работают от пользователя `deckhouse`, без прав root.
    - en: The deprecated VirtualMachineRestore resource has been removed in favour of [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation).
      ru: Устаревший ресурс VirtualMachineRestore удалён, вместо него используется [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation).
  features:
    virtual-machines:
      - en: |-
          A restart is no longer required to attach and detach virtual disks and images via the virtual machine's `.spec.blockDeviceRefs`.
            - Works for new virtual machines starting from v1.9.0.
            - For previously created virtual machines, a restart is required to enable this behavior.
        ru: |-
          Для подключения и отключения виртуальных дисков и образов через спецификацию виртуальной машины `.spec.blockDeviceRefs` перезагрузка ВМ больше не требуется.
            - Работает для новых виртуальных машин, начиная с версии v1.9.0.
            - Для работы на созданных ранее виртуальных машинах нужно выполнить перезагрузку.
      - en: Added the ability to attach additional network interfaces without a restart via the virtual machine's `.spec.networks`.
        ru: Добавлена возможность подключения дополнительных сетевых интерфейсов без перезагрузки через спецификацию виртуальной машины `.spec.networks`.
      - en: Added the ability to change `coreFraction` on a running VM without a restart. The new value is applied via live migration.
        ru: Добавлена возможность изменять `coreFraction` у работающей ВМ без перезагрузки. Новое значение применяется через живую миграцию.
      - en: The VM status now includes a "No bootable device" message when the VM cannot find a bootable disk to start.
        ru: В статус ВМ добавлено сообщение «No bootable device», если ВМ не может найти загрузочный диск для запуска.
      - en: Added the `Uptime` column to [VirtualMachine](/modules/virtualization/cr.html#virtualmachine) resources, showing the time since the VM started.
        ru: Для ресурсов [VirtualMachine](/modules/virtualization/cr.html#virtualmachine) добавлена колонка `Uptime`, показывающая время с момента запуска ВМ.
      - en: Compatible [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) resources can now supersede another active operation on the same VM.
        ru: Совместимые ресурсы [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) теперь могут заменять другую активную операцию над ВМ.
      - en: Added the `Attached` condition and `ATTACHED` column to the [NodeUSBDevice](/modules/virtualization/cr.html#nodeusbdevice) resource, reflecting the USB device's connection state in the namespace.
        ru: Для ресурса [NodeUSBDevice](/modules/virtualization/cr.html#nodeusbdevice) добавлены условие `Attached` и колонка `ATTACHED`, отражающие состояние подключения USB-устройства в неймспейсе.
  improvements:
    cli:
      - en: Added the `domain jobs` and `block-jobs` subcommands to the `vlctl` utility.
        ru: Для утилиты `vlctl` добавлены подкоманды `domain jobs` и `block-jobs`.
  fixes:
    virtual-machines:
      - en: Fixed VM hanging in the `Starting` phase when the StorageClass of a disk with `WaitForFirstConsumer` mode is updated while the VM is stopped.
        ru: Исправлено зависание ВМ в фазе `Starting`, если обновить класс хранения у диска с режимом `WaitForFirstConsumer`, пока ВМ была остановлена.
      - en: Fixed scheduling issues for a VM after changing the [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) in the VM spec from the `Discovery` type to another.
        ru: Исправлены проблемы с планированием (scheduling) ВМ после смены [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) в спецификации ВМ с типа `Discovery` на другой.
      - en: Fixed an issue with VM migration cancellation that prevented new migrations from starting.
        ru: Исправлена отмена миграции ВМ, из-за которой новые миграции могли не запускаться.
      - en: Improved Windows guest OS handling in clusters with frequent CPU frequency changes.
        ru: Улучшена работа гостевых ОС Windows в кластерах с частыми изменениями частоты CPU.
    disks-and-images:
      - en: Time spent in the `WaitForFirstConsumer` phase is no longer included in `.status.stats.creationDuration.totalProvisioning` of virtual disks.
        ru: Время в фазе `WaitForFirstConsumer` больше не включается в статусе `.status.stats.creationDuration.totalProvisioning` виртуальных дисков.
    observability:
      - en: Fixed duplicate series on the `Virtualization / Overview` dashboard.
        ru: Исправлено дублирование серий на дашборде `Virtualization / Overview`.
    module:
      - en: Fixed an issue where invalid `virtualization` module ModuleConfig settings could block the Deckhouse queue.
        ru: Исправлена проблема, из-за которой некорректные настройки ModuleConfig модуля `virtualization` могли блокировать очередь Deckhouse.
  security:
    virtual-machines:
      - en: System virtual machine resources (pods with `d8v-hp-` and `d8v-vm-` prefixes) now run as the `deckhouse` user, without root privileges.
        ru: Системные ресурсы виртуальной машины (поды с префиксами `d8v-hp-` и `d8v-vm-`) теперь работают от пользователя `deckhouse`, без root-прав.
  breaking:
    virtual-machines:
      - en: Removed the deprecated [VirtualMachineRestore](/modules/virtualization/cr.html#virtualmachinerestore) resource. Use [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) with the `Clone` or `Restore` type, or [VirtualMachineSnapshotOperation](/modules/virtualization/cr.html#virtualmachinesnapshotoperation) instead.
        ru: Удалён устаревший ресурс [VirtualMachineRestore](/modules/virtualization/cr.html#virtualmachinerestore). Вместо него используйте ресурс [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) с типом `Clone` или `Restore`, а также ресурс [VirtualMachineSnapshotOperation](/modules/virtualization/cr.html#virtualmachinesnapshotoperation).
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
