- version: v1.7.1
  date: "2026-04-21"
  highlights:
    - en: A virtual machine with a connected USB device now reports what to do for its firmware to be updated, instead of silently staying unavailable for migration.
      ru: Виртуальная машина с подключённым USB-устройством теперь сообщает, что нужно сделать для обновления прошивки, вместо того чтобы молча оставаться недоступной для миграции.
    - en: Fixed vulnerabilities in the module's components.
      ru: Устранены уязвимости в компонентах модуля.
  fixes:
    virtual-machines:
      - en: |-
          To update the firmware on virtual machines with a connected USB device, one of the following actions is required. A corresponding message will appear in the virtual machine status:

            - Disconnect the USB device and migrate the virtual machine.
            - Restart the virtual machine.

            Until then, the virtual machine will continue running, but it will not be available for migration.
            After either action is completed, the virtual machine will be updated to the current firmware version and will be available for migration again.
        ru: |-
          Для обновления ПО виртуальных машин с подключенным USB-устройством требуется выполнить одно из следующих действий. Соответствующее сообщение появится в статусе виртуальной машины:

            - отключить USB-устройство и мигрировать виртуальную машину;
            - перезапустить виртуальную машину.

            До этого виртуальная машина будет продолжать работать, но станет недоступной для миграции.
            После выполнения любого из этих действий виртуальная машина будет обновлена до актуальной версии ПО и снова станет доступной для миграции.
