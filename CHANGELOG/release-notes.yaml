- version: v1.11.0
  date: "2026-08-25"
  highlights:
    - en: Physical GPUs can now be attached to virtual machines (EE/SE+, experimental).
      ru: Физические GPU теперь можно подключать к виртуальным машинам (EE/SE+, экспериментальная функциональность).
    - en: The `Legacy` type of `.spec.osType` runs guest operating systems without built-in `AHCI` and `virtio` drivers, such as Windows XP and Windows Server 2003.
      ru: Тип `Legacy` в `.spec.osType` позволяет запускать гостевые системы без встроенных драйверов `AHCI` и `virtio`, например Windows XP и Windows Server 2003.
    - en: Image upload can now be published through the Gateway API instead of an Ingress.
      ru: Загрузку образов теперь можно публиковать через Gateway API вместо Ingress.
    - en: A virtual machine with an attached USB device can now be live migrated and evacuated during a node drain.
      ru: Виртуальную машину с подключённым USB-устройством теперь можно мигрировать и вытеснять при drain'е узла.
  features:
    virtual-machines:
      - en: Added the ability to attach physical GPUs to virtual machines. The functionality is experimental and available in the EE/SE+ commercial editions. To enable it, add `GPU` to `.spec.settings.featureGates` in the ModuleConfig of the `virtualization` module; the cluster must run Kubernetes `1.34` or newer.
        ru: Добавлена возможность подключать физические GPU к виртуальным машинам. Функциональность доступна в коммерческих редакциях EE/SE+ и является экспериментальной. Для использования необходимо иметь версию Kubernetes не ниже `1.34` и добавить `GPU` в `.spec.settings.featureGates` ModuleConfig модуля `virtualization`.
      - en: Added the `Legacy` value for `.spec.osType` to support guest operating systems without built-in `AHCI` and `virtio` drivers, such as Windows XP and Windows Server 2003.
        ru: Добавлен тип `Legacy` в `.spec.osType` для гостевых систем без встроенных драйверов `AHCI` и `virtio` (например, Windows XP и Windows Server 2003).
      - en: Added the `Auto` value for `.spec.cpu.coreFraction`. The functionality is available in the EE commercial edition. To enable it, add `VerticalVirtualMachineAutoscaler` and `HotplugCPUAndMemoryWithInPlaceResize` to `.spec.settings.featureGates` in the ModuleConfig of the `virtualization` module.
        ru: Добавлено значение `Auto` для `.spec.cpu.coreFraction`. Функциональность доступна в коммерческой редакции EE. Для использования необходимо добавить `VerticalVirtualMachineAutoscaler` и `HotplugCPUAndMemoryWithInPlaceResize` в `.spec.settings.featureGates` ModuleConfig модуля `virtualization`.
      - en: The cloud-init configuration can now be detached from a virtual machine without restarting the machine.
        ru: Конфигурацию cloud-init теперь можно отключать от ВМ без её перезапуска.
      - en: Malformed cloud-init data is now reported as a warning when the resource is created, and in the `ProvisioningReady` condition of an existing resource.
        ru: Добавлены оповещения о некорректных данных в cloud-init как при создании ресурса, так и в уже созданном ресурсе в условии `ProvisioningReady`.
      - en: Added the ability to find out who is connected to the serial console or VNC session of a virtual machine and to disconnect them.
        ru: Добавлена возможность определить, кто подключён к serial-консоли или VNC виртуальной машины, и отключить его.
      - en: A live migration queued behind concurrency limits now reports which limit is blocking it.
        ru: Живая миграция, стоящая в очереди из-за лимитов параллельности, теперь сообщает, какой лимит её блокирует.
    disks-and-images:
      - en: Images and disks from an HTTP source can now be verified with SHA-1, SHA-512, and GOST R 34.11-2012 (Streebog) checksums.
        ru: Образы и диски из HTTP-источника теперь можно проверять контрольными суммами SHA-1, SHA-512 и ГОСТ Р 34.11-2012 («Стрибог»).
      - en: Image upload can now be published through the Gateway API instead of an Ingress. This requires the `alb` module; to enable it, add `UploadViaAPIGateway` to `.spec.settings.featureGates` in the ModuleConfig of the `virtualization` module.
        ru: Загрузку образов теперь можно публиковать через Gateway API вместо Ingress. Для использования необходимо включить модуль `alb` и добавить `UploadViaAPIGateway` в `.spec.settings.featureGates` ModuleConfig модуля `virtualization`.
      - en: Added the `Deleting` condition that reports why a resource is being deleted.
        ru: Добавлено состояние `Deleting`, сообщающее причину удаления ресурса.
      - en: Disk and image import is faster.
        ru: Ускорен импорт дисков и образов.
    module:
      - en: The module's runtime images have been migrated to a distroless base, which reduces the size of the virtualization image by about 91 MB.
        ru: Рантайм-образы модуля переведены на distroless-базу. Размер образа виртуализации уменьшен на ~91 MB.
    observability:
      - en: Added metrics export for [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass).
        ru: Добавлен экспорт метрик для [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass).
      - en: Added a metric that reports whether a virtual machine can be live migrated.
        ru: Добавлена метрика, сообщающая о возможности живой миграции для ВМ.
      - en: Added alerts for unavailable USB passthrough and for required module components missing on some nodes.
        ru: Добавлены алерты о недоступном пробросе USB-устройств и об отсутствии требуемых компонентов модуля на части узлов.
  fixes:
    virtual-machines:
      - en: A virtual machine with an attached USB device can now be live migrated and evacuated during a node drain.
        ru: Исправлена невозможность живой миграции и вытеснения ВМ с подключённым USB-устройством при drain'е узла.
      - en: Detaching a network interface from `.spec.networks` no longer leaves a stale interface in the virtual machine's pod.
        ru: Отключение сетевого интерфейса `.spec.networks` больше не оставляет в соответствующем поде ВМ зависшего интерфейса.
      - en: The live migration of a virtual machine with additional networks no longer hangs waiting for the network on the target node.
        ru: Исправлено зависание живой миграции ВМ с дополнительными сетями в ожидании сети на целевом узле.
      - en: Fixed a crash loop of a virtual machine with an additional network interface.
        ru: Исправлен циклический перезапуск ВМ с дополнительным сетевым интерфейсом.
      - en: The service components of a virtual machine with Secure Boot no longer hang during its migration.
        ru: Исправлено зависание служебных компонентов при миграции ВМ с Secure Boot.
      - en: Fixed a not-ready image blocking the attachment and detachment of a virtual machine's disks.
        ru: Исправлена блокировка подключения и отключения дисков ВМ из-за неготового образа.
      - en: Fixed image mounts leaking on the target node after a live migration of a virtual machine.
        ru: Исправлена утечка монтирований образов на целевом узле после живой миграции ВМ.
      - en: A virtual machine no longer starts booting before its boot disk is attached.
        ru: ВМ не начинает запускаться, пока не будет подключён загрузочный диск.
      - en: Fixed the loss of access to disks when a USB device is attached to a running virtual machine.
        ru: Исправлена потеря доступа к дискам при подключении USB-устройства к работающей ВМ.
      - en: The virtual machine migration queue is no longer blocked when one of the migrations ends abnormally.
        ru: Исправлена блокировка очереди миграций ВМ при аварийном завершении одной из них.
      - en: Fixed the force stop of a virtual machine when a regular stop was already in progress.
        ru: Исправлена принудительная остановка ВМ, если уже шла обычная остановка.
    disks-and-images:
      - en: Not-ready images and disks no longer hang when deleted while their data is being imported.
        ru: Неготовые образы и диски больше не зависают при их удалении в процессе импорта данных.
      - en: The creation of an image or a disk with a long name no longer hangs.
        ru: Исправлено бесконечное создание образа или диска с длинным именем.
      - en: A resource with the `Upload` type that receives no data within 10 minutes moves to the `Failed` phase with the `WaitForUserUploadTimeout` reason. To upload the image, recreate the resource.
        ru: Ресурс с типом `Upload`, в который за 10 минут не начали загружать данные, переходит в фазу `Failed` с причиной `WaitForUserUploadTimeout`. Чтобы загрузить образ, пересоздайте ресурс.
      - en: Creating a virtual disk from a raw image in the registry onto a block device no longer makes an extra copy of the data.
        ru: Создание виртуального диска из raw-образа в registry на блочное устройство больше не делает лишнюю копию данных.
      - en: The creation of a virtual disk no longer hangs when the target virtual machine runs on dedicated nodes with taints.
        ru: Исправлено зависание создания виртуального диска, если целевая ВМ работает на выделенных узлах с taint'ами.
      - en: Fixed the restore of a virtual disk from a snapshot on storage that rounds volume sizes up (`ceph-rbd`, `sds-elastic`).
        ru: Исправлено восстановление виртуального диска из снапшота на хранилищах, округляющих размер тома вверх (`ceph-rbd`, `sds-elastic`).
      - en: During an image upload, the phase of a [ClusterVirtualImage](/modules/virtualization/cr.html#clustervirtualimage) no longer flips back to `Pending`.
        ru: При загрузке образа фаза [ClusterVirtualImage](/modules/virtualization/cr.html#clustervirtualimage) больше не возвращается в `Pending`.
    module:
      - en: Fixed device handling for virtual machines on cgroup v2 nodes.
        ru: Исправлена работа с устройствами ВМ на узлах с cgroup v2.
      - en: The Deckhouse queue is no longer blocked when the `virtualization` module is enabled while its controllers are not ready.
        ru: Исправлено блокирование очереди Deckhouse при включении модуля `virtualization` в случае неготовности контроллеров виртуализации.
      - en: Fixed the renewal of TLS certificates in the virtualization components while the cluster is degraded.
        ru: Исправлено обновление TLS-сертификатов в компонентах виртуализации при проблемах в кластере.
    observability:
      - en: Fixed the module's alerts suppressing the platform alert about unavailable components.
        ru: Исправлено подавление алертами модуля платформенного алерта о недоступности его компонентов.
      - en: Alerts now point to the component that failed; a stuck controller queue and a missing leader are tracked separately.
        ru: Алерты теперь указывают на проблемный компонент, а зависшая очередь контроллера и отсутствие лидера отслеживаются отдельно.
      - en: "Removed the metric that reported virtual machines with local disks as impossible to migrate: such machines can be migrated."
        ru: "Удалена метрика, сообщавшая о невозможности миграции ВМ с локальными дисками: такие ВМ мигрируют."
  security:
    module:
      - en: |-
          Fixed vulnerabilities:
            - CVE-2025-27144
            - CVE-2026-10722
            - CVE-2026-34986
            - CVE-2026-46600
            - CVE-2026-54332
            - CVE-2026-54345
            - CVE-2026-56852
            - CVE-2026-56864
            - CVE-2026-56865
            - GHSA-gcjh-h69q-9w9g
            - GHSA-hrxh-6v49-42gf
            - GO-2026-5932
        ru: |-
          Исправлены уязвимости:
            - CVE-2025-27144
            - CVE-2026-10722
            - CVE-2026-34986
            - CVE-2026-46600
            - CVE-2026-54332
            - CVE-2026-54345
            - CVE-2026-56852
            - CVE-2026-56864
            - CVE-2026-56865
            - GHSA-gcjh-h69q-9w9g
            - GHSA-hrxh-6v49-42gf
            - GO-2026-5932
- version: v1.10.3
  date: "2026-08-24"
  highlights:
    - en: Fixed potential data loss during a virtual disk migration.
      ru: Исправлена возможная потеря данных при миграции виртуального диска.
    - en: Disk hotplug, migrations, and status updates of virtual machines are no longer interrupted by periodic crashes of a service component on the nodes.
      ru: Подключение дисков, миграции и обновление статусов виртуальных машин (ВМ) больше не прерываются периодическими сбоями служебного компонента на узлах.
    - en: Virtual machines with USB devices are now scheduled only on nodes where USB passthrough is available.
      ru: ВМ с USB-устройствами теперь размещаются только на узлах, где доступен проброс USB-устройств.
  fixes:
    virtual-machines:
      - en: Fixed an issue where an additional network of a virtual machine was not configured if another network of the same VM had an explicitly specified MAC address.
        ru: Исправлено добавление дополнительной сети в ВМ, если у другой сети в той же ВМ был явно указан MAC-адрес.
      - en: "Fixed empty launch statistics for virtual machines: `.status.stats.phasesTransitions` and `.status.stats.launchTimeDuration` are reported again."
        ru: "Исправлена пустая статистика запуска виртуальных машин: параметры `.status.stats.phasesTransitions` и `.status.stats.launchTimeDuration` снова заполняются."
      - en: Fixed an issue where virtual machines with USB devices could be scheduled on nodes without a USB gateway and then failed to start or started without their USB devices.
        ru: Исправлено размещение ВМ с USB-устройствами на узлах без USB-шлюза, где такие ВМ не запускались или запускались без USB-устройств.
    disks-and-images:
      - en: Fixed potential data loss during a virtual disk migration.
        ru: Исправлена возможная потеря данных при миграции диска.
      - en: Fixed an issue where a virtual disk storage class migration was canceled if another virtual machine in the same namespace was migrating.
        ru: Исправлена непреднамеренная отмена миграции класса хранения диска при наличии другой мигрирующей ВМ в неймспейсе.
      - en: Fixed a virtual disk export hanging in the `Pending` phase.
        ru: Исправлено зависание экспорта виртуального диска в фазе `Pending`.
      - en: Fixed an issue where virtual disk import failed in clusters with containerd image integrity checks enabled.
        ru: Исправлена ошибка импорта виртуальных дисков в кластерах с проверкой целостности образов в containerd.
      - en: Fixed an issue where disks could be unintentionally preempted from the virtual machine node. The priority class of the VM service components is now set according to `.spec.priorityClass` of the VM.
        ru: Исправлено непреднамеренное вытеснение дисков с узла ВМ. Класс приоритета для служебных компонентов ВМ теперь выставляется в соответствии с конфигурацией `.spec.priorityClass` в ВМ.
      - en: The time a virtual disk spends in the `Provisioning` phase is no longer counted in `.status.stats.creationDuration.waitingForFirstConsumer`.
        ru: В `.status.stats.creationDuration.waitingForFirstConsumer` больше не учитывается время нахождения диска в состоянии `Provisioning`.
    module:
      - en: USB devices are now provided only from nodes where the `usbip` kernel modules are known to be available.
        ru: USB-устройства теперь предоставляются только с узлов, на которых подтверждено наличие модулей ядра `usbip`.
      - en: Fixed an issue where the Deckhouse queue could be blocked if the `usbip` kernel modules could not be installed on a node, including nodes running Astra Linux, ALT Linux, and RED OS.
        ru: Исправлено блокирование очереди Deckhouse, если на узле невозможно было установить модули ядра `usbip` (в том числе для Astra Linux, ALT Linux и RED OS).
      - en: Fixed disk hotplug, migration, and status update failures caused by `virt-handler` crashing with a fatal error several times a day.
        ru: Исправлены проблемы подключения дисков, миграций и обновления статусов, вызванные фатальными ошибками `virt-handler`, возникающими по несколько раз в день.
  security:
    module:
      - en: |-
          Fixed vulnerabilities:
            - CVE-2026-33818
            - CVE-2026-39821
            - CVE-2026-54332
            - CVE-2026-54345
            - CVE-2026-56853
            - CVE-2026-56858
            - CVE-2026-56859
            - CVE-2026-56860
            - CVE-2026-56862
            - CVE-2026-56864
            - CVE-2026-56865
            - GHSA-gcjh-h69q-9w9g
        ru: |-
          Исправлены уязвимости:
            - CVE-2026-33818
            - CVE-2026-39821
            - CVE-2026-54332
            - CVE-2026-54345
            - CVE-2026-56853
            - CVE-2026-56858
            - CVE-2026-56859
            - CVE-2026-56860
            - CVE-2026-56862
            - CVE-2026-56864
            - CVE-2026-56865
            - GHSA-gcjh-h69q-9w9g
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: в процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v1.10.2
  date: "2026-08-03"
  highlights:
    - en: USB device passthrough works again on hosts running more than one usbip host controller.
      ru: Проброс USB-устройств снова работает на узлах, где запущено более одного виртуального хост-контроллера usbip.
    - en: Enabling the module or changing its version no longer blocks the Deckhouse queue in clusters without the `vertical-pod-autoscaler` module.
      ru: Включение модуля и смена его версии больше не блокируют очередь Deckhouse в кластерах без модуля `vertical-pod-autoscaler`.
  fixes:
    module:
      - en: Fixed an issue where the task queue would block when enabling a module or changing its version in a cluster without the `vertical-pod-autoscaler` module enabled. The cause was an infinite loop of attempts to delete VPA objects. Instead of `PatchCollector`, a separate request is now used that ignores the absence of VPA objects and prevents the queue from being blocked.
        ru: Исправлена проблема с блокировкой очереди задач при включении модуля или смене его версии в кластере без включённого модуля `vertical-pod-autoscaler`. Причиной был бесконечный цикл попыток удаления VPA-объектов. Вместо `PatchCollector` теперь используется отдельный запрос, который игнорирует отсутствие VPA-объектов и предотвращает блокировку очереди.
      - en: Fixed an issue where USB device passthrough to virtual machines was unavailable on hosts where the usbip driver was running more than one virtual host controller.
        ru: Исправлена проблема с недоступностью проброса USB-устройств в виртуальные машины на узлах, где драйвером usbip запущено более одного виртуального хост-контроллера.
      - en: Fixed a `CrashLoopBackOff` error in the `virtualization-dra` pod on hosts with USB devices, caused by starting controller worker processes before the initial connection information had been collected. Initialization now occurs before the workers start, which prevents the error caused by accessing data that has not yet been populated.
        ru: Исправлена ошибка `CrashLoopBackOff` в поде `virtualization-dra` на узлах с USB-устройствами, вызванная запуском рабочих процессов контроллера до завершения сбора начальной информации о подключениях. Теперь инициализация выполняется перед стартом воркеров, что исключает ошибку при обращении к ещё не заполненным данным.
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v1.10.1
  date: "2026-07-29"
  highlights:
    - en: The module now requires `sdn` 0.6.2 or later when the `sdn` module is enabled.
      ru: Модуль требует версию `sdn` не ниже 0.6.2, если модуль `sdn` включён.
    - en: Fixed vulnerabilities in the module's components.
      ru: Устранены уязвимости в компонентах модуля.
  fixes:
    module:
      - en: An optional dependency has been added for the virtualization module, requiring that the `sdn` module be version 0.6.2 or later. This prevents launching virtualization from running with earlier versions of `sdn`. The dependency applies only when the `sdn` module is enabled.
        ru: Для модуля виртуализации добавлена опциональная зависимость, требующая версию модуля `sdn` не ниже 0.6.2. Это предотвращает запуск виртуализации с более ранними версиями `sdn`. Зависимость применяется только при включенном модуле `sdn`.
  security:
    module:
      - en: |-
          Fixed vulnerabilities:
            - CVE-2026-46600
            - CVE-2026-56852
            - GHSA-hrxh-6v49-42gf
            - CVE-2026-34986
            - CVE-2025-27144
        ru: |-
          Исправлены уязвимости:
            - CVE-2026-46600
            - CVE-2026-56852
            - GHSA-hrxh-6v49-42gf
            - CVE-2026-34986
            - CVE-2025-27144
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v1.10.0
  date: "2026-07-23"
  highlights:
    - en: "[VirtualMachinePool](/modules/virtualization/cr.html#virtualmachinepool) (EE/SE+) manages a group of identical virtual machines (VMs) declaratively and scales through the standard `scale` subresource and HPA."
      ru: "[VirtualMachinePool](/modules/virtualization/cr.html#virtualmachinepool) (EE/SE+) декларативно управляет группой одинаковых виртуальных машин (ВМ) и масштабируется через стандартный субресурс `scale` и HPA."
    - en: CPU and memory of a running virtual machine can be changed without live migration (in-place resize, behind a feature gate).
      ru: CPU и память работающей виртуальной машины можно менять без живой миграции (in-place resize, под фичагейтом).
    - en: Virtual machine networks moved to eBPF, so additional networks connect more reliably and with lower overhead.
      ru: Сети виртуальных машин переведены на eBPF, поэтому дополнительные сети подключаются стабильнее и с меньшими накладными расходами.
    - en: Live migration became more predictable — a target that never becomes ready no longer holds migration slots, and migration traffic can be routed over a dedicated SystemNetwork.
      ru: Живая миграция стала предсказуемее — зависшая цель больше не удерживает слоты миграции, а трафик миграции можно направить в выделенную SystemNetwork.
    - en: Names of virtual disks and images are no longer capped below the Kubernetes limit.
      ru: Длина имён виртуальных дисков и образов больше не ограничена сильнее, чем в Kubernetes.
  features:
    virtual-machines:
      - en: Added the [VirtualMachinePool](/modules/virtualization/cr.html#virtualmachinepool) resource (EE/SE+) for declarative group management of identical virtual machines. The pool supports scaling via the standard `scale` subresource and HPA.
        ru: Добавлен ресурс [VirtualMachinePool](/modules/virtualization/cr.html#virtualmachinepool) (EE/SE+) для декларативного управления группами одинаковых виртуальных машин. Пул поддерживает масштабирование через стандартный субресурс `scale` и HPA.
      - en: Added the ability to change CPU and memory of a running VM without live migration (in-place resize). To enable this functionality, add `HotplugCPUAndMemoryWithInPlaceResize` to `.spec.settings.featureGates` in the ModuleConfig of the `virtualization` module.
        ru: Добавлена возможность изменять CPU и память работающей ВМ без живой миграции (in-place resize). Чтобы включить функциональность, добавьте `HotplugCPUAndMemoryWithInPlaceResize` в `.spec.settings.featureGates` ModuleConfig модуля `virtualization`.
      - en: Switched VM networks to eBPF, providing more stable connectivity for additional networks with lower overhead.
        ru: "Сети ВМ переведены на eBPF: более стабильное подключение дополнительных сетей при меньших накладных расходах."
      - en: "[VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) resources can now supersede other active operations on the same VM."
        ru: Операции [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) теперь могут вытеснять другие активные операции над той же ВМ.
    disks-and-images:
      - en: Added automatic recovery of [VirtualImage](/modules/virtualization/cr.html#virtualimage) and [ClusterVirtualImage](/modules/virtualization/cr.html#clustervirtualimage) from the `ImageLost` phase when the image reappears in DVCR, without re-importing the data.
        ru: Добавлено автоматическое восстановление [VirtualImage](/modules/virtualization/cr.html#virtualimage) и [ClusterVirtualImage](/modules/virtualization/cr.html#clustervirtualimage) из фазы `ImageLost`, когда образ снова появляется в DVCR, без повторного импорта данных.
      - en: The [VirtualDisk](/modules/virtualization/cr.html#virtualdisk) name length limit has been raised from 60 to 253 characters.
        ru: Ограничение на длину имени [VirtualDisk](/modules/virtualization/cr.html#virtualdisk) увеличено с 60 до 253 символов.
      - en: The name length limit has been raised from 49 to 253 characters for [VirtualImage](/modules/virtualization/cr.html#virtualimage) and from 48 to 253 for [ClusterVirtualImage](/modules/virtualization/cr.html#clustervirtualimage).
        ru: Ограничение на длину имени увеличено с 49 до 253 символов для [VirtualImage](/modules/virtualization/cr.html#virtualimage) и с 48 до 253 для [ClusterVirtualImage](/modules/virtualization/cr.html#clustervirtualimage).
      - en: "Added per-namespace authorization for DVCR: image access is isolated between namespaces."
        ru: "Добавлена авторизация в DVCR на уровне неймспейса: доступ к образам изолирован между неймспейсами."
    network:
      - en: Added the ability to route live migration traffic over a dedicated SystemNetwork via `liveMigration.network` in the ModuleConfig of the `virtualization` module.
        ru: Добавлена возможность направлять трафик живой миграции через выделенный SystemNetwork с помощью параметра `liveMigration.network` в ModuleConfig модуля `virtualization`.
    module:
      - en: Virtual disks and virtual images in `WaitForFirstConsumer` mode are created 22% faster.
        ru: Виртуальные диски и виртуальные образы в режиме `WaitForFirstConsumer` создаются на 22% быстрее.
      - en: Added a limit on concurrent inbound live migrations per target node.
        ru: Добавлено ограничение числа одновременных входящих живых миграций на целевой узел.
      - en: Added the ability to use the module without specifying subnets for the `Main` network. For this, the `sdn` module must be enabled.
        ru: Добавлена возможность использовать модуль без указания подсетей для сети `Main`. Для этого модуль `sdn` должен быть включен.
  fixes:
    virtual-machines:
      - en: "Fixed VM update failures while an image is being attached via [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) (hotplug): VM changes could previously be interrupted at the moment of attachment."
        ru: "Исправлены сбои обновления ВМ во время подключения образа через [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) (hotplug): ранее изменения ВМ могли прерываться в момент подключения."
      - en: "Fixed flapping of the `VirtualMachineIPAddressReady` condition: guest-agent data now augments rather than clears the VM's already-known IP address."
        ru: "Исправлено периодическое переключение (flapping) условия `VirtualMachineIPAddressReady`: данные от гостевого агента теперь дополняют, а не затирают уже известный IP-адрес ВМ."
      - en: Fixed disks and CD-ROMs remaining on the SATA bus after enabling paravirtualization, which prevented unplugging ISO drives from a running VM.
        ru: Исправлено сохранение дисков и CD-ROM на шине SATA после включения паравиртуализации, из-за которого нельзя было отключить ISO с работающей ВМ.
      - en: "Fixed a live migration hanging when its target never became ready (`OOMKilled`, unschedulable, a disk that never attaches): it now fails by timeout and the migration slots it held are released."
        ru: "Исправлено зависание живой миграции, целевой под которой так и не становился готовым (`OOMKilled`, unschedulable, неподключившийся диск): теперь она завершается по таймауту, а удерживаемые слоты миграции освобождаются."
      - en: Fixed virtual machines with local disks getting stuck and unable to migrate while a restart was pending; they can now be evacuated, updated, and re-migrated.
        ru: Исправлено зависание ВМ с локальными дисками, которые не могли мигрировать при ожидающем перезапуске; теперь их можно эвакуировать, обновлять и повторно мигрировать.
      - en: Fixed a false reboot requirement for VMs with only the `Main` network caused by implicit default network template synchronization.
        ru: Исправлено ложное требование перезагрузки у ВМ только с сетью `Main` из-за синхронизации неявного шаблона сети по умолчанию.
      - en: Fixed CPU and memory hotplug updates failing when project quota cannot fit migration-time resources. Such changes now fall back to a restart.
        ru: "Исправлена ошибка изменения CPU и памяти на лету (hotplug), когда для миграции не хватает квоты проекта: такие изменения теперь выполняются через перезапуск ВМ."
    disks-and-images:
      - en: Fixed Upload-type disks and images getting stuck in `Pending` when the upload host certificate becomes invalid, and restored automatic recovery when the upload host changes (for example, after `publicDomainTemplate` is updated).
        ru: Исправлено зависание дисков и образов с типом Upload в фазе `Pending` при недействительном сертификате хоста загрузки. Также снова работает автоматическое восстановление при смене хоста загрузки (например, после обновления `publicDomainTemplate`).
      - en: Fixed PVC storage-type virtual images being attached to virtual machines in read-write mode; they are now attached read-only, like ContainerRegistry storage-type images.
        ru: Исправлено подключение образов с типом хранилища PVC к виртуальным машинам в режиме чтения-записи; теперь они подключаются только для чтения, как и образы с типом хранилища ContainerRegistry.
    module:
      - en: Closed unauthorized access to the virtualization USB/IP gateway port.
        ru: Закрыт неавторизованный доступ к порту USB/IP-шлюза виртуализации.
  security:
