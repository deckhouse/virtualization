- version: v1.9.4
  date: "2026-07-13"
  highlights:
    - en: The audit server starts even when TLS certificate paths are not passed explicitly.
      ru: Сервер аудита запускается, даже если пути к TLS-сертификатам не переданы явно.
  fixes:
    observability:
      - en: Fixed an issue that prevented the audit server from starting when TLS certificate paths were not passed explicitly.
        ru: Исправлен сбой запуска сервера аудита, когда пути к TLS-сертификатам не передаются явно.
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v1.9.3
  date: "2026-07-07"
  highlights:
    - en: Images attach to virtual machines (VMs) faster, downloading them from DVCR to the node is no longer slow.
      ru: Образы подключаются к виртуальным машинам (ВМ) быстрее, их загрузка из DVCR на узел больше не тормозит.
    - en: Deleting a virtual machine with hotplugged images no longer leaves it stuck in the Terminating state.
      ru: Удаление виртуальной машины с подключёнными образами больше не оставляет её в состоянии Terminating.
  fixes:
    virtual-machines:
      - en: Fixed a volume mount leak that could leave a VM with hotplugged images stuck in the Terminating state during deletion.
        ru: Исправлена утечка монтирований томов, из-за которой ВМ при наличии подключённых на лету образов (hotplug) могла зависнуть при удалении в состоянии Terminating.
    module:
      - en: Fixed slow downloading of images from DVCR to the node when attaching them to a virtual machine.
        ru: Исправлено медленное скачивание образов из DVCR на узел для подключения к виртуальной машине.
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v1.9.2
  date: "2026-07-01"
  highlights:
    - en: Restored live migration throughput and the speed of importing images into DVCR.
      ru: Восстановлены скорость живой миграции и скорость импорта образов в DVCR.
    - en: Audit events are no longer lost while the certificate of the `virtualization-audit` pod is rotated.
      ru: События аудита больше не теряются при ротации сертификата пода `virtualization-audit`.
  fixes:
    virtual-machines:
      - en: Fixed reduced throughput during live migration of running virtual machines (VMs) compared to v1.8.3.
        ru: Исправлено снижение скорости живой миграции работающих виртуальных машин по сравнению с v1.8.3.
    disks-and-images:
      - en: Fixed slow import and upload of images to DVCR when network bandwidth was not the bottleneck.
        ru: Исправлена низкая скорость импорта и загрузки образов в DVCR в случаях, когда пропускная способность сети не была узким местом.
    observability:
      - en: Fixed loss of audit events and false `D8LogShipperDestinationErrors` alerts during certificate rotation of the `virtualization-audit` pod.
        ru: Исправлена потеря событий аудита и ложные срабатывания алерта `D8LogShipperDestinationErrors` при ротации сертификатов пода `virtualization-audit`.
  upgrade:
