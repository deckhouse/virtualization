- version: v1.9.6
  date: "2026-08-03"
  highlights:
    - en: USB device passthrough works on hosts with xz- or gzip-compressed usbip kernel modules and with more than one usbip host controller.
      ru: Проброс USB-устройств работает на узлах со сжатыми (xz, gzip) модулями ядра usbip и с несколькими хост-контроллерами usbip.
  fixes:
    module:
      - en: Fixed an issue where USB device passthrough to virtual machines was unavailable on hosts where the preinstalled usbip kernel modules were compressed (using xz or gzip). USB device passthrough is now available if kernel modules are compressed using xz or gzip, not just zstd. Also, for Debian, the `linux-modules-extra-${kernel_release}` package is now used instead of attempting to install the Ubuntu-specific `linux-modules-extra`.
        ru: Исправлена проблема с недоступностью проброса USB-устройств в виртуальные машины на узлах, где предустановленные модули ядра usbip поставляются в сжатом виде (сжаты с помощью xz или gzip). Теперь проброс USB-устройств доступен, если модули ядра сжаты с использованием xz, gzip, а не только с использованием zstd. Также для Debian теперь используется пакет `linux-modules-extra-${kernel_release}` вместо попыток установки Ubuntu-специфичного `linux-modules-extra`.
      - en: Fixed an issue where USB device passthrough to virtual machines was unavailable on hosts where the usbip driver was running more than one virtual host controller.
        ru: Исправлена проблема с недоступностью проброса USB-устройств в виртуальные машины на узлах, где драйвером usbip запущено более одного виртуального хост-контроллера.
      - en: Fixed a `CrashLoopBackOff` error in the `virtualization-dra` pod on hosts with USB devices, caused by starting controller worker processes before the initial connection information had been collected. Initialization now occurs before the workers start, which prevents the error caused by accessing data that has not yet been populated.
        ru: Исправлена ошибка `CrashLoopBackOff` в поде `virtualization-dra` на узлах с USB-устройствами, вызванная запуском рабочих процессов контроллера до завершения сбора начальной информации о подключениях. Теперь инициализация выполняется перед стартом воркеров, что исключает ошибку при обращении к ещё не заполненным данным.
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v1.9.5
  date: "2026-07-29"
  highlights:
    - en: An interrupted delivery of audit logs is now reported instead of failing silently.
      ru: Прерывание доставки журналов аудита теперь сообщается пользователю, а не остаётся незамеченным.
    - en: Fixed vulnerabilities in the module's components.
      ru: Устранены уязвимости в компонентах модуля.
  fixes:
    observability:
      - en: "Fixed an issue where no notification was displayed when the transmission of audit logs was interrupted due to the use of outdated certificate authority data or because the audit resources lacked a certificate and key: when the transmission of audit logs is interrupted, a warning now appears prompting the user to take action."
        ru: "Исправлено отсутствие уведомления о прерывании передачи журналов аудита из-за использования устаревших данных центра сертификации или из-за отсутствия у ресурсов аудита сертификата и ключа: при прерывании передачи журналов аудита появляется предупреждение, требующее принятия мер."
    module:
      - en: An optional dependency has been added for the virtualization module, requiring that the `sdn` module be version 0.6.2 or later. This prevents launching virtualization from running with earlier versions of `sdn`. The dependency applies only when the `sdn` module is enabled.
        ru: Для модуля виртуализации добавлена опциональная зависимость, требующая версию модуля `sdn` не ниже 0.6.2. Это предотвращает запуск виртуализации с более ранними версиями `sdn`. Зависимость применяется только при включенном модуле `sdn`.
  security:
