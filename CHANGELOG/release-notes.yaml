- version: v1.6.0
  date: "2026-03-02"
  highlights:
    - en: USB devices can be attached to virtual machines through `.spec.usbDevices`, with the [NodeUSBDevice](/modules/virtualization/cr.html#nodeusbdevice) and [USBDevice](/modules/virtualization/cr.html#usbdevice) resources to manage them.
      ru: USB-устройства можно подключать к виртуальным машинам через `.spec.usbDevices`, для управления ими добавлены ресурсы [NodeUSBDevice](/modules/virtualization/cr.html#nodeusbdevice) и [USBDevice](/modules/virtualization/cr.html#usbdevice).
    - en: The `Virtualization / Overview` dashboard shows the state of the virtualization platform as a whole.
      ru: Дашборд `Virtualization / Overview` показывает состояние платформы виртуализации целиком.
    - en: DVCR is cleaned up daily by default, on a schedule that can be changed in the module configuration.
      ru: Очистка DVCR по умолчанию выполняется ежедневно, расписание можно изменить в настройках модуля.
  features:
    virtual-machines:
      - en: Added support for attaching USB devices to virtual machines via `.spec.usbDevices`.
        ru: Добавлена поддержка подключения USB-устройств к виртуальным машинам через `.spec.usbDevices`.
      - en: |-
          Added [NodeUSBDevice](/modules/virtualization/cr.html#nodeusbdevice) and [USBDevice](/modules/virtualization/cr.html#usbdevice) resources to manage USB devices in the cluster:
            - [NodeUSBDevice](/modules/virtualization/cr.html#nodeusbdevice) (cluster-scoped): Represents a USB device discovered on a specific node. Allows assigning a USB device for use in a specific namespace.
            - [USBDevice](/modules/virtualization/cr.html#usbdevice) (namespace-scoped): Represents a USB device available for attachment to virtual machines in a given namespace.
        ru: |-
          Добавлены ресурсы [NodeUSBDevice](/modules/virtualization/cr.html#nodeusbdevice) и [USBDevice](/modules/virtualization/cr.html#usbdevice), позволяющие управлять USB-устройствами в кластере:
            - [NodeUSBDevice](/modules/virtualization/cr.html#nodeusbdevice) (cluster-scoped) — представляет USB-устройство, обнаруженное на конкретном узле. Позволяет назначить USB-устройство для использования в конкретном неймспейсе.
            - [USBDevice](/modules/virtualization/cr.html#usbdevice) (namespace-scoped) — представляет USB-устройство, доступное для подключения к виртуальным машинам в заданном неймспейсе.
    disks-and-images:
      - en: "Enabled DVCR cleanup in clusters by default: daily at 02:00. You can override the schedule via `dvcr.gc.schedule` in the `virtualization` module ModuleConfig."
        ru: "Включена очистка DVCR в кластерах по умолчанию: ежедневно в 02:00. Расписание можно переопределить через `dvcr.gc.schedule` в ModuleConfig модуля `virtualization`."
    observability:
      - en: Added the `Virtualization / Overview` dashboard with an overview of the virtualization platform status.
        ru: Добавлен дашборд `Virtualization / Overview` с обзором состояния платформы виртуализации.
      - en: Added information about virtual machine pods to the virtual machine dashboard.
        ru: На дашборд виртуальной машины добавлена информация о подах виртуальных машин.
  improvements:
    cli:
      - en: Added the `--from-file` flag to the `vlctl` utility for viewing domain information from a local libvirt XML file.
        ru: Для утилиты `vlctl` добавлен флаг `--from-file` для просмотра информации о домене из локального libvirt XML-файла.
  fixes:
    virtual-machines:
      - en: If only the `Main` network is specified in `.spec.networks`, the `sdn` module is no longer required.
        ru: Если в `.spec.networks` указана только сеть `Main`, то больше не требуется включенный модуль `sdn`.
      - en: "Fixed virtual machine migration with disks attached via [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) (hotplug): the target pod could exceed memory limits (`OOMKilled`)."
        ru: "Исправлена миграция виртуальной машины с дисками, подключенными через [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) (hotplug): целевой под мог превысить лимиты по памяти (`OOMKilled`)."
      - en: Fixed an incorrect `Pending` phase for the [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) resource during virtual machine migration.
        ru: Исправлена некорректная фаза `Pending` ресурса [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) во время миграции виртуальной машины.
      - en: To remove disks and images attached to a virtual machine via [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) (hotplug), you must first detach them from the virtual machine by deleting the corresponding `vmbda`. This information has been added to the `vmbda` status.
        ru: Чтобы удалить диски и образы, подключенные к виртуальной машине через [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) (hotplug), сначала нужно отсоединить их от виртуальной машины, удалив соответствующий `vmbda`. Эта информация добавлена в статус `vmbda`.
    disks-and-images:
      - en: Fixed virtual disks hanging during creation in `WaitForFirstConsumer` mode on nodes with taints.
        ru: Исправлено зависание при создании виртуальных дисков в режиме `WaitForFirstConsumer` на узлах с taints.
- version: v1.5.2
  date: "2026-03-05"
  highlights:
    - en: Creating a virtual disk on NFS no longer risks an OOMKill.
      ru: Создание виртуального диска на NFS больше не грозит OOMKill.
  fixes:
    disks-and-images:
      - en: Fixed a potential `OOMKill` during the virtual disk creation on NFS.
        ru: Исправлен возможный `OOMKill` при создании виртуального диска на NFS.
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v1.5.1
  date: "2026-02-16"
  highlights:
    - en: A virtual disk can again be created from a virtual image stored on a PersistentVolumeClaim.
      ru: Виртуальный диск снова можно создать из виртуального образа, хранящегося на PersistentVolumeClaim.
  fixes:
    disks-and-images:
      - en: Fixed an issue with creating a virtual disk from a virtual image stored on a `PersistentVolumeClaim` (with `.spec.storage` set to `PersistentVolumeClaim`).
        ru: Исправлена проблема при создании виртуального диска из виртуального образа, хранящегося на `PersistentVolumeClaim` (при значении `.spec.storage=PersistentVolumeClaim`).
- version: v1.5.0
  date: "2026-02-09"
  highlights:
    - en: A virtual machine (VM) can be migrated to a chosen node through a [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) resource.
      ru: Виртуальную машину (ВМ) можно мигрировать на выбранный узел через ресурс [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation).
    - en: Resources of system components and the temporary double consumption during migration are no longer counted in project quotas.
      ru: Ресурсы системных компонентов и временное двойное потребление при миграции больше не учитываются в квотах проекта.
    - en: Fixed several cases where a virtual machine could hang during migration or cloning when the StorageClass changed.
      ru: Исправлено несколько случаев зависания виртуальной машины при миграции и клонировании со сменой StorageClass.
  features:
    virtual-machines:
      - en: Added the ability to migrate a VM to a chosen node. To do this, create a [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) resource with the `Migrate` type and specify the node in `.spec.migrate.nodeSelector`.
        ru: Добавлена возможность миграции ВМ на выбранный узел. Для этого нужно создать ресурс [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) с типом `Migrate` и указать узел в `.spec.migrate.nodeSelector`.
    observability:
      - en: Added a table with virtual machine operations to the `Namespace / Virtual Machine` dashboard.
        ru: На дашборд `Namespace / Virtual Machine` добавлена таблица с операциями по виртуальной машине.
  improvements:
    disks-and-images:
      - en: When viewing disks, the name of the virtual machine they are attached to is now displayed (`d8 k get vd`).
        ru: При просмотре дисков теперь отображается имя виртуальной машины, к которой они подключены (`d8 k get vd`).
  fixes:
    virtual-machines:
      - en: Fixed an issue with cloning a virtual machine whose disks use storage in `WaitForFirstConsumer` mode.
        ru: Исправлена проблема клонирования виртуальной машины, диски которой используют хранилище в режиме `WaitForFirstConsumer`.
      - en: Fixed a possible virtual machine hang in the `Pending` state during migration when changing the StorageClass.
        ru: Исправлено зависание виртуальной машины в `Pending` в процессе миграции при смене StorageClass.
    disks-and-images:
      - en: Fixed an issue with live migration of a virtual machine between StorageClass with the `Filesystem` type.
        ru: Исправлена проблема живой миграции виртуальной машины между StorageClass с типом `Filesystem`.
    module:
      - en: Fixed an issue with starting virtual machines using the `EFIWithSecureBoot` bootloader when configured with more than 12 vCPUs.
        ru: Исправлен запуск виртуальных машин с загрузчиком `EFIWithSecureBoot` при конфигурации с более чем 12 vCPU.
      - en: System component resources required for starting and running virtual machines are no longer counted in project quotas.
        ru: Ресурсы системных компонентов, обеспечивающие запуск и работу виртуальных машин, не учитываются в квотах проекта.
      - en: During virtual machine migration, temporary double consumption of resources is no longer counted in project quotas.
        ru: При миграции виртуальной машины временное двойное потребление ресурсов больше не учитывается в квотах проекта.
      - en: Platform system components in user projects are protected from deletion by users.
        ru: Системные компоненты платформы в пользовательских проектах защищены от удаления пользователями.
  security:
    module:
      - en: |-
          Fixed vulnerabilities:
            - CVE-2025-61726
            - CVE-2025-61728
            - CVE-2025-61730
            - CVE-2025-68121
        ru: |-
          Исправлены уязвимости:
            - CVE-2025-61726
            - CVE-2025-61728
            - CVE-2025-61730
            - CVE-2025-68121
