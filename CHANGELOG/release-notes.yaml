- version: v1.6.1
  date: "2026-03-10"
  highlights:
    - en: USB devices are discovered on nodes reliably, and a virtual machine with connected USB devices can be cloned.
      ru: USB-устройства стабильно обнаруживаются на узлах, а виртуальную машину с подключёнными USB-устройствами можно клонировать.
    - en: Restored the previous placement of virtual machine dashboards, which could block the Deckhouse queue.
      ru: Возвращено прежнее расположение дашбордов виртуальных машин, которое могло блокировать очередь Deckhouse.
  fixes:
