- version: v1.8.1
  date: "2026-04-28"
  highlights:
    - en: Virtual disks no longer get stuck in the Provisioning state with a StorageClass in WaitForFirstConsumer mode.
      ru: Виртуальные диски больше не зависают в состоянии Provisioning при использовании StorageClass в режиме WaitForFirstConsumer.
    - en: Virtualization dashboards show correct values during virtual machine migration and in HA clusters.
      ru: Дашборды виртуализации показывают корректные значения во время миграции виртуальных машин и в HA-кластерах.
  fixes:
    disks-and-images:
      - en: Fixed a potential issue where a virtual disk could get stuck in the `Provisioning` state when using a StorageClass with `WaitForFirstConsumer` mode.
        ru: Исправлено возможное зависание виртуального диска в состоянии `Provisioning` при использовании StorageClass с режимом `WaitForFirstConsumer`.
      - en: CDI metrics now use `d8_internal_virtualization_kubevirt_cdi_*` names, matching other internal virtualization metrics.
        ru: Метрики CDI теперь используют имена `d8_internal_virtualization_kubevirt_cdi_*`, как и другие внутренние метрики виртуализации.
    observability:
      - en: Fixed CPU usage calculation on the virtual machine dashboard in HA clusters, where duplicated controller metrics could affect the displayed value.
        ru: "Исправлен расчет загрузки CPU на дашборде виртуальной машины в HA-кластерах: дублирующиеся метрики контроллера больше не влияют на отображаемое значение."
    module:
      - en: Fixed incorrect resource calculations on the `Virtualization / Overview` dashboard that could occur during virtual machine migration.
        ru: Исправлен некорректный расчет ресурсов на дашборде `Virtualization / Overview`, который мог возникать во время миграции виртуальной машины.
      - en: Added missing RBAC permissions for virtualization resources, including virtual machine MAC addresses, snapshot operations, and node USB devices.
        ru: Добавлены недостающие права RBAC для ресурсов виртуализации, включая MAC-адреса виртуальных машин, операции со снимками и USB-устройства на узлах.
- version: v1.8.0
  date: "2026-04-22"
  highlights:
    - en: The number of CPUs and the amount of memory of a virtual machine can be changed without stopping it manually, the new value is applied through live migration.
      ru: Количество процессоров и объём памяти виртуальной машины (ВМ) можно менять без ручной остановки, новое значение применяется через живую миграцию.
    - en: Virtual machine migration uses the host MTU, which speeds up the transfer of the machine's memory.
      ru: Миграция виртуальных машин использует MTU узла, что ускоряет передачу памяти машины.
    - en: Snapshots are created correctly for a virtual machine without the Main network and while the machine is being migrated.
      ru: Снимки корректно создаются для виртуальной машины без сети Main и во время её миграции.
  features:
    virtual-machines:
      - en: Added the `progress` field to the status of [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) resources with the `Evict` and `Migrate` types to show operation progress. The corresponding `PROGRESS` column is displayed when running `d8 k get vmop`.
        ru: Для операций [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) с типами `Evict` и `Migrate` в статус ресурса добавлено поле `progress`, отображающее прогресс выполнения операции. Соответствующая колонка `PROGRESS` выводится при вызове `d8 k get vmop`.
      - en: Added the ability to change the number of CPUs in a virtual machine without manually stopping it. The new value is applied via live migration. To enable this functionality, add `HotplugCPUWithLiveMigration` to `.spec.settings.featureGates` in the `ModuleConfig` of the `virtualization` module.
        ru: Добавлена возможность изменять количество CPU виртуальной машины без её ручной остановки — новое значение применяется через живую миграцию. Для включения функциональности добавьте `HotplugCPUWithLiveMigration` в `.spec.settings.featureGates` ModuleConfig модуля `virtualization`.
      - en: Added initial support for changing virtual machine memory without manually stopping the virtual machine. The new `.spec.memory` value is applied via live migration. To enable this functionality, add `HotplugMemoryWithLiveMigration` to `.spec.settings.featureGates` in the `ModuleConfig` of the `virtualization` module.
        ru: Добавлена начальная поддержка изменения памяти виртуальной машины без её ручной остановки — изменение `.spec.memory` применяется через живую миграцию. Для включения функциональности добавьте `HotplugMemoryWithLiveMigration` в `.spec.settings.featureGates` ModuleConfig модуля `virtualization`.
  fixes:
    virtual-machines:
      - en: "Optimized virtual machine migration: it now uses `hostNetwork`, allowing the host MTU to be used instead of the pod MTU."
        ru: "Оптимизирована миграция ВМ: теперь используется `hostNetwork`, что позволяет использовать MTU хоста вместо MTU пода."
      - en: Fixed an issue with an unfrozen filesystem during virtual machine snapshot creation if the freeze occurred during migration.
        ru: Исправлена проблема с незамороженной файловой системой при создании снимка виртуальной машины, если заморозка произошла во время миграции.
      - en: "Fixed removal of the `Main` network from a virtual machine: the virtual machine no longer uses an IP address from the virtualization CIDR after the network is removed."
        ru: "Исправлено удаление сети `Main` из виртуальной машины: ВМ больше не использует IP-адрес из CIDR виртуализации после её удаления."
      - en: Added automatic cleanup of [NodeUSBDevice](/modules/virtualization/cr.html#nodeusbdevice) resources that are absent on the node and are not assigned to a namespace or project.
        ru: Реализовано автоматическое удаление ресурсов [NodeUSBDevice](/modules/virtualization/cr.html#nodeusbdevice), отсутствующих на узле и не назначенных на неймспейс или проект.
      - en: Fixed snapshot creation for a virtual machine without the `Main` network.
        ru: Исправлено создание снимка виртуальной машины без сети `Main`.
    module:
      - en: When uploading disks and images with the `Upload` type, the `WaitForUserUpload` phase no longer occurs prematurely while the resource is not yet ready for upload.
        ru: При загрузке дисков и образов с типом `Upload` фаза `WaitForUserUpload` больше не наступает преждевременно, пока ресурс ещё не готов к загрузке.
