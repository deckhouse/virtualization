- version: v1.4.0
  date: "2026-01-23"
  highlights:
    - en: Virtual machines with local disks attached through [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) can be migrated, and the StorageClass of such disks can be changed.
      ru: Виртуальные машины с локальными дисками, подключёнными через [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment), можно мигрировать, а StorageClass таких дисков — менять.
    - en: A virtual machine can be started without the Main network.
      ru: Виртуальную машину можно запустить без сети Main.
    - en: An image that disappears from DVCR is now reported in the status of the corresponding resource.
      ru: Об исчезновении образа из DVCR теперь сообщается в статусе соответствующего ресурса.
  features:
    virtual-machines:
      - en: Virtual machines can now be started without a `Main` network.
        ru: Теперь виртуальную машину можно запускать без сети `Main`.
    disks-and-images:
      - en: Added support for changing the StorageClass of disks attached via [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) (hotplug).
        ru: Добавлена поддержка изменения StorageClass для дисков, подключённых через [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) (hotplug).
      - en: Added support for migrating virtual machines with local disks attached via [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) (hotplug).
        ru: Добавлена поддержка миграции виртуальных машин с локальными дисками, подключёнными через [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) (hotplug).
  fixes:
    virtual-machines:
      - en: Fixed IP address attachment when the corresponding [VirtualMachineIPAddress](/modules/virtualization/cr.html#virtualmachineipaddress) resource was created manually in advance.
        ru: Исправлено присоединение IP-адреса, если ресурс [VirtualMachineIPAddress](/modules/virtualization/cr.html#virtualmachineipaddress) был создан пользователем заранее вручную.
      - en: Added support for cloning virtual machines in the `Running` phase via [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) of type `Clone`.
        ru: Добавлена поддержка клонирования виртуальных машин в состоянии `Running` через [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) с типом `Clone`.
    disks-and-images:
      - en: Added tracking of image availability in DVCR. If an image disappears from DVCR, the corresponding [VirtualImage](/modules/virtualization/cr.html#virtualimage) and [ClusterVirtualImage](/modules/virtualization/cr.html#clustervirtualimage) resources enter the `Lost` phase and report an error.
        ru: "Добавлено отслеживание наличия образов в DVCR: если образ пропадает из DVCR, соответствующие ресурсы [VirtualImage](/modules/virtualization/cr.html#virtualimage) и [ClusterVirtualImage](/modules/virtualization/cr.html#clustervirtualimage) переходят в фазу `Lost` и получают ошибку в статусе."
    module:
      - en: Fixed project quota accounting for resources used by system components required to create disks/images and operate virtual machines.
        ru: Исправлен учёт ресурсов системных компонентов в квотах проекта (для создания дисков/образов и их подключения к виртуальной машине через [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) (hotplug)).
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v1.3.0
  date: "2025-12-16"
  highlights:
    - en: The default `coreFraction` for a class of virtual machines can be set in [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass).
      ru: Значение `coreFraction` по умолчанию для класса виртуальных машин задаётся в [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass).
    - en: Attaching a disk in WaitForFirstConsumer mode to a virtual machine became faster.
      ru: Подключение диска в режиме WaitForFirstConsumer к виртуальной машине стало быстрее.
  features:
    virtual-machines:
      - en: Added the `.spec.sizingPolicies.defaultCoreFraction` field to the [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) resource, allowing you to set the default `coreFraction` for virtual machines that use this class.
        ru: В ресурсе [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) добавлено поле `.spec.sizingPolicies.defaultCoreFraction`, позволяющее задать значение `coreFraction` по умолчанию для виртуальных машин, использующих этот класс.
  fixes:
    disks-and-images:
      - en: Accelerated disk attachment in `WaitForFirstConsumer` mode for virtual machines.
        ru: Ускорено подключение дисков в режиме `WaitForFirstConsumer` к виртуальной машине.
      - en: Fixed an issue with restoring labels and annotations on a disk created from a snapshot.
        ru: Исправлена проблема с восстановлением меток и аннотаций на диске, созданном из снимка.
    observability:
      - en: Fixed the display of virtual machine charts in clusters running in HA mode.
        ru: В кластерах, работающих в HA режиме, исправлено отображение графиков по виртуальным машинам.
    module:
      - en: Added the ability to use system nodes to create project and cluster images.
        ru: Добавлена возможность использования системных узлов для создания проектных и кластерных образов.
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v1.2.2
  date: "2025-12-05"
  highlights:
    - en: The `d8:use:role:user` role can manage [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) resources again.
      ru: Роль `d8:use:role:user` снова может управлять ресурсами [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation).
  fixes:
    module:
      - en: Fixed RBAC access permissions for the `d8:use:role:user` role that prevented it from managing the [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) resource.
        ru: Для роли `d8:use:role:user` исправлены права доступа RBAC, которые не позволяли управлять ресурсом [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation).
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v1.2.1
  date: "2025-12-04"
  highlights:
    - en: Removed a deprecated part of the configuration that could prevent the module from upgrading.
      ru: Удалена устаревшая часть конфигурации, которая могла помешать обновлению модуля.
  fixes:
    module:
      - en: The deprecated part of the configuration has been removed, which could have prevented the virtualization module from upgrading in clusters running Kubernetes version 1.34 and above.
        ru: Удалена устаревшая часть конфигурации, из-за которой обновление модуля виртуализации могло не выполняться в кластерах с Kubernetes версии 1.34 и выше.
- version: v1.2.0
  date: "2025-11-28"
  highlights:
    - en: "[VirtualMachineSnapshotOperation](/modules/virtualization/cr.html#virtualmachinesnapshotoperation) creates a virtual machine from a snapshot, and the VirtualMachineRestore resource is deprecated."
      ru: Ресурс [VirtualMachineSnapshotOperation](/modules/virtualization/cr.html#virtualmachinesnapshotoperation) создаёт виртуальную машину из снимка, а ресурс VirtualMachineRestore объявлен устаревшим.
    - en: Version `v1alpha2` of [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) is deprecated, use `v1alpha3`.
      ru: Версия `v1alpha2` ресурса [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) объявлена устаревшей, используйте `v1alpha3`.
    - en: DVCR can be cleaned up of images that no longer exist, and its storage can no longer be shrunk by mistake.
      ru: DVCR можно очищать от несуществующих образов, а его хранилище больше нельзя уменьшить по ошибке.
    - en: Audit events name the virtual machine and the user who acted on it.
      ru: События аудита называют виртуальную машину и пользователя, который выполнил действие.
  features:
    virtual-machines:
      - en: |-
          The [VirtualMachineRestore](/modules/virtualization/cr.html#virtualmachinerestore) resource is deprecated. Use the following resources instead:
            - [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) with type `Clone`: For cloning an existing virtual machine.
            - [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) with type `Restore`: For restoring an existing virtual machine to a state from a snapshot.
            - [VirtualMachineSnapshotOperation](/modules/virtualization/cr.html#virtualmachinesnapshotoperation): For creating a new virtual machine based on a snapshot.
        ru: |-
          Ресурс [VirtualMachineRestore](/modules/virtualization/cr.html#virtualmachinerestore) помечен как устаревший (deprecated). Вместо него используйте следующие ресурсы:
            - [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) с типом `Clone` - для клонирования существующей виртуальной машины;
            - [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) с типом `Restore` - для восстановления существующей виртуальной машины до состояния из снимка;
            - [VirtualMachineSnapshotOperation](/modules/virtualization/cr.html#virtualmachinesnapshotoperation) - для создания новой виртуальной машины на основе снимка.
      - en: Added the [VirtualMachineSnapshotOperation](/modules/virtualization/cr.html#virtualmachinesnapshotoperation) resource for creating a virtual machine based on a [VirtualMachineSnapshot](/modules/virtualization/cr.html#virtualmachinesnapshot).
        ru: Добавлен ресурс [VirtualMachineSnapshotOperation](/modules/virtualization/cr.html#virtualmachinesnapshotoperation) для создания виртуальной машины на основе снимка [VirtualMachineSnapshot](/modules/virtualization/cr.html#virtualmachinesnapshot).
      - en: |-
          For the [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) resource, version `v1alpha2` is deprecated. Use version `v1alpha3` instead:
            - In version `v1alpha3`, the `.spec.sizingPolicies.coreFraction` field is now a string with a percentage (for example, "50%"), similar to the field in a virtual machine.
        ru: |-
          Для ресурса [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) версия `v1alpha2` помечена как устаревшая (deprecated). Вместо неё рекомендуется использовать версию `v1alpha3`:
            - в версии `v1alpha3` поле `.spec.sizingPolicies.coreFraction` теперь задаётся строкой с указанием процента (например, "50%"), аналогично полю в виртуальной машине.
      - en: Added detailed error output in the `Attached` condition of the [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) resource when a block device is unavailable on the virtual machine node.
        ru: В условие `Attached` ресурса [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) добавлен подробный вывод ошибки, возникающей при недоступности блочного устройства на узле виртуальной машины.
    module:
      - en: Added validation for the virtualization ModuleConfig that prevents decreasing the DVCR storage size and changing its StorageClass.
        ru: Для ModuleConfig виртуализации добавлена валидация, запрещающая уменьшать размер и изменять выбранный StorageClass для DVCR.
      - en: Improved audit events by using more informative messages that include virtual machine names and user information.
        ru: "Улучшены события аудита: сообщения стали более информативными и теперь включают имена виртуальных машин и информацию о пользователях."
      - en: |-
          Added the ability to clean up DVCR from non-existent project and cluster images:
            - By default, this feature is disabled.
            - To enable cleanup, set a schedule in the module settings: `.spec.settings.dvcr.gc.schedule`.
        ru: |-
          Добавлена возможность очищать DVCR от несуществующих проектных и кластерных образов:
            - по умолчанию эта функция отключена;
            - чтобы включить очистку, задайте расписание в настройках модуля: `.spec.settings.dvcr.gc.schedule`.
      - en: |-
          Added new metrics for disks:
            - `d8_virtualization_virtualdisk_capacity_bytes`: Metric showing the disk size.
            - `d8_virtualization_virtualdisk_info`: Metric with information about the disk configuration.
            - `d8_virtualization_virtualdisk_status_inuse`: Metric showing the current use of the disk by a virtual machine or for creating other block devices.
        ru: |-
          Добавлены новые метрики для дисков:
            - `d8_virtualization_virtualdisk_capacity_bytes` - метрика, показывающая размер диска;
            - `d8_virtualization_virtualdisk_info` - метрика с информацией о конфигурации диска;
            - `d8_virtualization_virtualdisk_status_inuse` - метрика, показывающая текущее использование диска виртуальной машиной или для создания других блочных устройств.
  fixes:
    virtual-machines:
      - en: Added the ability to modify or delete the [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) resource named "generic". The virtualization module will no longer restore it to its original state.
        ru: Добавлена возможность изменять или удалять ресурс [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) с именем generic. Теперь модуль виртуализации не будет восстанавливать его в исходное состояние.
      - en: Fixed the `MethodNotAllowed` error for `patch` and `watch` operations when querying the [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) resource via command-line utilities (`d8 k`, `kubectl`).
        ru: Исправлена ошибка `MethodNotAllowed` для операций `patch` и `watch` при запросах к ресурсу [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) через утилиты командной строки (`d8 k`, `kubectl`).
    disks-and-images:
      - en: Fixed an issue that prevented deleting [VirtualImage](/modules/virtualization/cr.html#virtualimage) and [ClusterVirtualImage](/modules/virtualization/cr.html#clustervirtualimage) resources for a stopped virtual machine.
        ru: Исправлена проблема, из-за которой было невозможно удалить ресурсы [VirtualImage](/modules/virtualization/cr.html#virtualimage) и [ClusterVirtualImage](/modules/virtualization/cr.html#clustervirtualimage) для остановленной виртуальной машины.
      - en: Fixed an error that could lead to inconsistencies between [VirtualMachineSnapshot](/modules/virtualization/cr.html#virtualmachinesnapshot) and [VirtualDiskSnapshot](/modules/virtualization/cr.html#virtualdisksnapshot) resources when creating a snapshot of a virtual machine with multiple disks.
        ru: Исправлена ошибка, которая могла приводить к неконсистентности ресурсов [VirtualMachineSnapshot](/modules/virtualization/cr.html#virtualmachinesnapshot) и [VirtualDiskSnapshot](/modules/virtualization/cr.html#virtualdisksnapshot) при создании снимка виртуальной машины с несколькими дисками.
    module:
      - en: Fixed RBAC for the `user` and `editor` cluster roles.
        ru: Исправлена конфигурация RBAC для кластерных ролей `user` и `editor`.
      - en: Fixed the `D8VirtualizationVirtualMachineFirmwareOutOfDate` alert, which could be duplicated when virtualization runs in HA mode.
        ru: Исправлен алерт `D8VirtualizationVirtualMachineFirmwareOutOfDate`, который мог дублироваться при работе виртуализации в HA режиме.
  security:
    module:
      - en: Fixed vulnerability CVE-2025-64324.
        ru: Исправлена уязвимость CVE-2025-64324.
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v1.1.3
  date: "2025-11-21"
  highlights:
    - en: Fixed vulnerabilities in the module's components.
      ru: Устранены уязвимости в компонентах модуля.
    - en: The virtual machine dashboards show more detail about the machines and their pods.
      ru: Дашборды виртуальных машин показывают больше подробностей о машинах и их подах.
  improvements:
    observability:
      - en: "The virtual machine overview dashboards (`Namespace / Virtual Machine` and `Namespace / Virtual Machines`) have been improved: in addition to the cluster level, they are now also available at the project level."
        ru: "Доработаны дашборды обзора виртуальных машин (`Namespace / Virtual Machine` и `Namespace / Virtual Machines`): помимо уровня кластера, они теперь доступны и на уровне проекта."
  security:
    module:
      - en: |-
          Fixed vulnerabilities:
            - CVE-2025-64324
            - CVE-2025-64435
            - CVE-2025-64436
            - CVE-2025-58183
            - CVE-2025-58186
            - CVE-2025-58187
            - CVE-2025-58188
            - CVE-2025-52565
            - CVE-2025-52881
            - CVE-2025-31133
        ru: |-
          Исправлены уязвимости:
            - CVE-2025-64324
            - CVE-2025-64435
            - CVE-2025-64436
            - CVE-2025-58183
            - CVE-2025-58186
            - CVE-2025-58187
            - CVE-2025-58188
            - CVE-2025-52565
            - CVE-2025-52881
            - CVE-2025-31133
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v1.1.2
  date: "2025-11-05"
  highlights:
    - en: Live disk migration works between StorageClasses that use different drivers.
      ru: Живая миграция дисков работает между StorageClass с разными драйверами.
    - en: A failed live migration now explains in the machine status what went wrong.
      ru: Неудачная живая миграция теперь объясняет причину в статусе машины.
  fixes:
    virtual-machines:
      - en: In the `Migrating` state, detailed error information is now displayed when a live migration of a virtual machine fails.
        ru: В состоянии `Migrating` при неуспешной живой миграции виртуальной машины добавлено отображение подробной информации об ошибке.
    disks-and-images:
      - en: |-
          Fixed live disk migration between StorageClasses that use different drivers. Restrictions:
            - Migration between `Block` and `Filesystem` is not supported. Only migrations between the same volume mode are allowed: `Block` → `Block` and `Filesystem` → `Filesystem`.
        ru: |-
          Исправлена живая миграция дисков между StorageClass, использующими разные драйверы. Ограничения:
            - Не поддерживается миграция с `Block` на `Filesystem` и наоборот. Миграция возможна только между одинаковыми режимами томов (volume mode): `Block` → `Block` и `Filesystem` → `Filesystem`.
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v1.1.1
  date: "2025-10-16"
  highlights:
    - en: Disks and images report in their status when the data source is unavailable.
      ru: Диски и образы сообщают в статусе о недоступности источника данных.
    - en: Fixed several validation gaps in virtual machine networks and IP addresses.
      ru: Исправлено несколько пробелов в валидации сетей и IP-адресов виртуальных машин.
    - en: Fixed vulnerabilities in the module's components.
      ru: Устранены уязвимости в компонентах модуля.
  features:
    observability:
      - en: Added Prometheus metrics for virtual machine snapshots (`d8_virtualization_virtualmachinesnapshot_info`) and virtual disk snapshots (`d8_virtualization_virtualdisksnapshot_info`), showing which objects they are associated with.
        ru: Добавлены метрики Prometheus для снимков виртуальных машин (`d8_virtualization_virtualmachinesnapshot_info`) и дисков (`d8_virtualization_virtualdisksnapshot_info`), показывающие, к каким объектам они относятся.
  fixes:
    virtual-machines:
      - en: "Fixed the `NetworkReady` condition output: it no longer shows the `Unknown` state and appears only when needed."
        ru: "Исправлен вывод условия `NetworkReady`: он больше не отображается в состоянии `Unknown` и показывается только при необходимости."
      - en: Prohibited duplicate networks in the virtual machine `.spec.network` specification.
        ru: Добавлена валидация, предотвращающая указание одной и той же сети в спецификации виртуальной машины `.spec.network` более одного раза.
      - en: Added validation for static IP addresses to avoid creating a [VirtualMachineIPAddress](/modules/virtualization/cr.html#virtualmachineipaddress) resource with an IP already in use in the cluster.
        ru: Добавлена валидация для статических IP-адресов, предотвращающая создание ресурсов [VirtualMachineIPAddress](/modules/virtualization/cr.html#virtualmachineipaddress) с уже используемым в кластере адресом.
      - en: Fixed a bug where, when detaching a virtual image through [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment), the resource could get stuck in the `Terminating` state.
        ru: Исправлена ошибка, из-за которой при отключении виртуального образа через [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) ресурс мог зависать в состоянии `Terminating`.
    disks-and-images:
      - en: When creating virtual images from virtual disk snapshots, the `.spec.persistentVolumeClaim.storageClassName` parameter is now respected. Previously, it could be ignored.
        ru: Теперь при создании виртуальных образов из снимков виртуальных дисков учитывается параметр `.spec.persistentVolumeClaim.storageClassName`. Ранее он мог игнорироваться.
    module:
      - en: Fixed an issue in the containerd v2 where storage providing a PVC with the `Filesystem` type was incorrectly attached via [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment).
        ru: Исправлена проблема в containerd v2, из-за которой хранилище, предоставляющее PVC с типом `FileSystem`, некорректно подключалось через [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment).
      - en: Added error reporting in the status of disks and images when the data source (URL) is unavailable.
        ru: Добавлено отображение ошибок в статусе дисков и образов при недоступности источника данных (URL).
  security:
    module:
      - en: |-
          Fixed vulnerabilities:
            - CVE-2025-58058
            - CVE-2025-54410
        ru: |-
          Исправлены уязвимости:
            - CVE-2025-58058
            - CVE-2025-54410
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v1.1.0
  date: "2025-10-06"
  highlights:
    - en: Virtual machines (VMs) with disks on local storage can be migrated, and the StorageClass of virtual machine disks can be changed (not available in CE).
      ru: Виртуальные машины (ВМ) с дисками на локальном хранилище можно мигрировать, а StorageClass дисков виртуальных машин — менять (недоступно в редакции CE).
    - en: A virtual machine can be cloned from an existing one through a [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) resource.
      ru: Виртуальную машину можно клонировать из существующей через ресурс [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation).
    - en: New alerts warn about virtual machines on a node that is about to shut down and about DVCR running out of space.
      ru: Новые алерты предупреждают о виртуальных машинах на выключаемом узле и о нехватке места в DVCR.
  features:
    virtual-machines:
      - en: |-
          Added the ability to migrate VMs using disks on local storage. Restrictions:
            - The feature is not available in the CE edition.
            - Migration is only possible for running VMs (`phase: Running`).
            - Migration of VMs with local disks connected via [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) (hotplug) is not supported yet.
        ru: |-
          Добавлена возможность миграции ВМ, использующих диски на локальных хранилищах. Ограничения:
            - Функция недоступна в CE-редакции.
            - Миграция возможна только для запущенной ВМ (`phase: Running`)
            - Миграция ВМ с локальными дисками, подключенными через [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) (hotplug), пока недоступна.
      - en: "Added an operation with the `Clone` type to create a clone of a VM from an existing VM ([VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) `.spec.type: Clone`)."
        ru: "Добавлена операция с типом `Clone` для создания клона ВМ из существующей ВМ ([VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) `.spec.type: Clone`)."
    disks-and-images:
      - en: |-
          Added the ability to migrate storage for VM disks (change StorageClass). Restrictions:
            - The feature is not available in the CE edition.
            - Migration is only possible for running VMs (`phase: Running`).
            - Storage migration for disks connected via [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) (hotplug) is not supported yet.
        ru: |-
          Добавлена возможность миграции хранилища для дисков ВМ (изменение StorageClass). Ограничения:
            - Функция недоступна в CE-редакции.
            - Миграция возможна только для запущенной ВМ (`phase: Running`)
            - Миграция хранилища для дисков, подключенных через [VirtualMachineBlockDeviceAttachment](/modules/virtualization/cr.html#virtualmachineblockdeviceattachment) (hotplug), пока недоступна.
    observability:
      - en: Added the `KubeNodeAwaitingVirtualMachinesEvictionBeforeShutdown` alert, which is triggered when the node hosting the virtual machines is about to shut down but VM evacuation is not yet complete.
        ru: Добавлен алерт `KubeNodeAwaitingVirtualMachinesEvictionBeforeShutdown`, срабатывающий при получении узлом, на котором размещены виртуальные машины, команды на завершение работы — до завершения эвакуации ВМ.
      - en: Added the `D8VirtualizationDVCRInsufficientCapacityRisk` alert, which warns of the risk of insufficient free space in the virtual machine image storage (DVCR).
        ru: Добавлен алерт `D8VirtualizationDVCRInsufficientCapacityRisk`, предупреждающий о риске нехватки свободного места в хранилище образов виртуальных машин (DVCR).
  fixes:
    virtual-machines:
      - en: Fixed an issue in [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) types `Features` and `Discovery` that caused nested virtualization not to work on nodes with AMD processors.
        ru: Исправлена ошибка в [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) типах `Features` и `Discovery`, из-за которой на узлах с процессорами AMD не работала вложенная виртуализация.
      - en: "Fixed behavior when creating a VM snapshot with uncommitted changes: the snapshot now instantly captures the current state of the virtual machine, including all current changes."
        ru: "Исправлено поведение при создании снимка ВМ при наличии неприменённых изменений: снимок теперь мгновенно фиксирует актуальное состояние виртуальной машины, включая все текущие изменения."
      - en: "Fixed garbage collector behavior: previously, all VMOP objects were deleted after restarting the virtualization controller, ignoring cleanup rules."
        ru: "Исправлена работа сборщика мусора: ранее при перезапуске virtualization-controller все объекты VMOP удалялись без учёта правил очистки."
    observability:
      - en: The virtual machine dashboard now displays statistics for all networks (including additional ones) connected to the VM.
        ru: Дашборд виртуальной машины теперь отображает статистику по всем сетям (в том числе и дополнительным), подключённым к ВМ.
      - en: Fixed the graph on the virtual machine dashboard that displays memory copy statistics during VM migration.
        ru: На дашборде виртуальной машины исправлен график, отображающий статистику копирования памяти во время миграции ВМ.
    module:
      - en: Fixed an issue with installing the module on RedOS 8.X OS.
        ru: Исправлена проблема установки модуля на RedOS 8.X ОС.
      - en: Improved validation to prevent adding empty values for parameters that define StorageClass for disks and images.
        ru: Улучшена валидация, предотвращающая добавление пустых значений для параметров, определяющих StorageClass для дисков и образов.
      - en: Fixed the controller sometimes starting a restored VM before its disks were fully restored, so the machine started with old, unrestored disks.
        ru: Исправлено, что контроллер иногда запускал восстановленную ВМ до завершения восстановления её дисков, и машина стартовала со старыми, невосстановленными дисками.
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v1.0.0
  date: "2025-09-11"
  highlights:
    - en: A virtual machine (VM) can be restored from a snapshot through the Restore operation, with the annotations and labels it had at the time of the snapshot.
      ru: Виртуальную машину (ВМ) можно восстановить из снимка операцией Restore вместе с аннотациями и метками, которые были на момент снимка.
    - en: A cloud image in use is protected from being deleted.
      ru: Используемый облачный образ защищён от удаления.
  features:
    virtual-machines:
      - en: Added protection to prevent a cloud image ([VirtualImage](/modules/virtualization/cr.html#virtualimage) / [ClusterVirtualImage](/modules/virtualization/cr.html#clustervirtualimage)) from being connected as the first disk. Previously, this caused the VM to fail to start with the "No bootable device" error.
        ru: Добавлена защита от подключения cloud-образа ([VirtualImage](/modules/virtualization/cr.html#virtualimage) / [ClusterVirtualImage](/modules/virtualization/cr.html#clustervirtualimage)) в качестве первого диска. Ранее это приводило к невозможности запуска ВМ с ошибкой "No bootable device".
      - en: Added `Restore` operation to restore a VM from a previously created snapshot.
        ru: Добавлена операция с типом `Restore` для восстановления ВМ из ранее созданного снимка.
  fixes:
    virtual-machines:
      - en: When restoring a virtual machine from a snapshot, all annotations and labels that were present on the resources at the time of the snapshot are now restored correctly.
        ru: Теперь при восстановлении виртуальной машины из снимка корректно восстанавливаются все аннотации и метки, которые были у ресурсов в момент снимка.
      - en: Fixed `core`/`coreFraction` validation in the [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) resource.
        ru: Исправлена валидация `core`/`coreFraction` в ресурсе [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass).
    module:
      - en: Fixed an issue with queue blocking when the `settings.modules.publicClusterDomain` parameter was empty in the global ModuleConfig resource.
        ru: Исправлена проблема с блокировкой очереди, когда параметр `settings.modules.publicClusterDomain` был пустым в глобальном ресурсе ModuleConfig.
      - en: Optimized hook performance during module installation.
        ru: Оптимизирована производительность хука во время установки модуля.
      - en: When the `sdn` module is disabled, the configuration of additional networks in the VM is not available.
        ru: При выключенном модуле `sdn` конфигурация дополнительных сетей в ВМ недоступна.
  security:
    module:
      - en: |-
          Fixed vulnerabilities:
            - CVE-2025-47907
        ru: |-
          Исправлены уязвимости:
            - CVE-2025-47907
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
- version: v0.25.0
  date: "2025-08-29"
  highlights:
    - en: Additional network interfaces of a virtual machine (VM) can be connected to networks provided by the `sdn` module, with MAC address management through [VirtualMachineMACAddress](/modules/virtualization/cr.html#virtualmachinemacaddress).
      ru: Дополнительные сетевые интерфейсы виртуальной машины (ВМ) можно подключать к сетям модуля `sdn`, MAC-адресами управляет ресурс [VirtualMachineMACAddress](/modules/virtualization/cr.html#virtualmachinemacaddress).
    - en: A [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) can be marked as the default one, so a virtual machine no longer has to name its class.
      ru: "[VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) можно пометить как класс по умолчанию, тогда виртуальной машине не нужно называть свой класс."
    - en: New Prometheus metrics track the phase of snapshots and images.
      ru: Новые метрики Prometheus отслеживают фазу снимков и образов.
  features:
    virtual-machines:
      - en: MAC address management for additional network interfaces has been added using the [VirtualMachineMACAddress](/modules/virtualization/cr.html#virtualmachinemacaddress) and [VirtualMachineMACAddressLease](/modules/virtualization/cr.html#virtualmachinemacaddresslease) resources.
        ru: Для дополнительных сетевых интерфейсов добавлено управление MAC-адресами с использованием ресурсов [VirtualMachineMACAddress](/modules/virtualization/cr.html#virtualmachinemacaddress) и [VirtualMachineMACAddressLease](/modules/virtualization/cr.html#virtualmachinemacaddresslease).
      - en: Added the ability to attach additional network interfaces to a virtual machine for networks provided by the `sdn` module. For this, the `sdn` module must be enabled in the cluster.
        ru: Добавлена возможность подключения к виртуальной машине дополнительных сетевых интерфейсов к сетям, предоставляемым модулем `sdn`. Для этого модуль `sdn` должен быть включен в кластере.
      - en: An annotation has been added to set the default `VirtualMachineClass`. You can designate a [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) as the default by adding the annotation `virtualmachineclass.virtualization.deckhouse.io/is-default-class=true`. This allows creating VMs with an empty `spec.virtualMachineClassName` field, which will be automatically filled with the default class.
        ru: Добавлена аннотация для установки класса виртуальной машины по умолчанию. Чтобы назначить [VirtualMachineClass](/modules/virtualization/cr.html#virtualmachineclass) по умолчанию, необходимо добавить на него аннотацию `virtualmachineclass.virtualization.deckhouse.io/is-default-class=true`. Это позволяет создавать ВМ с пустым полем `spec.virtualMachineClassName`, автоматически заполняя его классом по умолчанию.
    observability:
      - en: New Prometheus metrics have been added to track the phase of resources such as [VirtualMachineSnapshot](/modules/virtualization/cr.html#virtualmachinesnapshot), [VirtualDiskSnapshot](/modules/virtualization/cr.html#virtualdisksnapshot), [VirtualImage](/modules/virtualization/cr.html#virtualimage), and [ClusterVirtualImage](/modules/virtualization/cr.html#clustervirtualimage).
        ru: Добавлены новые метрики Prometheus для отслеживания фазы ресурсов, таких как [VirtualMachineSnapshot](/modules/virtualization/cr.html#virtualmachinesnapshot), [VirtualDiskSnapshot](/modules/virtualization/cr.html#virtualdisksnapshot), [VirtualImage](/modules/virtualization/cr.html#virtualimage) и [ClusterVirtualImage](/modules/virtualization/cr.html#clustervirtualimage).
  improvements:
    virtual-machines:
      - en: |-
          Improved the garbage collector (GC) for completed virtual machine operations:
            - Runs daily at 00:00.
            - Removes successfully completed operations (`Completed` / `Failed`) after their TTL (24 hours) expires.
            - Retains only the last 10 completed operations.
        ru: |-
          Улучшен сборщик мусора (GC) для завершённых операций виртуальной машины:
            - GC запускается каждый день в 00:00;
            - GC будет удалять успешно завершённые операции (`Completed` / `Failed`), если истёк их TTL (24 часа);
            - GC подчищает все завершённые операции (`Completed` / `Failed`), оставляя только 10 последних.
  fixes:
    virtual-machines:
      - en: Fixed an issue where changing the operating system type caused the machine to enter a reboot loop.
        ru: "Исправлена проблема: при изменении типа операционной системы машина уходила в циклическую перезагрузку."
      - en: Fixed an issue where a virtual machine would hang in the `Starting` phase when project quotas were insufficient. A quota shortage message will now be displayed in the virtual machine's status. To allow the machine to continue starting, the project quotas need to be increased.
        ru: Исправлено зависание виртуальной машины в фазе `Starting` при нехватке квот проекта. Сообщение о нехватке квот будет отображаться в статусе виртуальной машины. Чтобы машина продолжила запуск, необходимо будет увеличить квоты проекта.
    disks-and-images:
      - en: To create a virtual image on a `PersistentVolumeClaim`, the storage must support the `RWX` and `Block` modes; otherwise, a warning will be displayed.
        ru: Для создания виртуального образа на `PersistentVolumeClaim` должно быть использовано хранилище в режиме `RWX` и `Block`, в противном случае будет отображено предупреждение об ошибке.
    module:
      - en: Added validation to ensure that virtual machine subnets do not overlap with system subnets (`podSubnetCIDR` and `serviceSubnetCIDR`).
        ru: Добавлена валидация, проверяющая, что подсети виртуальных машин не пересекаются с системными подсетями (`podSubnetCIDR` и `serviceSubnetCIDR`).
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
    - en: |-
        In version v0.25.0, support for the module's operation with CRI containerd v2 has been added.
          After upgrading CRI from containerd v1 to containerd v2, it is necessary to recreate the images that were created using the virtualization module version v0.24.0 or earlier.
      ru: |-
        В версии v0.25.0 добавлена поддержка работы модуля с CRI containerd v2.
          После обновления CRI с containerd v1 до containerd v2 необходимо пересоздать образы, которые были созданы с использованием версии модуля виртуализации v0.24.0 и ранее.
