- version: v1.7.0
  date: "2026-03-31"
  highlights:
    - en: TCP connections survive live migration of a virtual machine.
      ru: TCP-соединения переживают живую миграцию виртуальной машины.
    - en: The order of additional network interfaces stays the same across virtual machine restarts.
      ru: Порядок дополнительных сетевых интерфейсов не меняется при перезапусках виртуальной машины.
    - en: USB devices are taken into account when scheduling virtual machines, and their downtime during migration is shorter.
      ru: USB-устройства учитываются при планировании виртуальных машин, а их простой во время миграции сократился.
    - en: Block devices can be attached and detached on a cordoned node, and a virtual machine is no longer evicted before its block device pods.
      ru: Блочные устройства можно подключать и отключать на узле, для которого выполнен cordon, а виртуальная машина больше не вытесняется раньше своих подов блочных устройств.
  features:
    virtual-machines:
      - en: The order of additional network interfaces is now deterministic and does not change after virtual machine restarts. For this to work for virtual machines created on earlier versions, they must be restarted.
        ru: Порядок дополнительных сетевых интерфейсов теперь детерминирован и не меняется при рестартах виртуальных машин. Чтобы это работало на виртуальных машинах, созданных на ранних версиях, их необходимо перезапустить.
      - en: Added a mechanism to prevent TCP connection drops during live migration of a virtual machine.
        ru: Добавлен механизм, предотвращающий разрыв TCP-соединений при живой миграции виртуальной машины.
      - en: Reduced USB device downtime during virtual machine migration.
        ru: Сокращено время недоступности USB-устройств во время миграции виртуальной машины.
      - en: |-
          Added a garbage collector for completed and failed virtual machine pods:
            - Pods older than 24 hours are deleted.
            - No more than 2 completed pods are retained.
        ru: |-
          Добавлен сборщик завершившихся и неуспешных подов виртуальных машин:
            - поды старше 24 часов удаляются;
            - хранится не более 2 завершённых подов.
      - en: When scheduling virtual machines on nodes, the system now takes into account whether a USB device uses USB 2.0 (High-Speed) or USB 3.0 (SuperSpeed).
        ru: При планировании размещения виртуальных машин на узлах теперь учитывается, использует ли USB-устройство USB 2.0 (High-Speed) или USB 3.0 (SuperSpeed).
  fixes:
    virtual-machines:
      - en: Fixed double storage quota consumption during migration of a virtual machine with local storage.
        ru: Исправлено двойное потребление квоты на хранилище при миграции виртуальной машины с локальным хранилищем.
      - en: When using [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) with the `Clone` or `Restore` type, disks now also restore their association with the virtual machine (owner reference).
        ru: При использовании [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) с типом `Clone` или `Restore` диски теперь также восстанавливают свою принадлежность к виртуальной машине (owner reference).
      - en: "Fixed virtual machine eviction during node drain: pods responsible for block device attachments are no longer removed from a cordoned node before virtual machine migration is complete."
        ru: "Исправлено вытеснение виртуальных машин при выполнении drain узла: поды, отвечающие за подключение блочных устройств, больше не удаляются с узла, для которого выполнен cordon, до окончания миграции виртуальной машины."
      - en: Block devices can now be attached and detached even if the virtual machine is running on a cordoned node.
        ru: Блочные устройства можно подключать и отключать, даже если виртуальная машина работает на узле, для которого выполнен cordon.
      - en: "Fixed validation for the `AlwaysForced` virtual machine migration policy: [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) resources with the `Evict` or `Migrate` type without explicit `force=true` are now rejected for this policy."
        ru: "Исправлена валидация для политики миграции виртуальной машины `AlwaysForced`: операции [VirtualMachineOperation](/modules/virtualization/cr.html#virtualmachineoperation) с типами `Evict` или `Migrate` без явного `force=true` теперь отклоняются для этой политики."
      - en: Fixed an issue where a virtual machine could get stuck in the `Maintenance` state during restore from a snapshot.
        ru: Исправлена проблема, из-за которой виртуальная машина могла зависнуть в состоянии `Maintenance` во время восстановления из снимка.
      - en: Added storage-side error messages (from the CSI driver) to the virtual machine status for block device attachment failures.
        ru: В статус виртуальной машины добавлено отображение сообщений об ошибках, произошедших на стороне хранилища (CSI-драйвера) при подключении блочных устройств.
      - en: Stabilized USB device support for virtualization on Deckhouse Kubernetes Platform version `>=1.76` and Kubernetes version `>=1.33`.
        ru: Стабилизирована работа USB-устройств для виртуализации на Deckhouse Kubernetes Platform версии `>=1.76` и Kubernetes версии `>=1.33`.
      - en: "Fixed USB device detection on the host: duplicate USB devices could previously appear."
        ru: "Исправлено обнаружение USB-устройств на хосте: ранее могли появляться дубликаты USB-устройств."
    disks-and-images:
      - en: Fixed the creation of block devices from VMDK files (especially for VMDKs in the `streamOptimized` format used in exports from VMware).
        ru: Исправлено создание блочных устройств из файлов VMDK (в особенности для VMDK в формате `streamOptimized`, используемых в экспортах из VMware).
  upgrade:
    - en: During the upgrade to this version, running virtual machines will be automatically migrated to update their firmware version.
      ru: В процессе обновления до этой версии работающие виртуальные машины будут автоматически мигрированы для обновления версии прошивки.
