apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtualdisksnapshots.virtualization.deckhouse.io
  labels:
    heritage: deckhouse
    module: virtualization
spec:
  group: virtualization.deckhouse.io
  scope: Namespaced
  names:
    categories:
      - virtualization
    plural: virtualdisksnapshots
    singular: virtualdisksnapshot
    kind: VirtualDiskSnapshot
    shortNames:
      - vdsnapshot
      - vds
  preserveUnknownFields: false
  versions:
    - name: v1alpha2
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: |
            Provides a resource for creating snapshots of existing virtual disks, which can be used as data sources for generating new virtual disks.

            When running, a VolumeSnapshot resource is created.
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - virtualDiskName
              properties:
                virtualDiskName:
                  type: string
                  minLength: 1
                  description: |
                    Virtual disk name the snapshot is created for.
                requiredConsistency:
                  type: boolean
                  default: true
                  description: |
                    Create a snapshot of a connected virtual machine's disk only if it is possible to freeze the machine through the agent.

                    If set to `True`, a virtual disk snapshot will be created when at least one of the following conditions is met:
                    - The virtual disk is not connected to any virtual machine.
                    - The virtual disk is connected to a powered-off virtual machine.
                    - The virtual disk is connected to a virtual machine with an agent, and the freeze operation was successful.
            status:
              type: object
              properties:
                conditions:
                  description: |
                    Last confirmed status of the resource.
                  items:
                    description: Details of a single aspect of the current state for this API resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          Last time the condition transitioned from one status to another.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          Human-readable message with details about the last transition.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          `.metadata.generation` the condition was based upon.
                          For instance, if `.metadata.generation` is currently `12` but `.status.conditions[x].observedGeneration` is `9`, the condition is considered outdated.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          Brief reason for the condition's last transition.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: |-
                          Condition status. Possible values: `True`, `False`, or `Unknown`.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: |-
                          Condition type.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                volumeSnapshotName:
                  type: string
                  description: |
                    Name of the created VolumeSnapshot resource.
                consistent:
                  type: boolean
                  description: |
                    Virtual disk snapshot is consistent.
                phase:
                  type: string
                  description: |
                    Current status of the VirtualDiskSnapshot resource:

                    * `Pending`: The resource has been created and is on a waiting queue.
                    * `InProgress`: The virtual disk snapshot is being created.
                    * `Ready`: The virtual disk snapshot has been created successfully and is now available to use.
                    * `Failed`: There was an error when creating the virtual disk snapshot.
                    * `Terminating`: The resource is being deleted.
                  enum:
                    ["Pending", "InProgress", "Ready", "Failed", "Terminating"]
                observedGeneration:
                  type: integer
                  description: |
                    Resource generation last processed by the controller.
                boundSnapshotContentName:
                  description: |-
                    BoundSnapshotContentName is the name of the cluster-scoped SnapshotContent bound to this node.
                    Written by the state-snapshotter core binder; read-only from the domain controller's perspective.
                  type: string
                captureState:
                  description: |-
                    CaptureState is the SDK capture state machine for this node (barrier 1/2 phase, capture request
                    names, core-owned success latches).
                  properties:
                    commonController:
                      description:
                        "CommonController holds the core-written capture-leg
                        success latches. Single writer: core."
                      properties:
                        childrenSettled:
                          description: |-
                            ChildrenSettled is the core-computed "every direct child has gone terminal (captured-OK or
                            failed)" latch. It is NOT a capture leg and does not participate in this node's own
                            AllLegsCaptured/CoreCaptureOutcome — it is the completeness signal a domain controller reads to
                            time a barrier-2 consistency action (e.g. fs unfreeze) that must fire even when a child capture
                            failed. Nil means no direct children (leaf) or not computed yet; true once every direct child is
                            terminal.
                          type: boolean
                        dataCaptured:
                          description: |-
                            DataCaptured is the core-owned success latch for the data leg, with the same nil/false/true
                            semantics as ManifestCaptured. Always nil on VirtualMachineSnapshot.
                          type: boolean
                        manifestCaptured:
                          description: |-
                            ManifestCaptured is the core-owned success latch for the manifest leg. Nil means the leg was not
                            declared yet; false means declared but not yet captured; true means durably captured.
                          type: boolean
                        childSubtreesManifestsPersisted:
                          description: |-
                            ChildSubtreesManifestsPersisted is the core-computed "the subtrees of ALL declared direct
                            children archived their manifests" latch. Not a capture leg: it covers the children only, so
                            "the whole node is persisted" decomposes as ManifestCaptured &&
                            ChildSubtreesManifestsPersisted.
                          type: boolean
                        subtreePlanned:
                          description: |-
                            SubtreePlanned is a core-computed monotonic recursive latch: true once this node and its whole
                            subtree finished planning (barrier 1). Not a capture leg.
                          type: boolean
                      type: object
                    domainSpecificController:
                      description: |-
                        DomainSpecificController holds the domain-written planning refs and lifecycle. Single writer: the
                        domain controller, via the SDK.
                      properties:
                        excludedRefs:
                          description: |-
                            ExcludedRefs are this node's direct exclusion vetoes (state-snapshotter.deckhouse.io/exclude label
                            on a child source object). This PoC controller does not implement the veto label, so it always
                            publishes an empty list here (required by the SDK contract to be present, not omitted).
                          items:
                            description: |-
                              UnifiedSnapshotterChildRef mirrors state-snapshotter's storage/v1alpha1.SnapshotChildRef /
                              ExcludedObjectRef: a reference within the namespace-local snapshot run tree. Namespace is implicit
                              (always the parent snapshot's own namespace) — unlike UnifiedSnapshotterSourceRef, it carries no
                              namespace or UID.
                            properties:
                              apiVersion:
                                description: API version of the referenced object.
                                type: string
                              kind:
                                description: Kind of the referenced object.
                                type: string
                              name:
                                description: Name of the referenced object.
                                type: string
                            required:
                              - apiVersion
                              - kind
                              - name
                            type: object
                          type: array
                        manifestCaptureRequestName:
                          description:
                            ManifestCaptureRequestName is the name of the
                            ManifestCaptureRequest created for this node.
                          type: string
                        message:
                          description:
                            Message is a human-readable progress or failure
                            message.
                          type: string
                        phase:
                          description:
                            Phase is the domain capture phase (SDK barrier
                            1/2 state machine).
                          enum:
                            - Planning
                            - Planned
                            - Finished
                            - Failed
                          type: string
                        reason:
                          description:
                            Reason is the machine-readable failure reason,
                            set only when Phase is Failed.
                          type: string
                        volumeCaptureRequestName:
                          description: |-
                            VolumeCaptureRequestName is the name of the VolumeCaptureRequest created for this node's single
                            data leg. Populated only on VirtualDiskSnapshot; always empty on VirtualMachineSnapshot, which
                            carries no data leg of its own.
                          type: string
                      required:
                        - excludedRefs
                      type: object
                  type: object
                childrenSnapshotRefs:
                  description: |-
                    ChildrenSnapshotRefs is always empty on this data-bearing leaf; kept for uniformity across
                    snapshot kinds (mirrors state-snapshotter's own reference domain implementation).
                  items:
                    description: |-
                      UnifiedSnapshotterChildRef mirrors state-snapshotter's storage/v1alpha1.SnapshotChildRef /
                      ExcludedObjectRef: a reference within the namespace-local snapshot run tree. Namespace is implicit
                      (always the parent snapshot's own namespace) — unlike UnifiedSnapshotterSourceRef, it carries no
                      namespace or UID.
                    properties:
                      apiVersion:
                        description: API version of the referenced object.
                        type: string
                      kind:
                        description: Kind of the referenced object.
                        type: string
                      name:
                        description: Name of the referenced object.
                        type: string
                    required:
                      - apiVersion
                      - kind
                      - name
                    type: object
                  type: array
                excludedRefs:
                  description: |-
                    ExcludedRefs is the top-level mirror of the bound SnapshotContent's durable excludedRefs aggregate.
                    Written only by the core; a data-bearing leaf has no children, so this is normally empty.
                  items:
                    description: |-
                      UnifiedSnapshotterChildRef mirrors state-snapshotter's storage/v1alpha1.SnapshotChildRef /
                      ExcludedObjectRef: a reference within the namespace-local snapshot run tree. Namespace is implicit
                      (always the parent snapshot's own namespace) — unlike UnifiedSnapshotterSourceRef, it carries no
                      namespace or UID.
                    properties:
                      apiVersion:
                        description: API version of the referenced object.
                        type: string
                      kind:
                        description: Kind of the referenced object.
                        type: string
                      name:
                        description: Name of the referenced object.
                        type: string
                    required:
                      - apiVersion
                      - kind
                      - name
                    type: object
                  type: array
                sourceRef:
                  description: |-
                    SourceRef is the full identity of the live source object this node captured (Capture mode only),
                    published via the SDK's PublishSnapshotSource for later use by import/restore tooling.
                  properties:
                    apiVersion:
                      description: API version of the referenced object.
                      type: string
                    kind:
                      description: Kind of the referenced object.
                      type: string
                    name:
                      description: Name of the referenced object.
                      type: string
                    namespace:
                      description: Namespace of the referenced object, if namespaced.
                      type: string
                    uid:
                      description:
                        UID of the referenced object at the time this reference
                        was published.
                      type: string
                  required:
                    - apiVersion
                    - kind
                    - name
                  type: object
                data:
                  description:
                    "Data is the captured volume's durable data binding, mirrored verbatim from the bound
                    SnapshotContent

                    by the state-snapshotter core once the data leg is captured. VirtualDisk provisioning restores from

                    Data.ArtifactRef (via a storage-foundation VolumeRestoreRequest) instead of cloning the plain

                    namespaced CSI VolumeSnapshot referenced by VolumeSnapshotName: the SDK-captured artifact is a

                    VolumeSnapshotContent that external-snapshotter refuses to bind a new VolumeSnapshot to."
                  properties:
                    accessModes:
                      description: AccessModes records the source PersistentVolumeClaim access modes.
                      items:
                        type: string
                      type: array
                    artifactRef:
                      description:
                        ArtifactRef references the cluster-scoped durable data artifact backing the captured
                        data.
                      properties:
                        apiVersion:
                          description: API version of the referenced artifact.
                          type: string
                        kind:
                          description: Kind of the referenced artifact.
                          type: string
                        name:
                          description: Name of the referenced artifact.
                          type: string
                        uid:
                          description: "UID is filled best-effort: the artifact may be referenced before its UID is known."
                          type: string
                      required:
                        - apiVersion
                        - kind
                        - name
                      type: object
                    fsType:
                      description: FsType records the source filesystem type (Filesystem volumes only).
                      type: string
                    size:
                      description:
                        'Size records the real allocated size of the captured volume, taken from the data artifact''s

                        restoreSize. Stored as a resource.Quantity string (e.g. "10Gi").'
                      type: string
                    sourceRef:
                      description:
                        "SourceRef identifies the captured PersistentVolumeClaim backing this node's data.
                        Distinct from the

                        top-level status.sourceRef, which references the captured live domain object."
                      properties:
                        apiVersion:
                          description: API version of the referenced object.
                          type: string
                        kind:
                          description: Kind of the referenced object.
                          type: string
                        name:
                          description: Name of the referenced object.
                          type: string
                        namespace:
                          description: Namespace of the referenced object, if namespaced.
                          type: string
                        uid:
                          description: UID of the referenced object at the time this reference was published.
                          type: string
                      required:
                        - apiVersion
                        - kind
                        - name
                      type: object
                    storageClassName:
                      description: StorageClassName records the source StorageClass of the captured volume.
                      type: string
                    volumeMode:
                      description:
                        "VolumeMode records the source volume mode (Block or Filesystem). CSI snapshots are
                        mode-agnostic,

                        so it is persisted here to recreate the PersistentVolumeClaim on restore."
                      type: string
                  required:
                    - artifactRef
                    - sourceRef
                  type: object
                storageClassName:
                  description: |-
                    StorageClassName mirrors the captured disk's storage class at capture time. Used as the
                    default target storage class when cloning a new VirtualDisk from this snapshot and the
                    caller doesn't specify one.
                  type: string
                persistentVolumeClaimSize:
                  description: |-
                    PersistentVolumeClaimSize mirrors the captured disk's requested PVC size (a resource.Quantity
                    string) at capture time. Used as the default target size when cloning a new VirtualDisk from
                    this snapshot and the caller doesn't specify one.
                  type: string
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Consistent
          type: boolean
          jsonPath: .status.consistent
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
