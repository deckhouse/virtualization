spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            VirtualMachineAccessClaim запрашивает доступ к виртуальной машине для создания снимка её дисков. Снимок,
            которому принадлежит запрос, создаёт и освобождает его; координатор доступа к виртуальным машинам одобряет
            или отклоняет запрос и является единственным компонентом, который замораживает и размораживает файловую
            систему гостевой ОС.

            Это внутренний ресурс: пользовательские роли не дают прав на него.
          properties:
            spec:
              description: |
                Запрошенный доступ к виртуальной машине. Не может быть изменён после создания, кроме поля `release`.
              properties:
                access:
                  description: |
                    Запрошенные режимы доступа. Всегда содержит `Snapshot`; `Freeze` добавляется, чтобы заморозить
                    файловую систему гостевой ОС на время создания снимка.
                  items:
                    description: |
                      Доступ к виртуальной машине:
                      * `Snapshot` — создание снимка дисков виртуальной машины.
                      * `Freeze` — заморозка файловой системы гостевой ОС.
                freezePolicy:
                  description: |
                    Что делать, если файловую систему не удаётся заморозить. Задаётся, только если `access` содержит `Freeze`:
                    * `Required` — запрос отклоняется.
                    * `BestEffort` — доступ выдаётся без заморозки, снимок не будет консистентным.
                release:
                  description: |
                    Выставляется снимком, когда доступ больше не нужен. Не может быть снято.
                timeout:
                  description: |
                    Дедлайн сессии, отсчитывается с момента выдачи доступа. По его истечении координатор размораживает
                    виртуальную машину и прерывает сессию. Не больше 30m: дедлайн ограничивает и время, которое гостевая ОС
                    может провести замороженной без координатора. У сессии остановленной виртуальной машины дедлайна нет.
                virtualMachine:
                  description: |
                    Виртуальная машина, к которой нужен доступ. UID привязывает запрос к конкретному экземпляру виртуальной
                    машины, поэтому виртуальная машина, пересозданная с тем же именем, не получит доступ по запросу,
                    созданному для её предшественницы.
                  properties:
                    name:
                      description: |
                        Имя виртуальной машины.
                    uid:
                      description: |
                        UID виртуальной машины.
            status:
              properties:
                conditions:
                  description: |
                    Последнее подтверждённое состояние запроса.
                  items:
                    description: |
                      Подробные сведения об одном аспекте текущего состояния данного API-ресурса.
                    properties:
                      lastTransitionTime:
                        description: Время перехода условия из одного состояния в другое.
                      message:
                        description: Удобочитаемое сообщение с подробной информацией о последнем переходе.
                      observedGeneration:
                        description: |
                          `.metadata.generation`, на основе которого было установлено условие.
                          Например, если `.metadata.generation` в настоящее время имеет значение `12`, а `.status.conditions[x].observedgeneration` имеет значение `9`, то условие устарело.
                      reason:
                        description: Краткая причина последнего перехода состояния.
                      status:
                        description: |
                          Статус условия.
                      type:
                        description: Тип условия.
                deadline:
                  description: |
                    Время окончания сессии, если доступ не будет освобождён раньше. Не задаётся для сессии остановленной
                    виртуальной машины: такая сессия заканчивается при её запуске.
                frozen:
                  description: |
                    Была ли файловая система виртуальной машины заморожена в рамках этой сессии.
                grantedAt:
                  description: |
                    Время выдачи доступа.
                observedGeneration:
                  description: |
                    Поколение ресурса, которое в последний раз обрабатывалось координатором.
                phase:
                  description: |
                    Текущая фаза запроса:
                    * `Pending` — координатор выдаёт доступ, например ждёт заморозки файловой системы.
                    * `Granted` — доступ выдан.
                    * `Denied` — доступ не может быть выдан.
                    * `Aborted` — сессия прервана до освобождения доступа.
                    * `Completed` — доступ освобождён, сессия прошла без нарушений.
                virtualMachineInstanceUID:
                  description: |
                    UID экземпляра виртуальной машины, к которому привязана сессия. Пусто для остановленной виртуальной машины.
