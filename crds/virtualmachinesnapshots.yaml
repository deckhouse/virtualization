---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  labels:
    heritage: deckhouse
    module: virtualization
  name: virtualmachinesnapshots.virtualization.deckhouse.io
spec:
  group: virtualization.deckhouse.io
  names:
    categories:
      - virtualization
    kind: VirtualMachineSnapshot
    listKind: VirtualMachineSnapshotList
    plural: virtualmachinesnapshots
    shortNames:
      - vmsnapshot
      - vms
    singular: virtualmachinesnapshot
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - description: VirtualMachineSnapshot phase.
          jsonPath: .status.phase
          name: Phase
          type: string
        - description: VirtualMachineSnapshot consistency.
          jsonPath: .status.consistent
          name: Consistent
          type: boolean
        - description: VirtualMachineSnapshot age.
          jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha2
      schema:
        openAPIV3Schema:
          description:
            VirtualMachineSnapshot provides a resource for creating snapshots
            of virtual machines.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              properties:
                keepIPAddress:
                  default: Always
                  description: |-
                    KeepIPAddress defines whether to keep the IP address of a virtual machine or not:

                    * `Always`: When creating a snapshot, the virtual machine's IP address will be converted from `Auto` to `Static` and saved.
                    * `Never`: When creating a snapshot, the virtual machine's IP address will not be converted.
                  enum:
                    - Always
                    - Never
                  type: string
                requiredConsistency:
                  default: true
                  description: |-
                    Create a snapshot of a virtual machine only if it is possible to freeze the machine through the agent.

                    If set to `true`, the virtual machine snapshot will be created only in the following cases:
                    - When the virtual machine is powered off.
                    - When the virtual machine has an agent, and the freeze operation was successful.
                  type: boolean
                virtualMachineName:
                  description: Name of the virtual machine to take a snapshot of.
                  minLength: 1
                  type: string
              required:
                - keepIPAddress
                - requiredConsistency
                - virtualMachineName
              type: object
            status:
              properties:
                boundSnapshotContentName:
                  description: |-
                    BoundSnapshotContentName is the name of the cluster-scoped SnapshotContent bound to this node.
                    Written by the state-snapshotter core binder; read-only from the domain controller's perspective.
                  type: string
                captureState:
                  description: |-
                    CaptureState is the SDK capture state machine for this node (barrier 1/2 phase, capture request
                    names, core-owned success latches).
                  properties:
                    commonController:
                      description:
                        "CommonController holds the core-written capture-leg
                        success latches. Single writer: core."
                      properties:
                        childSubtreesManifestsPersisted:
                          description: |-
                            ChildSubtreesManifestsPersisted is the core-computed "the subtrees of ALL declared direct children
                            archived their manifests" latch. Not a capture leg: it covers the children only, so "the whole node
                            is persisted" decomposes as ManifestCaptured && ChildSubtreesManifestsPersisted.
                          type: boolean
                        childrenSettled:
                          description: |-
                            ChildrenSettled is the core-computed "every direct child has gone terminal (captured-OK or
                            failed)" latch. It is NOT a capture leg and does not participate in this node's own
                            AllLegsCaptured/CoreCaptureOutcome — it is the completeness signal a domain controller reads to
                            time a barrier-2 consistency action (e.g. fs unfreeze) that must fire even when a child capture
                            failed. Nil means no direct children (leaf) or not computed yet; true once every direct child is
                            terminal.
                          type: boolean
                        dataCaptured:
                          description: |-
                            DataCaptured is the core-owned success latch for the data leg, with the same nil/false/true
                            semantics as ManifestCaptured. Always nil on VirtualMachineSnapshot.
                          type: boolean
                        manifestCaptured:
                          description: |-
                            ManifestCaptured is the core-owned success latch for the manifest leg. Nil means the leg was not
                            declared yet; false means declared but not yet captured; true means durably captured.
                          type: boolean
                        subtreePlanned:
                          description: |-
                            SubtreePlanned is a core-computed monotonic recursive latch: true once this node and its whole
                            subtree finished planning (barrier 1). Not a capture leg.
                          type: boolean
                      type: object
                    domainSpecificController:
                      description: |-
                        DomainSpecificController holds the domain-written planning refs and lifecycle. Single writer: the
                        domain controller, via the SDK.
                      properties:
                        excludedRefs:
                          description: |-
                            ExcludedRefs are this node's direct exclusion vetoes (state-snapshotter.deckhouse.io/exclude label
                            on a child source object). This PoC controller does not implement the veto label, so it always
                            publishes an empty list here (required by the SDK contract to be present, not omitted).
                          items:
                            description: |-
                              UnifiedSnapshotterChildRef mirrors state-snapshotter's storage/v1alpha1.SnapshotChildRef /
                              ExcludedObjectRef: a reference within the namespace-local snapshot run tree. Namespace is implicit
                              (always the parent snapshot's own namespace) — unlike UnifiedSnapshotterSourceRef, it carries no
                              namespace or UID.
                            properties:
                              apiVersion:
                                description: API version of the referenced object.
                                type: string
                              kind:
                                description: Kind of the referenced object.
                                type: string
                              name:
                                description: Name of the referenced object.
                                type: string
                            required:
                              - apiVersion
                              - kind
                              - name
                            type: object
                          type: array
                        manifestCaptureRequestName:
                          description:
                            ManifestCaptureRequestName is the name of the
                            ManifestCaptureRequest created for this node.
                          type: string
                        message:
                          description:
                            Message is a human-readable progress or failure
                            message.
                          type: string
                        phase:
                          description:
                            Phase is the domain capture phase (SDK barrier
                            1/2 state machine).
                          enum:
                            - Planning
                            - Planned
                            - Finished
                            - Failed
                          type: string
                        reason:
                          description:
                            Reason is the machine-readable failure reason,
                            set only when Phase is Failed.
                          type: string
                        volumeCaptureRequestName:
                          description: |-
                            VolumeCaptureRequestName is the name of the VolumeCaptureRequest created for this node's single
                            data leg. Populated only on VirtualDiskSnapshot; always empty on VirtualMachineSnapshot, which
                            carries no data leg of its own.
                          type: string
                      required:
                        - excludedRefs
                      type: object
                  type: object
                childrenSnapshotRefs:
                  description: |-
                    ChildrenSnapshotRefs is the set of child snapshot nodes declared via the SDK's EnsureChildren
                    (this VirtualMachineSnapshot's VirtualDiskSnapshot children). Frozen once CaptureState reaches
                    the Planned phase.
                  items:
                    description: |-
                      UnifiedSnapshotterChildRef mirrors state-snapshotter's storage/v1alpha1.SnapshotChildRef /
                      ExcludedObjectRef: a reference within the namespace-local snapshot run tree. Namespace is implicit
                      (always the parent snapshot's own namespace) — unlike UnifiedSnapshotterSourceRef, it carries no
                      namespace or UID.
                    properties:
                      apiVersion:
                        description: API version of the referenced object.
                        type: string
                      kind:
                        description: Kind of the referenced object.
                        type: string
                      name:
                        description: Name of the referenced object.
                        type: string
                    required:
                      - apiVersion
                      - kind
                      - name
                    type: object
                  type: array
                conditions:
                  description:
                    The latest detailed observations of the VirtualMachineSnapshot
                    resource.
                  items:
                    description:
                      Condition contains details for one aspect of the current
                      state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                consistent:
                  description: Whether a virtual machine snapshot is consistent.
                  type: boolean
                excludedRefs:
                  description: |-
                    ExcludedRefs is the top-level mirror of the bound SnapshotContent's durable excludedRefs aggregate
                    (source objects vetoed out of this node's subtree). Written only by the core; this PoC controller
                    does not implement the veto label, so it is normally empty.
                  items:
                    description: |-
                      UnifiedSnapshotterChildRef mirrors state-snapshotter's storage/v1alpha1.SnapshotChildRef /
                      ExcludedObjectRef: a reference within the namespace-local snapshot run tree. Namespace is implicit
                      (always the parent snapshot's own namespace) — unlike UnifiedSnapshotterSourceRef, it carries no
                      namespace or UID.
                    properties:
                      apiVersion:
                        description: API version of the referenced object.
                        type: string
                      kind:
                        description: Kind of the referenced object.
                        type: string
                      name:
                        description: Name of the referenced object.
                        type: string
                    required:
                      - apiVersion
                      - kind
                      - name
                    type: object
                  type: array
                observedGeneration:
                  description: Resource generation last processed by the controller.
                  format: int64
                  type: integer
                phase:
                  description: |-
                    VirtualMachineSnapshotPhase defines the current status of a resource:

                    * `Pending`: The resource has been created and is on a waiting queue.
                    * `InProgress`: A virtual machine snapshot is being created.
                    * `Ready`: A snapshot has been created successfully, and now it's available to use.
                    * `Failed`: An error occurred when creating a virtual machine snapshot.
                    * `Terminating`: The resource is being deleted.
                  enum:
                    - Pending
                    - InProgress
                    - Ready
                    - Failed
                    - Terminating
                  type: string
                resources:
                  description: List of snapshot resources.
                  items:
                    properties:
                      apiVersion:
                        description: API version of the resource.
                        type: string
                      kind:
                        description: Kind of the resource.
                        type: string
                      name:
                        description: Name of the resource.
                        type: string
                    type: object
                  type: array
                sourceRef:
                  description: |-
                    SourceRef is the full identity of the live source object this node captured (Capture mode only),
                    published via the SDK's PublishSnapshotSource for later use by import/restore tooling.
                  properties:
                    apiVersion:
                      description: API version of the referenced object.
                      type: string
                    kind:
                      description: Kind of the referenced object.
                      type: string
                    name:
                      description: Name of the referenced object.
                      type: string
                    namespace:
                      description: Namespace of the referenced object, if namespaced.
                      type: string
                    uid:
                      description:
                        UID of the referenced object at the time this reference
                        was published.
                      type: string
                  required:
                    - apiVersion
                    - kind
                    - name
                  type: object
                virtualDiskSnapshotNames:
                  description:
                    List of VirtualDiskSnapshot names for the snapshots taken
                    from the virtual disks of the associated virtual machine.
                  items:
                    type: string
                  type: array
                virtualMachineSnapshotSecretName:
                  description:
                    Name of the underlying `Secret` created for virtual machine
                    snapshotting.
                  type: string
              required:
                - phase
              type: object
          required:
            - spec
          type: object
          x-doc-examples:
            - apiVersion: virtualization.deckhouse.io/v1alpha2
              kind: VirtualMachineSnapshot
              metadata:
                name: example-vm-snapshot
              spec:
                keepIPAddress: Never
                requiredConsistency: true
                virtualMachineName: example-vm
      served: true
      storage: true
      subresources:
        status: {}
