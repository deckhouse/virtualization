spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            Заявка на приём живой миграции виртуальной машины с другой площадки. Создаёт её только исходная площадка, в пространстве имён сопряжённого проекта и с именем виртуальной машины. По заявке этот кластер создаёт виртуальную машину, её диски и IP-адрес. UID заявки идентифицирует миграцию в обоих кластерах.
          properties:
            spec:
              properties:
                sourcePeer:
                  description: |
                    Имя ресурса ClusterPeer, который обозначает исходную площадку в принимающем кластере. Вебхук задаёт его по аутентифицированным данным исходной площадки.
                sourceSynchronization:
                  description: |
                    Параметры подключения к контроллеру синхронизации исходной площадки. Могут измениться после его перезапуска.
                  properties:
                    syncAddress:
                      description: |
                        Адрес контроллера синхронизации с портом.
                    syncPin:
                      description: |
                        Отпечаток SHA-256 открытого ключа, который контроллер синхронизации создал для этой миграции.
                ipAddress:
                  description: |
                    IP-адрес виртуальной машины в основной сети. Виртуальная машина сохраняет его в этом кластере.
                internalVirtualizationVirtualMachineInstance:
                  description: |
                    Экземпляр виртуальной машины KubeVirt исходной площадки, его спецификация и статус. Принимающая виртуальная машина работает с его доменом, а диски этого кластера сверяются с размером его блочных устройств.
                virtualDiskTemplates:
                  description: |
                    Диски VirtualDisk виртуальной машины в порядке её блочных устройств: имена, лейблы, аннотации, StorageClass и размер. Этот кластер создаёт диски пустыми, и они принимают данные.
                virtualMachineTemplate:
                  description: |
                    Виртуальная машина VirtualMachine исходной площадки: её лейблы, аннотации и спецификация, с которой она работает.
            status:
              properties:
                message:
                  description: |
                    Сообщение для пользователя исходной площадки: почему приём не удался или что его задерживает.
                phase:
                  description: |
                    Фаза приёма:

                    * `Pending` — этот кластер готовит виртуальную машину, её диски и IP-адрес;
                    * `Ready` — принимающая миграция создана, исходная площадка может начинать свою миграцию;
                    * `Running` — виртуальная машина работает в этом кластере как обычная, исходная площадка может удалить свою копию;
                    * `Failed` — этот кластер не принимает виртуальную машину, причина указана в поле `reason`.
                reason:
                  description: |
                    Причина неудачного приёма.
                receiverStarted:
                  description: |
                    Запускалась ли принятая виртуальная машина в этом кластере. После неудачи исходная площадка узнаёт по этому полю, может ли гостевая ОС работать здесь.
                synchronization:
                  description: |
                    Параметры подключения к контроллеру синхронизации этого кластера. Исходная площадка читает их для своей миграции.
                  properties:
                    syncAddress:
                      description: |
                        Адрес контроллера синхронизации с портом.
                    syncPin:
                      description: |
                        Отпечаток SHA-256 открытого ключа, который контроллер синхронизации создал для этой миграции.
                finishedAt:
                  description: |
                    Время перехода приёма в фазу `Running` или `Failed`. От него отсчитывается срок жизни заявки. При последующем переходе из `Failed` в `Running` время записывается заново.
                internalVirtualMachineUID:
                  description: |
                    UID виртуальной машины KubeVirt, которую этот кластер создал по заявке.
                virtualDiskUIDs:
                  description: |
                    UID виртуальных дисков, которые этот кластер создал по заявке, по имени диска.
                virtualMachineUID:
                  description: |
                    UID виртуальной машины, которую этот кластер создал по заявке.
