spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            Заявка на приём живой миграции виртуальной машины из кластера-пира. Создаёт её только пир, в пространстве имён сопряжённого проекта и с именем виртуальной машины. По заявке этот кластер создаёт виртуальную машину, её диски и адрес; UID заявки — идентификатор миграции с обеих сторон.
          properties:
            spec:
              properties:
                ipAddress:
                  description: |
                    Адрес основной сети: виртуальная машина сохраняет его в этом кластере.
                internalVirtualizationVirtualMachineInstance:
                  description: |
                    KubeVirt VMI источника, спецификация и статус: виртуальная машина-приёмник работает с его доменом, а диски этого кластера сверяются с размером его блочных устройств.
                virtualDiskTemplates:
                  description: |
                    VirtualDisk виртуальной машины в порядке её блочных устройств: имена, метки, аннотации, StorageClass и размер. Диски здесь создаются пустыми и принимают данные.
                virtualMachineTemplate:
                  description: |
                    VirtualMachine источника: метки, аннотации и спецификация, с которой она работает.
            status:
              properties:
                message:
                  description: |
                    Сообщение для пользователя кластера-источника.
                phase:
                  description: |
                    Ход приёма:

                    - `Pending` — кластер готовит виртуальную машину, её диски и адрес;
                    - `Ready` — миграция на приём создана, источник может начинать миграцию;
                    - `Running` — виртуальная машина работает в этом кластере как обычная, источник может удалить свою;
                    - `Failed` — кластер не принимает виртуальную машину, причина — в `reason`.
                reason:
                  description: |
                    Причина отказа.
                receiverStarted:
                  description: |
                    Запускалась ли виртуальная машина-приёмник в этом кластере: после отказа источник узнаёт, мог ли гость работать здесь.
                synchronizationAddress:
                  description: |
                    Адрес sync-контроллера KubeVirt этого кластера, к которому подключается миграция из источника.
                syncPin:
                  description: |
                    Пин (sha256 открытого ключа) ключа, который sync-контроллер этого кластера сгенерировал для этой миграции: источник передаёт его своей миграции, и миграции доверяют друг другу по пинам.
