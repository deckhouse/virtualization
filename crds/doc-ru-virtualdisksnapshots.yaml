spec:
  versions:
    - name: v1alpha2
      schema:
        openAPIV3Schema:
          description: |
            Предоставляет ресурс для создания снимков существующих виртуальных дисков, которые могут быть использованы в качестве источников данных для создания новых виртуальных дисков.

            В процессе выполнения автоматически создаётся ресурс VolumeSnapshot.
          properties:
            spec:
              properties:
                virtualDiskName:
                  description: |
                    Имя виртуального диска, для которого будет создан снимок.
                requiredConsistency:
                  description: |
                    Создавать снимок диска подключённой виртуальной машины только в том случае, если возможно заморозить её через агента.

                    Если установлено значение `True`, снимок виртуального диска будет создан, если выполняется хотя бы одно из следующих условий:
                    - виртуальный диск не подключен ни к одной виртуальной машине;
                    - виртуальный диск подключен к виртуальной машине, которая выключена;
                    - виртуальный диск подключен к виртуальной машине с агентом, и операция заморозки прошла успешно.
            status:
              properties:
                conditions:
                  description: |
                    Последнее подтверждённое состояние данного ресурса.
                  items:
                    description: |
                      Подробные сведения об одном аспекте текущего состояния данного API-ресурса.
                    properties:
                      lastTransitionTime:
                        description: Время перехода условия из одного состояния в другое.
                      message:
                        description: Удобочитаемое сообщение с подробной информацией о последнем переходе.
                      observedGeneration:
                        description: |
                          `.metadata.generation`, на основе которого было установлено условие.
                          Например, если `.metadata.generation` в настоящее время имеет значение `12`, а `.status.conditions[x].observedgeneration` имеет значение `9`, то условие устарело.
                      reason:
                        description: Краткая причина последнего перехода состояния.
                      status:
                        description: |
                          Статус условия. Возможные значения: `True`, `False`, `Unknown`.
                      type:
                        description: Тип условия.
                volumeSnapshotName:
                  description: |
                    Имя созданного ресурса VolumeSnapshot.
                consistent:
                  description: |
                    Снимок виртуального диска консистентен.
                phase:
                  description: |
                    Текущее состояние ресурса VirtualDiskSnapshot:

                    * `Pending` — ресурс был создан и находится в очереди ожидания;
                    * `InProgress` — идёт процесс создания снимка виртуального диска;
                    * `Ready` — создание снимка успешно завершено, и снимок виртуального диска доступен для использования;
                    * `Failed` — во время создания снимка виртуального диска произошла ошибка;
                    * `Terminating` — ресурс находится в процессе удаления.
                observedGeneration:
                  description: |
                    Поколение ресурса, которое в последний раз обрабатывалось контроллером.
                boundSnapshotContentName:
                  description: |
                    Имя кластерного ресурса SnapshotContent, привязанного к данному узлу дерева снимков.
                    Устанавливается связывателем (binder) ядра state-snapshotter; со стороны доменного контроллера доступно только для чтения.
                captureState:
                  description: |
                    Состояние машины состояний SDK для данного узла: фаза барьеров 1/2, имена запросов на захват, защёлки успешного захвата, устанавливаемые ядром.
                  properties:
                    commonController:
                      description: |
                        Защёлки успешного захвата, которые устанавливает ядро. Единственный источник записи — ядро.
                      properties:
                        childrenSettled:
                          description: |
                            Вычисляемая ядром защёлка «все непосредственные дочерние узлы перешли в терминальное состояние (успешно захвачены или завершились с ошибкой)». Не является составляющей захвата и не участвует в собственных AllLegsCaptured/CoreCaptureOutcome данного узла — это сигнал полноты, который читает доменный контроллер, чтобы выполнить на барьере 2 действие по обеспечению консистентности (например, разморозку файловой системы), обязанное сработать, даже если захват какого-то дочернего узла завершился ошибкой. Значение `nil` означает отсутствие непосредственных дочерних узлов (лист) либо то, что значение ещё не вычислено; `true` устанавливается, как только все непосредственные дочерние узлы перешли в терминальное состояние.
                        dataCaptured:
                          description: |
                            Защёлка успешного захвата составляющей данных, устанавливаемая ядром; семантика значений `nil`/`false`/`true` такая же, как у `manifestCaptured`. Для VirtualMachineSnapshot всегда равна `nil`.
                        manifestCaptured:
                          description: |
                            Защёлка успешного захвата составляющей манифеста, устанавливаемая ядром. Значение `nil` означает, что эта составляющая ещё не объявлена; `false` — объявлена, но ещё не захвачена; `true` — захвачена окончательно.
                        childSubtreesManifestsPersisted:
                          description: |
                            Вычисляемая ядром защёлка «поддеревья ВСЕХ объявленных непосредственных дочерних узлов сохранили свои манифесты». Не является составляющей захвата: она покрывает только дочерние узлы, поэтому утверждение «узел сохранён целиком» раскладывается как `manifestCaptured` && `childSubtreesManifestsPersisted`.
                        subtreePlanned:
                          description: |
                            Вычисляемая ядром монотонная рекурсивная защёлка: принимает значение `true`, когда планирование (барьер 1) для данного узла и всего его поддерева завершено. Не является составляющей захвата.
                    domainSpecificController:
                      description: |
                        Ссылки на планирование и сведения о жизненном цикле, которые устанавливает доменный контроллер через SDK. Единственный источник записи — доменный контроллер.
                      properties:
                        excludedRefs:
                          description: |
                            Прямые исключения (veto) данного узла — источники, помеченные меткой `state-snapshotter.deckhouse.io/exclude`. Текущая реализация контроллера не поддерживает эту метку, поэтому здесь всегда публикуется пустой список: контракт SDK требует, чтобы поле присутствовало, а не отсутствовало.
                          items:
                            description: |
                              Ссылка на объект в пределах дерева снимков текущего пространства имён. Пространство имён неявное — всегда совпадает с пространством имён родительского снимка.
                            properties:
                              apiVersion:
                                description: Версия API объекта, на который указывает ссылка.
                              kind:
                                description: Kind объекта, на который указывает ссылка.
                              name:
                                description: Имя объекта, на который указывает ссылка.
                        manifestCaptureRequestName:
                          description: |
                            Имя ресурса ManifestCaptureRequest, созданного для данного узла.
                        message:
                          description: |
                            Человекочитаемое сообщение о ходе выполнения или об ошибке.
                        phase:
                          description: |
                            Фаза захвата на стороне домена (состояние машины состояний барьеров 1/2 SDK).
                        reason:
                          description: |
                            Машиночитаемая причина ошибки; устанавливается, только если Phase имеет значение `Failed`.
                        volumeCaptureRequestName:
                          description: |
                            Имя ресурса VolumeCaptureRequest, созданного для единственной составляющей данных этого узла. Заполняется только для VirtualDiskSnapshot; для VirtualMachineSnapshot, у которого нет собственной составляющей данных, всегда пусто.
                childrenSnapshotRefs:
                  description: |
                    Всегда пусто для этого листового узла, несущего данные; поле сохранено ради единообразия между видами снимков (повторяет реализацию домена ссылок в самом state-snapshotter).
                  items:
                    description: |
                      Ссылка на объект в пределах дерева снимков текущего пространства имён. Пространство имён неявное — всегда совпадает с пространством имён родительского снимка.
                    properties:
                      apiVersion:
                        description: Версия API объекта, на который указывает ссылка.
                      kind:
                        description: Kind объекта, на который указывает ссылка.
                      name:
                        description: Имя объекта, на который указывает ссылка.
                excludedRefs:
                  description: |
                    Отражение на верхнем уровне устойчивого агрегата excludedRefs связанного ресурса SnapshotContent. Устанавливается только ядром; у листового узла, несущего данные, нет дочерних узлов, поэтому обычно это поле пусто.
                  items:
                    description: |
                      Ссылка на объект в пределах дерева снимков текущего пространства имён. Пространство имён неявное — всегда совпадает с пространством имён родительского снимка.
                    properties:
                      apiVersion:
                        description: Версия API объекта, на который указывает ссылка.
                      kind:
                        description: Kind объекта, на который указывает ссылка.
                      name:
                        description: Имя объекта, на который указывает ссылка.
                sourceRef:
                  description: |
                    Полная идентификация исходного объекта, с которого выполнен захват данного узла (только в режиме Capture). Публикуется через PublishSnapshotSource SDK для последующего использования инструментами импорта и восстановления.
                  properties:
                    apiVersion:
                      description: Версия API объекта, на который указывает ссылка.
                    kind:
                      description: Kind объекта, на который указывает ссылка.
                    name:
                      description: Имя объекта, на который указывает ссылка.
                    namespace:
                      description: Пространство имён объекта, на который указывает ссылка, если объект относится к пространству имён.
                    uid:
                      description: UID объекта, на который указывает ссылка, на момент публикации этой ссылки.
                data:
                  description: |
                    Долговременная привязка данных захваченного тома, которую ядро state-snapshotter дословно переносит сюда из связанного ресурса SnapshotContent после того, как составляющая данных захвачена. При создании VirtualDisk восстановление выполняется из `data.artifactRef` (через VolumeRestoreRequest storage-foundation), а не клонированием обычного пространственного ресурса CSI VolumeSnapshot, на который указывает `volumeSnapshotName`: захваченный через SDK артефакт — это VolumeSnapshotContent, к которому external-snapshotter отказывается привязывать новый VolumeSnapshot.
                  properties:
                    sourceRef:
                      description: |
                        Ссылка на захваченный ресурс PersistentVolumeClaim, лежащий в основе данных этого узла. Отличается от `status.sourceRef` верхнего уровня, который ссылается на захваченный живой доменный объект.
                      properties:
                        apiVersion:
                          description: Версия API объекта, на который указывает ссылка.
                        kind:
                          description: Kind объекта, на который указывает ссылка.
                        name:
                          description: Имя объекта, на который указывает ссылка.
                        namespace:
                          description: Пространство имён объекта, на который указывает ссылка, если объект пространственный.
                        uid:
                          description: UID объекта на момент публикации ссылки.
                    artifactRef:
                      description: |
                        Ссылка на кластерный долговременный артефакт данных, лежащий в основе захваченных данных.
                      properties:
                        apiVersion:
                          description: Версия API артефакта, на который указывает ссылка.
                        kind:
                          description: Kind артефакта, на который указывает ссылка.
                        name:
                          description: Имя артефакта, на который указывает ссылка.
                        uid:
                          description: |
                            Заполняется по мере возможности: артефакт может быть указан раньше, чем становится известен его UID.
                    volumeMode:
                      description: |
                        Режим исходного тома (`Block` или `Filesystem`). Снимки CSI не зависят от режима, поэтому он сохраняется здесь, чтобы воссоздать PersistentVolumeClaim при восстановлении.
                    fsType:
                      description: |
                        Тип файловой системы источника (только для томов в режиме `Filesystem`).
                    accessModes:
                      description: |
                        Режимы доступа исходного ресурса PersistentVolumeClaim.
                    storageClassName:
                      description: |
                        Класс хранилища исходного захваченного тома.
                    size:
                      description: |
                        Реальный выделенный размер захваченного тома, взятый из `restoreSize` артефакта данных. Хранится строкой в формате resource.Quantity (например, `10Gi`).
                storageClassName:
                  description: |
                    Отражает класс хранения захваченного диска на момент создания снимка. Используется как класс хранения по умолчанию при клонировании нового VirtualDisk из этого снимка, если вызывающая сторона не указала его явно.
                persistentVolumeClaimSize:
                  description: |
                    Отражает запрошенный размер PVC захваченного диска (строка resource.Quantity) на момент создания снимка. Используется как размер по умолчанию при клонировании нового VirtualDisk из этого снимка, если вызывающая сторона не указала его явно.
