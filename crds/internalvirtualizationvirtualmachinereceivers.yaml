---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  labels:
    heritage: deckhouse
    module: virtualization
  name: internalvirtualizationvirtualmachinereceivers.internal.virtualization.deckhouse.io
spec:
  group: internal.virtualization.deckhouse.io
  names:
    categories:
      - intvirt
    kind: InternalVirtualizationVirtualMachineReceiver
    listKind: InternalVirtualizationVirtualMachineReceiverList
    plural: internalvirtualizationvirtualmachinereceivers
    shortNames:
      - intvirtvmr
    singular: internalvirtualizationvirtualmachinereceiver
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.reason
          name: Reason
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            InternalVirtualizationVirtualMachineReceiver asks this cluster to receive a live migration of a virtual machine from a
            peer cluster. Only the peer creates it, in the namespace of the paired project and with the
            name of the virtual machine. This cluster creates the virtual machine, its disks and its address from it,
            and the UID of the request identifies the migration on both sides.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              properties:
                internalVirtualizationVirtualMachineInstance:
                  description: |-
                    The KubeVirt virtual machine instance of the source, spec and status: the receiving virtual machine
                    runs its domain, and the disks here are checked against the size of its block devices.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                ipAddress:
                  description:
                    "Address of the main network: the virtual machine keeps
                    it in this cluster."
                  minLength: 1
                  type: string
                virtualDiskTemplates:
                  description: |-
                    The VirtualDisks of the virtual machine in the order of its block devices: their names, labels,
                    annotations, StorageClass and size. The disks here are created blank and receive the data.
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  type: array
                virtualMachineTemplate:
                  description:
                    "The VirtualMachine of the source: its labels and annotations
                    and the spec it runs with."
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              required:
                - internalVirtualizationVirtualMachineInstance
                - ipAddress
                - virtualMachineTemplate
              type: object
              x-kubernetes-validations:
                - message: the spec is immutable
                  rule: self == oldSelf
            status:
              properties:
                message:
                  description: Message for the user of the source cluster.
                  type: string
                observedGeneration:
                  format: int64
                  type: integer
                phase:
                  description: VirtualMachineReceiverPhase is the progress of the receive.
                  enum:
                    - Pending
                    - Ready
                    - Running
                    - Failed
                  type: string
                reason:
                  description: Why the receive failed.
                  type: string
                receiverStarted:
                  description: |-
                    Whether the receiving virtual machine has run in this cluster: after a failure the source learns
                    whether the guest may run here.
                  type: boolean
                syncPin:
                  description: |-
                    The pin (sha256 of the public key) of the key the synchronization controller of this cluster generated
                    for this migration: the source gives it to its migration, and the migrations trust each other by the pins.
                  type: string
                synchronizationAddress:
                  description: |-
                    Where the synchronization controller of this cluster listens: the address the migration from the
                    source connects to.
                  type: string
              type: object
          required:
            - spec
          type: object
          x-doc-examples:
            - apiVersion: internal.virtualization.deckhouse.io/v1alpha1
              kind: InternalVirtualizationVirtualMachineReceiver
              metadata:
                name: example
              spec:
                ipAddress: string
      served: true
      storage: true
      subresources:
        status: {}
