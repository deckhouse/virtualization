spec:
  versions:
    - name: v1alpha2
      schema:
        openAPIV3Schema:
          description: |-
            VirtualMachineSnapshot предоставляет ресурс для создания снимков виртуальных машин.
          properties:
            spec:
              properties:
                keepIPAddress:
                  description: |-
                    Сохранить IP-адрес виртуальной машины или нет:

                    * `Always` - при создании снимка IP-адрес виртуальной машины будет сконвертирован из `Auto` в `Static` и сохранён;
                    * `Never` - при создании снимка IP-адрес виртуальной машины не будет сконвертирован.
                requiredConsistency:
                  description: |-
                    Создавать снимок виртуальной машины только в том случае, если возможно заморозить её через агента.

                    Если установлено значение `true`, снимок виртуальной машины будет создан только в следующих случаях:

                    - виртуальная машина выключена;
                    - виртуальная машина с агентом, операция заморозки прошла успешно.
                virtualMachineName:
                  description: Имя виртуальной машины для создания снимка.
            status:
              properties:
                boundSnapshotContentName:
                  description: |
                    Имя кластерного ресурса SnapshotContent, привязанного к данному узлу дерева снимков.
                    Устанавливается связывателем (binder) ядра state-snapshotter; со стороны доменного контроллера доступно только для чтения.
                captureState:
                  description: |
                    Состояние машины состояний SDK для данного узла: фаза барьеров 1/2, имена запросов на захват, защёлки успешного захвата, устанавливаемые ядром.
                  properties:
                    commonController:
                      description: |
                        Защёлки успешного захвата, которые устанавливает ядро. Единственный источник записи — ядро.
                      properties:
                        childrenSettled:
                          description: |
                            Вычисляемая ядром защёлка «все непосредственные дочерние узлы перешли в терминальное состояние (успешно захвачены или завершились с ошибкой)». Не является составляющей захвата и не участвует в собственных AllLegsCaptured/CoreCaptureOutcome данного узла — это сигнал полноты, который читает доменный контроллер, чтобы выполнить на барьере 2 действие по обеспечению консистентности (например, разморозку файловой системы), обязанное сработать, даже если захват какого-то дочернего узла завершился ошибкой. Значение `nil` означает отсутствие непосредственных дочерних узлов (лист) либо то, что значение ещё не вычислено; `true` устанавливается, как только все непосредственные дочерние узлы перешли в терминальное состояние.
                        dataCaptured:
                          description: |
                            Защёлка успешного захвата составляющей данных, устанавливаемая ядром; семантика значений `nil`/`false`/`true` такая же, как у `manifestCaptured`. Для VirtualMachineSnapshot всегда равна `nil`.
                        manifestCaptured:
                          description: |
                            Защёлка успешного захвата составляющей манифеста, устанавливаемая ядром. Значение `nil` означает, что эта составляющая ещё не объявлена; `false` — объявлена, но ещё не захвачена; `true` — захвачена окончательно.
                        childSubtreesManifestsPersisted:
                          description: |
                            Вычисляемая ядром защёлка «поддеревья ВСЕХ объявленных непосредственных дочерних узлов сохранили свои манифесты». Не является составляющей захвата: она покрывает только дочерние узлы, поэтому утверждение «узел сохранён целиком» раскладывается как `manifestCaptured` && `childSubtreesManifestsPersisted`.
                        subtreePlanned:
                          description: |
                            Вычисляемая ядром монотонная рекурсивная защёлка: принимает значение `true`, когда планирование (барьер 1) для данного узла и всего его поддерева завершено. Не является составляющей захвата.
                    domainSpecificController:
                      description: |
                        Ссылки на планирование и сведения о жизненном цикле, которые устанавливает доменный контроллер через SDK. Единственный источник записи — доменный контроллер.
                      properties:
                        excludedRefs:
                          description: |
                            Прямые исключения (veto) данного узла — источники, помеченные меткой `state-snapshotter.deckhouse.io/exclude`. Текущая реализация контроллера не поддерживает эту метку, поэтому здесь всегда публикуется пустой список: контракт SDK требует, чтобы поле присутствовало, а не отсутствовало.
                          items:
                            description: |
                              Ссылка на объект в пределах дерева снимков текущего пространства имён. Пространство имён неявное — всегда совпадает с пространством имён родительского снимка.
                            properties:
                              apiVersion:
                                description: Версия API объекта, на который указывает ссылка.
                              kind:
                                description: Kind объекта, на который указывает ссылка.
                              name:
                                description: Имя объекта, на который указывает ссылка.
                        manifestCaptureRequestName:
                          description: |
                            Имя ресурса ManifestCaptureRequest, созданного для данного узла.
                        message:
                          description: |
                            Человекочитаемое сообщение о ходе выполнения или об ошибке.
                        phase:
                          description: |
                            Фаза захвата на стороне домена (состояние машины состояний барьеров 1/2 SDK).
                        reason:
                          description: |
                            Машиночитаемая причина ошибки; устанавливается, только если Phase имеет значение `Failed`.
                        volumeCaptureRequestName:
                          description: |
                            Имя ресурса VolumeCaptureRequest, созданного для единственной составляющей данных этого узла. Заполняется только для VirtualDiskSnapshot; для VirtualMachineSnapshot, у которого нет собственной составляющей данных, всегда пусто.
                childrenSnapshotRefs:
                  description: |
                    Набор дочерних узлов снимка, объявленных через EnsureChildren SDK (дочерние VirtualDiskSnapshot этого VirtualMachineSnapshot). Фиксируется, как только CaptureState переходит в фазу `Planned`.
                  items:
                    description: |
                      Ссылка на объект в пределах дерева снимков текущего пространства имён. Пространство имён неявное — всегда совпадает с пространством имён родительского снимка.
                    properties:
                      apiVersion:
                        description: Версия API объекта, на который указывает ссылка.
                      kind:
                        description: Kind объекта, на который указывает ссылка.
                      name:
                        description: Имя объекта, на который указывает ссылка.
                conditions:
                  description: |
                    Последнее подтверждённое состояние данного ресурса.
                  items:
                    description: |
                      Подробные сведения об одном аспекте текущего состояния данного API-ресурса.
                    properties:
                      lastTransitionTime:
                        description: Время перехода условия из одного состояния в другое.
                      message:
                        description: Удобочитаемое сообщение с подробной информацией о последнем переходе.
                      observedGeneration:
                        description: |
                          `.metadata.generation`, на основе которого было установлено условие.
                          Например, если `.metadata.generation` в настоящее время имеет значение `12`, а `.status.conditions[x].observedgeneration` имеет значение `9`, то условие устарело.
                      reason:
                        description: Краткая причина последнего перехода состояния.
                      status:
                        description: |
                          Статус условия. Возможные значения: `True`, `False`, `Unknown`.
                      type:
                        description: Тип условия.
                consistent:
                  description: Снимок виртуальной машины консистентен.
                excludedRefs:
                  description: |
                    Отражение на верхнем уровне устойчивого агрегата excludedRefs связанного ресурса SnapshotContent — источников, исключённых из поддерева данного узла. Устанавливается только ядром; текущая реализация контроллера не поддерживает метку исключения, поэтому обычно это поле пусто.
                  items:
                    description: |
                      Ссылка на объект в пределах дерева снимков текущего пространства имён. Пространство имён неявное — всегда совпадает с пространством имён родительского снимка.
                    properties:
                      apiVersion:
                        description: Версия API объекта, на который указывает ссылка.
                      kind:
                        description: Kind объекта, на который указывает ссылка.
                      name:
                        description: Имя объекта, на который указывает ссылка.
                observedGeneration:
                  description: Поколение ресурса, которое в последний раз обрабатывалось контроллером.
                phase:
                  description: |-
                    Текущее состояние ресурса VirtualMachineSnapshot:

                    * `Pending` — ресурс был создан и находится в очереди ожидания;
                    * `InProgress` — идёт процесс создания снимка виртуальной машины;
                    * `Ready` — создание снимка успешно завершено, и он доступен для использования;
                    * `Failed` — во время создания снимка виртуальной машины произошла ошибка;
                    * `Terminating` — ресурс находится в процессе удаления.
                resources:
                  description: Список ресурсов снимка.
                sourceRef:
                  description: |
                    Полная идентификация исходного объекта, с которого выполнен захват данного узла (только в режиме Capture). Публикуется через PublishSnapshotSource SDK для последующего использования инструментами импорта и восстановления.
                  properties:
                    apiVersion:
                      description: Версия API объекта, на который указывает ссылка.
                    kind:
                      description: Kind объекта, на который указывает ссылка.
                    name:
                      description: Имя объекта, на который указывает ссылка.
                    namespace:
                      description: Пространство имён объекта, на который указывает ссылка, если объект относится к пространству имён.
                    uid:
                      description: UID объекта, на который указывает ссылка, на момент публикации этой ссылки.
                virtualDiskSnapshotNames:
                  description: Имена созданных снимков виртуальных дисков.
                virtualMachineSnapshotSecretName:
                  description: Имя созданного секрета с информацией о снимке виртуальной машины.
