version: "3"

silent: true

vars:
  VERSION: "v1.0.0"

tasks:
  kubectl:
    cmds:
      - |
        if ! which kubectl >/dev/null ; then
          echo "kubectl not found or not in PATH"
          exit 1
        fi

  d8:
    cmds:
      - |
        if ! which d8 >/dev/null ; then
          echo "d8 not found or not in PATH. Install from https://github.com/deckhouse/deckhouse-cli/releases"
          exit 1
        fi

  precheck:prepare:
    desc: "Generate JSON report via ginkgo dry-run for precheck preparation"
    cmds:
      - |
        # Run ginkgo dry-run with same filters as run task to collect only filtered specs
        # Prechecks are executed in e2e_test.go SynchronizedBeforeSuite based on labels from this report
        ./scripts/precheck-prepare.sh

  run:
    desc: "Run e2e tests in parallel (SEQUENTIAL=true for sequential mode, PROCS to override --procs)"
    deps:
      - kubectl
      - d8
      - precheck:prepare
    vars:
      SEQUENTIAL: '{{.SEQUENTIAL | default "false"}}'
      PROCS: '{{.PROCS | default "24"}}'
    cmds:
      - |
        {{if .STORAGE_CLASS_NAME -}}STORAGE_CLASS_NAME="{{.STORAGE_CLASS_NAME}}" {{end -}}go tool ginkgo -v \
          {{if ne .SEQUENTIAL "true" -}}
          -p --procs={{.PROCS}} \
          {{end -}}
          --grace-period=1m \
          --output-interceptor-mode=none \
          {{if and (eq .SEQUENTIAL "true") (not .FOCUS) -}}
          --label-filter="!Slow" \
          {{end -}}
          {{if .LABELS -}}
          --label-filter="{{ .LABELS }}" \
          {{end -}}
          {{if .JSON_REPORT -}}
          --json-report={{ .JSON_REPORT }} \
          {{end -}}
          {{if .TIMEOUT -}}
          --timeout={{ .TIMEOUT }} \
          {{else if eq .SEQUENTIAL "true" -}}
          --timeout=3h \
          {{else -}}
          --timeout=1h \
          {{end -}}
          {{if .FOCUS -}}
          --focus "{{ .FOCUS }}" \
          {{end -}}
          {{if .DRY -}}
          --dry-run \
          {{end -}}
          {{if .REPEAT -}}
          --repeat "{{ .REPEAT }}"
          {{end -}}

  run:upgrade:
    desc: "Run the module upgrade suite for one phase: UPGRADE_PHASE=pre-upgrade|post-upgrade task run:upgrade (STORAGE_CLASS_NAME and LOCAL_STORAGE_CLASS_NAME are required)"
    deps:
      - kubectl
      - d8
    vars:
      PROCS: '{{.PROCS | default "8"}}'
    preconditions:
      - sh: '[ "{{.UPGRADE_PHASE}}" = "pre-upgrade" ] || [ "{{.UPGRADE_PHASE}}" = "post-upgrade" ]'
        msg: "UPGRADE_PHASE must be pre-upgrade or post-upgrade"
      - sh: '[ -n "{{.STORAGE_CLASS_NAME}}" ] && [ -n "{{.LOCAL_STORAGE_CLASS_NAME}}" ]'
        msg: "STORAGE_CLASS_NAME (replicated) and LOCAL_STORAGE_CLASS_NAME (node-local) must both be set"
    cmds:
      - |
        # The "upgrade" tag selects release_test.go instead of e2e_test.go.
        UPGRADE_PHASE="{{.UPGRADE_PHASE}}" \
        STORAGE_CLASS_NAME="{{.STORAGE_CLASS_NAME}}" \
        LOCAL_STORAGE_CLASS_NAME="{{.LOCAL_STORAGE_CLASS_NAME}}" \
        {{if .UPGRADE_MIGRATES_VMS -}}UPGRADE_MIGRATES_VMS="{{.UPGRADE_MIGRATES_VMS}}" {{end -}}go tool ginkgo -v \
          --tags upgrade \
          -p --procs={{.PROCS}} \
          --grace-period=1m \
          --output-interceptor-mode=none \
          {{if .JSON_REPORT -}}
          --json-report={{ .JSON_REPORT }} \
          {{end -}}
          --timeout={{.TIMEOUT | default "45m"}} \
          .

  fzf:
    desc: "Select and run e2e suites with fzf"
    cmds:
      - ./scripts/e2e-fzf {{.CLI_ARGS}}

  runp:
    desc: "DEPRECATED: alias for 'task run' (which is parallel by default now)"
    cmds:
      - 'echo "WARNING: ''task runp'' is deprecated, use ''task run'' instead." >&2'
      - task: run

  cleanup:
    desc: "Cleanup namespaces & resources left from e2e tests"
    deps:
      - kubectl
      - d8
    cmds:
      - |
        ./scripts/cleanup.sh

  _ensure:golangci-lint:
    desc: "Ensure golangci-lint v2+ is available"
    internal: true
    cmds:
      - |
        GOLANGCI_LINT_MIN_VERSION="2.0"
        if ! command -v golangci-lint &> /dev/null; then
          echo "Installing golangci-lint..."
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin
        fi
        CURRENT_VERSION=$(golangci-lint --version 2>/dev/null | grep -oP 'version \K[0-9]+\.[0-9]+' || echo "0.0")
        if [ "$(printf '%s\n' "$GOLANGCI_LINT_MIN_VERSION" "$CURRENT_VERSION" | sort -V | head -n1)" != "$GOLANGCI_LINT_MIN_VERSION" ]; then
          echo "Upgrading golangci-lint from $CURRENT_VERSION to $GOLANGCI_LINT_MIN_VERSION+"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin
        fi

  lint:go:
    desc: "Run golangci-lint"
    deps:
      - _ensure:golangci-lint
    cmds:
      - |
        golangci-lint run

  set-url:ci:
    desc: "Change URL for images"
    cmds:
      - find ./ ! -name Taskfile.yaml -type f -exec sed -i 's#https://89d64382-20df-4581-8cc7-80df331f67fa.selstorage.ru#https://e2e-test-images.e2e.virtlab.flant.com#g' {} \;
  set-url:user:
    desc: "Change URL for images"
    cmds:
      - find ./ ! -name Taskfile.yaml -type f -exec sed -i 's#https://e2e-test-images.e2e.virtlab.flant.com#https://89d64382-20df-4581-8cc7-80df331f67fa.selstorage.ru#g' {} \;
