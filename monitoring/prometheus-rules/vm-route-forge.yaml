- name: kubernetes.virtualization.vm_route_forge_state
  rules:
    - alert: D8VirtualizationMachineNetworkingDown
      # The absent() branch covers a deleted DaemonSet: without it the series is gone and
      # `== 0` has nothing to compare. The guard keeps the alert silent when the metrics
      # of every DaemonSet in the namespace are missing — that is a failure of
      # kube-state-metrics, not of this component.
      # The absent() branch only counts when the object existed at some point during the
      # last week: during the very first installation the components created by
      # virt-operator do not exist yet, and a slow rollout must not page anybody.
      expr: |
        (
          max by (namespace, daemonset) (
            kube_daemonset_status_number_available{namespace="d8-virtualization", daemonset="vm-route-forge"}
          ) == 0
          or
          (
            absent(kube_daemonset_status_number_available{namespace="d8-virtualization", daemonset="vm-route-forge"})
            and on()
            count(max_over_time(kube_daemonset_status_number_available{namespace="d8-virtualization", daemonset="vm-route-forge"}[7d])) > 0
          )
        )
        unless on()
        absent(kube_daemonset_status_number_available{namespace="d8-virtualization"})
      for: 10m
      labels:
        severity_level: "4"
        tier: cluster
      annotations:
        plk_protocol_version: "1"
        plk_markup_format: "markdown"
        plk_create_group_if_not_exists__d8_virtualization_health: "D8VirtualizationHealth,tier=~tier,prometheus=deckhouse,kubernetes=~kubernetes"
        plk_grouped_by__d8_virtualization_health: "D8VirtualizationHealth,tier=~tier,prometheus=deckhouse,kubernetes=~kubernetes"
        summary: There is no vm-route-forge on any node.
        description: |
          Not a single vm-route-forge Pod is available in the cluster.

          Impact:
          - Routes to virtual machines are no longer maintained: newly started and migrated virtual machines are unreachable over the network.
          - Virtual machines that keep running on their current nodes retain the routes already configured for them.

          The recommended course of action:
          1. Check the DaemonSet: `d8 k -n d8-virtualization describe daemonset vm-route-forge`
          2. View the status of the Pods: `d8 k -n d8-virtualization describe pod -l app=vm-route-forge`

    - alert: D8VirtualizationNodesWithoutMachineNetworking
      expr: |
        max by (namespace, daemonset) (
          kube_daemonset_status_desired_number_scheduled{namespace="d8-virtualization", daemonset="vm-route-forge"}
          - kube_daemonset_status_number_available{namespace="d8-virtualization", daemonset="vm-route-forge"}
        ) > 0
      # A DaemonSet rolls out one Pod at a time, so on a large cluster a routine update of
      # the module keeps some nodes without vm-route-forge for far longer than 15 minutes.
      # Nothing here has to be handled at night either.
      for: 1h
      labels:
        severity_level: "6"
        tier: cluster
      annotations:
        plk_protocol_version: "1"
        plk_markup_format: "markdown"
        plk_create_group_if_not_exists__d8_virtualization_health: "D8VirtualizationHealth,tier=~tier,prometheus=deckhouse,kubernetes=~kubernetes"
        plk_grouped_by__d8_virtualization_health: "D8VirtualizationHealth,tier=~tier,prometheus=deckhouse,kubernetes=~kubernetes"
        summary: vm-route-forge is missing on some nodes.
        description: |
          vm-route-forge is not available on every node it is scheduled to.

          Impact:
          - Virtual machines started on or migrated to the affected nodes will be unreachable over the network.
          - The rest of the cluster works normally.

          The recommended course of action:
          1. Find the nodes without a running vm-route-forge: `d8 k -n d8-virtualization get pod -l app=vm-route-forge -o wide`
          2. Find the failing Pods and then look into one of them: `d8 k -n d8-virtualization get pod -l app=vm-route-forge --field-selector=status.phase!=Running -o wide`, then `d8 k -n d8-virtualization describe pod <name>`
