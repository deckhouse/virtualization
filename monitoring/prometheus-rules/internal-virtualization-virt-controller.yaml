- name: kubernetes.internal.virtualization.virt_controller_state
  rules:
    - alert: D8VirtualizationMachinesCannotStart
      # The absent() branch covers a Deployment that virt-operator has not created or
      # that was deleted; the guard keeps the alert silent when kube-state-metrics itself
      # stops exporting Deployment metrics for the whole namespace.
      # The absent() branch only counts when the object existed at some point during the
      # last week: during the very first installation the components created by
      # virt-operator do not exist yet, and a slow rollout must not page anybody.
      expr: |
        (
          max by (namespace, deployment) (
            kube_deployment_status_replicas_available{namespace="d8-virtualization", deployment="virt-controller"}
          ) == 0
          or
          (
            absent(kube_deployment_status_replicas_available{namespace="d8-virtualization", deployment="virt-controller"})
            and on()
            count(max_over_time(kube_deployment_status_replicas_available{namespace="d8-virtualization", deployment="virt-controller"}[7d])) > 0
          )
        )
        unless on()
        absent(kube_deployment_status_replicas_available{namespace="d8-virtualization"})
      labels:
        severity_level: "3"
        tier: cluster
      for: 10m
      annotations:
        plk_protocol_version: "1"
        plk_markup_format: "markdown"
        plk_create_group_if_not_exists__d8_internal_virtualization_health: "D8InternalVirtualizationHealth,tier=~tier,prometheus=deckhouse,kubernetes=~kubernetes"
        plk_grouped_by__d8_internal_virtualization_health: "D8InternalVirtualizationHealth,tier=~tier,prometheus=deckhouse,kubernetes=~kubernetes"
        summary: Virtual machines cannot be started or migrated.
        description: |
          The virt-controller component has no available replicas.

          Impact:
          - Virtual machines cannot start: nothing is created to run them on a node, so they stay in `Pending`.
          - Live migrations neither start nor complete, so node drain and cluster updates will stall.
          - Running virtual machines keep working, and console access is not affected.

          The recommended course of action:
          1. Retrieve details of the Deployment: `d8 k -n d8-virtualization describe deploy virt-controller`
          2. View the logs: `d8 k -n d8-virtualization logs deploy/virt-controller --tail=100`
          3. Check that the Pods can be scheduled: `d8 k -n d8-virtualization describe pod -l kubevirt.internal.virtualization.deckhouse.io=virt-controller`
