- name: kubernetes.internal.virtualization.virt_operator_state
  rules:
    - alert: D8VirtualizationVirtOperatorUnavailable
      # The absent() branch covers a deleted Deployment: nothing else would restore
      # virt-operator, so its absence has to raise this alert rather than pass unnoticed.
      # The guard keeps the alert silent when kube-state-metrics itself stops exporting
      # Deployment metrics for the whole namespace.
      # The absent() branch only counts when the object existed at some point during the
      # last week: during the very first installation the components created by
      # virt-operator do not exist yet, and a slow rollout must not page anybody.
      expr: |
        (
          max by (namespace, deployment) (
            kube_deployment_status_replicas_available{namespace="d8-virtualization", deployment="virt-operator"}
          ) == 0
          or
          (
            absent(kube_deployment_status_replicas_available{namespace="d8-virtualization", deployment="virt-operator"})
            and on()
            count(max_over_time(kube_deployment_status_replicas_available{namespace="d8-virtualization", deployment="virt-operator"}[7d])) > 0
          )
        )
        unless on()
        absent(kube_deployment_status_replicas_available{namespace="d8-virtualization"})
      labels:
        severity_level: "4"
        tier: cluster
      for: 10m
      annotations:
        plk_protocol_version: "1"
        plk_markup_format: "markdown"
        plk_create_group_if_not_exists__d8_internal_virtualization_health: "D8InternalVirtualizationHealth,tier=~tier,prometheus=deckhouse,kubernetes=~kubernetes"
        plk_grouped_by__d8_internal_virtualization_health: "D8InternalVirtualizationHealth,tier=~tier,prometheus=deckhouse,kubernetes=~kubernetes"
        summary: "The virtualization module cannot be updated: virt-operator is unavailable."
        description: |
          The virt-operator component has no available replicas. It reconciles the internal components of the virtualization module.

          Impact:
          - The next module update will not be applied, and deleted internal components will not be restored.
          - Nothing breaks for users right now: virtual machines, their disks, networking and console access are unaffected.
          - Fix this before updating the module or the platform.

          The recommended course of action:
          1. Retrieve details of the Deployment: `d8 k -n d8-virtualization describe deploy virt-operator`
          2. View the logs: `d8 k -n d8-virtualization logs deploy/virt-operator --tail=100`
          3. Check that the Pods can be scheduled: `d8 k -n d8-virtualization describe pod -l kubevirt.internal.virtualization.deckhouse.io=virt-operator`
