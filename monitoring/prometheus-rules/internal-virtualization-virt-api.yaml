- name: kubernetes.internal.virtualization.virt_api_state
  rules:
    - alert: D8VirtualizationVirtApiUnavailable
      # The absent() branch covers a Deployment that virt-operator has not created or
      # that was deleted; the guard keeps the alert silent when kube-state-metrics itself
      # stops exporting Deployment metrics for the whole namespace.
      # The absent() branch only counts when the object existed at some point during the
      # last week: during the very first installation the components created by
      # virt-operator do not exist yet, and a slow rollout must not page anybody.
      expr: |
        (
          max by (namespace, deployment) (
            kube_deployment_status_replicas_available{namespace="d8-virtualization", deployment="virt-api"}
          ) == 0
          or
          (
            absent(kube_deployment_status_replicas_available{namespace="d8-virtualization", deployment="virt-api"})
            and on()
            count(max_over_time(kube_deployment_status_replicas_available{namespace="d8-virtualization", deployment="virt-api"}[7d])) > 0
          )
        )
        unless on()
        absent(kube_deployment_status_replicas_available{namespace="d8-virtualization"})
      labels:
        severity_level: "4"
        tier: cluster
      for: 10m
      annotations:
        plk_protocol_version: "1"
        plk_markup_format: "markdown"
        plk_create_group_if_not_exists__d8_internal_virtualization_health: "D8InternalVirtualizationHealth,tier=~tier,prometheus=deckhouse,kubernetes=~kubernetes"
        plk_grouped_by__d8_internal_virtualization_health: "D8InternalVirtualizationHealth,tier=~tier,prometheus=deckhouse,kubernetes=~kubernetes"
        summary: Interactive access to virtual machines is unavailable (backend).
        description: |
          The virt-api component has no available replicas. Requests for console, VNC and port forwarding are proxied to it, so they fail even when virtualization-api itself is healthy.

          Impact:
          - Console and VNC are unavailable both in the web interface and in the command line: `d8 v console`, `d8 v vnc`, `d8 v port-forward` and `d8 v ssh` fail for every virtual machine.
          - Disks cannot be attached to or detached from a running virtual machine, and consistent snapshots cannot be taken.
          - Creating, changing and deleting resources still works, and so do starting, stopping and migrating virtual machines.
          - Running virtual machines are not affected.

          If `D8VirtualizationApiUnavailable` is firing at the same time, fix that one first: both break the same operations for users.

          The recommended course of action:
          1. Retrieve details of the Deployment: `d8 k -n d8-virtualization describe deploy virt-api`
          2. View the logs: `d8 k -n d8-virtualization logs deploy/virt-api --tail=100`
          3. Check that the Pods can be scheduled: `d8 k -n d8-virtualization describe pod -l kubevirt.internal.virtualization.deckhouse.io=virt-api`
