# PROD deploy jobs.
#
# Parity with .github/workflows/release_module_release-channels.yml: the
# channel is selected by the operator, not promoted through a fixed chain.
# All five channel deploys (alpha / beta / early-access / stable /
# rock-solid) are INDEPENDENT manual jobs (when: manual from .prod_manual)
# in a single `deploy_prod` stage. Each only needs `promote` of its own
# edition, so any channel can be deployed directly once that edition is in
# PROD, without first clicking the earlier channels. This replaces the
# previous forced promotion chain (alpha -> beta -> ea -> stable -> rock-solid
# across five separate stages),
# which was a carried-over artifact of the old root .gitlab-ci.yml and
# diverged from GitHub. Each job copies the
# promoted release image to its named release channel on a vX.Y.Z tag.
#
# Why `promote` and not `build_prod`: build_prod writes to the STAGE registry,
# and the release only reaches PROD — where the channels live — through
# promote (jobs/promote.yml). The need is per edition (the same matrix pair),
# so a channel button of one edition does not wait for the other editions to
# be promoted.
#
# The EDITION matrix mirrors build_prod and promote (ce/ee/se-plus/fe) with the
# correct MODULE_EDITION per edition, so deploy runs against the same
# per-edition path promote copied to. MODULE_EDITION is forwarded to the
# deploy step for consistency with the build (werf deploy reads it from the
# environment).
#
# Extends:
#   - .base_deploy    (this repo — consumes upstream ssdlc/gitlab-ci
#                       Deploy.gitlab-ci.yml `.deploy_base` script body, which
#                       is rules-free so it does not override our gating).
#   - .prod_manual     (this repo — PROD registry vars + tag-match rule
#                       with `when: manual`).
# The deploy copies inside PROD only, so it logs into PROD alone.
#
# This file is the tag-push chained-deploy flow. The GitHub
# release_module_release-channels parity flow (single-channel dispatch with
# requirements/version checks, release creation, Loop notify) now lives in
# .gitlab/ci/jobs/release-channels.yml (prod:* jobs, manual Run pipeline).
# This tag-push chain and that flow coexist because the parity flow is gated
# to CI_PIPELINE_SOURCE == "web".

deploy_to_prod_alpha:
  stage: deploy_prod
  variables:
    RELEASE_CHANNEL: alpha
  needs:
    - job: promote
      parallel:
        matrix:
          - EDITION: $[[ matrix.EDITION ]]
            MODULE_EDITION: $[[ matrix.MODULE_EDITION ]]
  extends:
    - .base_deploy
    - .prod_manual
  parallel:
    matrix:
      - EDITION: ce
        MODULE_EDITION: CE
      - EDITION: ee
        MODULE_EDITION: EE
      - EDITION: se-plus
        MODULE_EDITION: EE
      - EDITION: fe
        MODULE_EDITION: EE

