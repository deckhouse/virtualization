# Unit tests of tools/changelog, the tool behind check:changelog and
# changelog:milestone.
#
# It replaces test:scripts:python, which ran the unittest suites of the two
# Python scripts the tool was rewritten from (.gitlab/ci/scripts/python, gone
# with them).
#
# The suite covers what reading a merge request description gets wrong — an
# example inside an HTML comment, an indented fence, several entries in one
# block — and renders the changelog of every release the repository carries,
# expecting the same bytes back, so a change to a renderer cannot reflow the
# published files unnoticed.
#
# MR-gated via .dev.

test:changelog:
  stage: test
  before_script:
    - bash .gitlab/ci/scripts/bash/check-runner-tools.sh go task
  script:
    - task validation:changelog
  extends:
    - .dev
