# Svace scheduled + manual analysis.
#
# Migration of .github/workflows/dev_build_svace.yml. The GH workflow
# did:
#   1. set_vars    - compute MODULES_MODULE_TAG-*svace
#   2. dev_setup_build - build with svace_enabled=true (deferred to
#                       deckhouse/modules-actions/build@v4)
#   3. analyze_build  - run svace_analyze@v4 against the built artifacts
#   4. notify       - send Loop webhook with success/failure
#
# GitLab mapping:
#   - The build step reuses the local `.base_build` template, with `.dev_vars`
#     for DEV registry variables and job-local rules for schedule/manual runs.
#   - The analyze step uses the upstream `.svace_analyze` template
#     (Svace_Analayze.gitlab-ci.yml; note upstream file name typo).
#   - Schedule cron: "00 04 * * 6" -> Pipeline Schedule in UI, with
#     $SCHEDULE_TYPE == "svace" so the svace jobs run only under that
#     dedicated schedule and not under any other pipeline schedule.
#   - workflow_dispatch -> when: manual.
#   - MR opt-in -> set SVACE_PIPELINE_ENABLED=true when running a pipeline.
#   - Git-ref dispatch -> run a pipeline for branch main with
#     $SVACE_BUILD_REF=<tag|branch|commit SHA> (see variables.yml), either from
#     the Run pipeline form or with
#     `glab ci run -b main --variables SVACE_BUILD_REF:<ref>`.
#     Do NOT run the pipeline for
#     a release tag itself: `.prod_always` / `.dev_tags` key on $CI_COMMIT_TAG
#     alone, so any pipeline on a vX.Y.Z ref also fires build_prod (all four
#     editions, when: always) and build_dev_tags, and the pipeline would use the
#     CI config from the tagged commit instead of main. With SVACE_BUILD_REF the
#     pipeline ref stays a branch (no $CI_COMMIT_TAG, no prod build) and
#     svace:build checks the requested ref out itself — same trick as
#     build_dev_manual in jobs/build-dev.yml.
#   - Loop notification kept as a manual / always job. The original GH
#     webhook URL is the LOOP_WEBHOOK_URL masked variable.
#
# Required CI/CD variables (declared in the project):
#   SVACE_ANALYZE_HOST            masked
#   SVACE_ANALYZE_SSH_USER        masked
#   SVACE_ANALYZE_SSH_PRIVATE_KEY_B64  masked
#   SVACER_URL                    var
#   SVACER_IMPORT_USER            masked
#   SVACER_IMPORT_PASSWORD        masked
#   LOOP_WEBHOOK_URL              masked
#
# Tag suffix: `${CI_COMMIT_REF_NAME}-svace` matches the GH workflow
# behavior.

# ---------------------------------------------------------------------------
# set-vars: produce a dotenv artifact with MODULES_MODULE_TAG-*svace.
# ---------------------------------------------------------------------------

svace:set-vars:
  extends:
    - .info
  stage: info
  # Only emit the svace tag dotenv in contexts where svace actually runs.
  # Without these rules this job ran on EVERY MR pipeline and leaked a
  # MODULES_MODULE_TAG=<branch>-svace dotenv artifact into build jobs,
  # overriding their own mr<iid> tag. Runs automatically (no `when: manual`)
  # so the manual svace:build job can consume its artifact.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "svace"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    # Ref dispatch from the CLI: `glab ci run` goes through the API, so its
    # source is "api" and the `web` rule above never matches it.
    - if: '$CI_PIPELINE_SOURCE == "api" && $SVACE_BUILD_REF'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $SVACE_PIPELINE_ENABLED == "true"'
      when: always
    - when: never
  before_script:
    - bash .gitlab/ci/scripts/bash/check-runner-tools.sh bash git
  script:
    - |
      set -euo pipefail
      # In ref-dispatch mode the pipeline ref is the dispatch branch (main), but
      # everything downstream must describe the ref that svace:build checks out.
      REF="${SVACE_BUILD_REF:-${CI_COMMIT_REF_NAME:-}}"
      case "$REF" in
        main|release-*)
          TAG="${REF}-svace" ;;
        "")
          TAG="manual-svace" ;;
        *)
          TAG="${REF//\//_}-svace" ;;
      esac
      # Resolve and validate the ref BEFORE writing svace.env: a dotenv report is
      # uploaded even by a failed job, so a half-written one would still reach
      # the jobs that consume it.
      if [[ -n "${SVACE_BUILD_REF:-}" ]]; then
        # One shallow fetch validates every ref kind uniformly — annotated or
        # lightweight tag, branch, or raw commit SHA — before the 8h build
        # starts, and keeps this job's clone shallow. git exits 128 with
        # "couldn't find remote ref" / "not our ref" for anything the server
        # cannot resolve; its own message is left visible on stderr.
        if ! git fetch --no-tags --depth=1 origin "$SVACE_BUILD_REF"; then
          echo "SVACE_BUILD_REF=${SVACE_BUILD_REF} is not an existing tag, branch or commit in ${CI_PROJECT_URL}" >&2
          exit 1
        fi
        # ^{commit} matters for an annotated tag: FETCH_HEAD then holds the tag
        # object, and svacer would be labeled with a hash that is not a commit.
        SHA=$(git rev-parse "FETCH_HEAD^{commit}")
      fi
      {
        echo "MODULES_MODULE_TAG=${TAG}"
        echo "MODULE_EDITION=EE"
        echo "REF_NAME=${REF}"
        if [[ -n "${SVACE_BUILD_REF:-}" ]]; then
          # The upstream .svace_analyze template labels the svacer import with
          # COMMIT_REF_NAME / COMMIT_HASH, which default to $CI_COMMIT_REF_NAME /
          # $CI_COMMIT_SHA — i.e. the dispatch branch, not the analyzed ref. A
          # dotenv report overrides job variables, so these relabel the import.
          echo "COMMIT_REF_NAME=${SVACE_BUILD_REF}"
          echo "COMMIT_HASH=${SHA}"
        fi
      } > svace.env
      cat svace.env
  artifacts:
    reports:
      dotenv: svace.env

# ---------------------------------------------------------------------------
# build: produces Svace-instrumented artifacts.
#
# Reuses `.base_build` so it does not inherit the dev-tag-only rules from
# `.dev_tags`. The preceding svace:set-vars job writes the actual
# MODULES_MODULE_TAG into a dotenv artifact.
#
# Ref-dispatch mode ($SVACE_BUILD_REF): the job checks the requested ref out
# before building, so the pipeline can stay on a branch ref. GIT_STRATEGY=clone +
# GIT_DEPTH=0 (set only in that mode, so the weekly run keeps its cheap fetch)
# give a full clone from which even an old tag or a bare commit SHA is checkable
# out. The checkout runs at the START of script:, AFTER the upstream Setup
# before_script (werf setup + registry login — neither depends on git HEAD) and
# BEFORE `werf build`, so werf builds the requested commit's tree under
# giterminism. Same pattern as build_dev_manual (jobs/build-dev.yml).
# ---------------------------------------------------------------------------

svace:build:
  extends:
    - .base_build
    - .dev_vars
  stage: build
  interruptible: false
  # Svace-instrumented builds are much slower than regular builds; allow up to
  # 8h before the runner kills the job.
  timeout: 8h
  needs:
    - svace:set-vars
  variables:
    WERF_VIRTUAL_MERGE: "0"
    SVACE_ENABLED: "true"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "svace"'
    # Ref dispatch runs unattended (one `glab ci run` / one Run pipeline form is
    # the whole interaction), so it starts on its own. Must precede the generic
    # web rule below, which is `when: manual`. Both sources are matched: the Run
    # pipeline form gives "web", `glab ci run` (REST API) gives "api".
    #
    # Any non-empty value matches: a branch name or a commit SHA has no shape to
    # validate against, so svace:set-vars is what rejects a ref that does not
    # exist.
    #
    # No `when:` on purpose — the implicit on_success is what keeps this job
    # behind svace:set-vars. `when: always` would start the 8h build even when
    # set-vars rejected the ref, and with no dotenv the build would fall back to
    # MODULES_MODULE_TAG=$CI_COMMIT_REF_NAME and push a `main`-tagged image.
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $SVACE_BUILD_REF'
      variables:
        GIT_STRATEGY: clone
        GIT_DEPTH: "0"
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $SVACE_PIPELINE_ENABLED == "true"'
      when: manual
    - when: never
  script:
    - |
      if [[ -n "${SVACE_BUILD_REF:-}" ]]; then
        git fetch --force origin "$SVACE_BUILD_REF"
        git checkout --detach FETCH_HEAD
      fi
    - !reference [.base_build, script]

# ---------------------------------------------------------------------------
# analyze: invoke the upstream `.svace_analyze` template.
#
# Id-token + vault wiring is inherited from the upstream template.
#
# `.dev_vars` is required even though analyze pulls nothing from a registry: it
# only SSHes to the svace server and curls svacer. But the inherited Setup
# before_script unconditionally runs `werf cr login ... ${MODULES_REGISTRY}`,
# and without a registry bundle MODULES_REGISTRY is empty, so werf defaults to
# Docker Hub and the GitLab creds fail there (unauthorized). `.dev_vars` points
# the login at the DEV registry with valid creds, matching svace:build.
# ---------------------------------------------------------------------------

svace:analyze:
  extends:
    - .svace_analyze
    - .dev_vars
  stage: scan
  interruptible: false
  # Svace analysis over the full instrumented build is slow; allow up to 8h
  # before the runner kills the job (same headroom as svace:build).
  timeout: 8h
  needs:
    - job: svace:set-vars
      artifacts: true
    - job: svace:build
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "svace"'
    # Ref dispatch: follow svace:build automatically (see its rules).
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $SVACE_BUILD_REF'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $SVACE_PIPELINE_ENABLED == "true"'
      when: manual
    - when: never

# ---------------------------------------------------------------------------
# notify: post the result to Loop (best-effort).
# ---------------------------------------------------------------------------

svace:notify:
  stage: cleanup
  # Gated to a real svace run by its rules (a scheduled svace run or
  # $SVACE_PIPELINE_ENABLED), NOT by the needs below. svace:analyze is an
  # OPTIONAL need on purpose: when svace:build fails, svace:analyze is skipped
  # (not failed), and a skipped non-optional need would propagate skip here and
  # swallow the failure notification. With optional + when: always, notify runs
  # whatever happened upstream, and the script derives the real status from the
  # svace:analyze job via the API (reporting FAIL when it is missing / skipped /
  # failed). set-vars is pulled for the REF_NAME dotenv.
  needs:
    - job: svace:set-vars
      artifacts: true
    - job: svace:analyze
      optional: true
  before_script:
    - bash .gitlab/ci/scripts/bash/check-runner-tools.sh bash curl jq
  script:
    - |
      set -euo pipefail
      source .gitlab/ci/scripts/bash/lib/api.sh
      gl_required_env CI_API_V4_URL GITLAB_API_TOKEN CI_PROJECT_ID CI_PIPELINE_ID LOOP_WEBHOOK_URL
      DATE=$(date '+%Y-%m-%d')
      # Derive the result from the svace:analyze job, not this notify job:
      # CI_JOB_STATUS would report THIS job and is almost always "success".
      # Mirrors the GitHub `needs.analyze_build.result == 'success'` check.
      ANALYZE_STATUS=$(api GET "/projects/${CI_PROJECT_ID}/pipelines/${CI_PIPELINE_ID}/jobs?per_page=100" \
        | jq -r '[.[] | select(.name == "svace:analyze")][0].status // ""')
      if [[ "${ANALYZE_STATUS}" == "success" ]]; then
        STATUS=":white_check_mark: SUCCESS!"
      else
        STATUS=":x: FAIL!"
      fi
      MESSAGE="### :gear: **DVP ${DATE} Weekly Svace Analyze Report**
      **Branch:** \`${REF_NAME:-${CI_COMMIT_REF_NAME}}\`
      **Status:** ${STATUS}
      [:link: Pipeline](${CI_PIPELINE_URL})"
      curl --silent --show-error --fail \
        --request POST \
        --header 'Content-Type: application/json' \
        --data "$(jq -n --arg text "${MESSAGE}" '{text: $text}')" \
        "${LOOP_WEBHOOK_URL}" || echo "Loop webhook failed (non-fatal)"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "svace"'
      when: always
    - if: '$SVACE_PIPELINE_ENABLED == "true"'
      when: always
    - when: never
