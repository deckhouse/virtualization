# End-to-end tests on a cluster leased from the shared e2e pool.
#
# The clusters are not owned by this repository: a sibling CI project
# (deckhouse/virtualization/ci/e2e-pool) keeps a pool of ready nested clusters
# and hands one out at a time. Everything about the pool — its API, its
# credentials, how a lease is taken and returned — lives in that project's
# `/templates/lease.yml`, imported below. This repository only knows three
# script fragments and one state word:
#
#   !reference [.e2e_pool, acquire]  take a lease, export KUBECONFIG for it
#   !reference [.e2e_pool, env]      re-derive that KUBECONFIG in after_script
#   !reference [.e2e_pool, release]  give the lease back
#
# Lease lifecycle: free -> busy (acquire) -> free or dirty (release). The pool
# only understands those two end states; deciding which one applies is this
# repository's job, because only the test code knows how to clean up after
# itself. So after_script runs `task cleanup` + puts the module platform object
# back on `main`, and exports E2E_POOL_STATE=free only when both succeeded.
# Anything else (test failure with leftovers, job timeout, killed runner) leaves
# the default `dirty` and the pool takes the cluster out of rotation until it is
# reset.
#
# Required CI/CD variables — group-level on `deckhouse/virtualization`, so both
# this repository and the pool project see them (see the lease template for the
# full contract):
#   E2E_POOL_URL, E2E_POOL_USER, E2E_POOL_PASSWORD_FILE
#   KUBECONFIG_E2E_REGULAR_XX   one file variable per pool cluster
#
# None of them may be protected: protected variables are handed only to
# pipelines of protected branches and tags, while this job runs in MR
# pipelines and would fail in `acquire`. The access boundary is group
# membership instead — which also means merge requests from forks cannot take
# a lease.

include:
  # The lease fragments, pinned so that changes in the pool project cannot
  # silently alter this repository's pipeline. Bumping the pin is a merge
  # request here. Pinned to the commit that added per-OS cloud clusters to the
  # pool (lease.yml with E2E_POOL_TYPE / E2E_POOL_API_DOMAIN); re-pin to the next
  # `v*` tag once the pool cuts one.
  - project: "deckhouse/virtualization/ci/e2e-pool"
    ref: "ea9dedc3c82222fa87e9ede7db97ca5b161eedf3"
    file: "/templates/lease.yml"

# ---------------------------------------------------------------------------
# e2e: the nightly suite, run on demand against a leased cluster.
#
# Time budget: `timeout: 3h` has to cover the wait inside `acquire` (up to 90
# minutes when the pool is busy) + the run itself + 30 minutes of cleanup. It
# must also stay equal to the heartbeat timeout in the lease template: a
# heartbeat outliving its job keeps the lease busy and hides it from the pool's
# reaper.
#
# `tags: [deckhouse-e2e-en]` must be restated because default.tags in
# .gitlab/ci/defaults.yml is `deckhouse`, which has no network access to the
# pool clusters. That runner is a docker executor, so the toolchain comes from
# $E2E_IMAGE (see .gitlab/ci/variables.yml).
# ---------------------------------------------------------------------------

# Shared body of the e2e buttons; the per-storage jobs below only set the
# storage variables. One resource_group across all of them: a single MR's
# runs are serialized, whatever button was pressed.
.e2e:
  stage: e2e
  # MR pipelines + MODULES_MODULE_TAG=mr<iid> + DEV registry credentials.
  extends:
    - .dev
  tags:
    - deckhouse-e2e-en
  image: $E2E_IMAGE
  timeout: 3h
  needs:
    - build_dev
  # Button-triggered, permanently — not just during rollout. `.dev` supplies
  # `rules: [if merge_request_event, when: always]`, and the `when` of a
  # matching rule beats a job-level `when:`, so the manual gate has to be
  # restated here or it is silently ignored. `allow_failure: true` restores what
  # a job-level `when: manual` would have given (rules-based manual jobs default
  # to false): the MR pipeline neither waits for e2e nor goes red because of it.
  # Making e2e blocking is a separate decision (`allow_failure: false`).
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - when: never
  # A cancelled run costs a lease and a cleanup; cheaper to let it finish.
  # Overrides `interruptible: true` from .gitlab/ci/defaults.yml.
  interruptible: false
  # Serializes the runs of one MR: with interruptible: false a new commit leaves
  # the previous run going, and two runs of one MR would take two clusters and
  # race over the same mr<iid> image tag.
  resource_group: e2e-mr-$CI_MERGE_REQUEST_IID
  variables:
    E2E_SCRIPT_DIR: $CI_PROJECT_DIR/.github/scripts/bash/e2e
    E2E_CONFIG: $CI_PROJECT_DIR/test/e2e/default_config.yaml
    # Below the ginkgo default of 24: more parallelism gets the single-master pool
    # cluster's apiserver killed by kubelet. The nightly jobs inherit this too.
    PROCS: "10"
    # Must cover the five bounded steps below (5 x 10m), or `release` never runs
    # and the lease stays busy behind a dead job.
    RUNNER_AFTER_SCRIPT_TIMEOUT: 55m
    # run-mr-e2e.sh stops a suite running longer than this, so that the job
    # timeout (3h) still leaves room for after_script (55m above).
    E2E_SUITE_TIMEOUT: 2h
  # Overrides the upstream Setup.gitlab-ci.yml before_script (trdl + werf),
  # which does not work in the job container; crane in checkout-to-mpo only
  # needs the registry login.
  before_script:
    - |
      set -e
      # Fail here, not in checkout-to-mpo, when the credentials are empty.
      # `:` is a no-op; on an empty variable bash prints only its name.
      : "${MODULES_REGISTRY_LOGIN:?}" "${MODULES_REGISTRY_PASSWORD:?}"
      export DOCKER_CONFIG="$CI_PROJECT_DIR/.docker-e2e"
      mkdir -p "$DOCKER_CONFIG"
      printf '%s' "$MODULES_REGISTRY_PASSWORD" | crane auth login "${MODULES_REGISTRY%%/*}" -u "$MODULES_REGISTRY_LOGIN" --password-stdin
    # Nightly only: the .e2e-nightly jobs set E2E_OS, which selects a per-OS
    # stand and turns on the per-day storage-class rotation. STORAGE_CLASS_NAME
    # and CSI exported here survive into `script` (one shell). Empty for the MR
    # buttons, which set STORAGE_CLASS_NAME themselves, so they are unaffected.
    - |
      if [ -n "${E2E_OS:-}" ]; then
        # Capture first, then eval: `eval "$(bad-cmd)"` would otherwise run empty
        # and continue with an unset STORAGE_CLASS_NAME instead of failing.
        sc_exports="$(bash "$CI_PROJECT_DIR/.gitlab/ci/scripts/bash/e2e/nightly-storage-class.sh" "$E2E_OS")"
        eval "$sc_exports"
        echo "[INFO] nightly ${E2E_OS}: storage class ${STORAGE_CLASS_NAME} (CSI ${CSI})"
      fi
  script:
    # Collapsed log section around everything before the suite itself, so the
    # job log opens on the test run. Same trick as GitHub's log groups.
    # The runner prints only the first line of a multi-line block, so the raw
    # escape-sequence echo stays out of the log.
    - |
      : fold the preparation into a collapsed log section
      echo -e "\e[0Ksection_start:$(date +%s):e2e_prepare[collapsed=true]\r\e[0KPrepare cluster (lease, module image, readiness gates)"
    - !reference [.e2e_pool, acquire]
    - v12n_tag="$MODULES_MODULE_TAG" task -d test/e2e checkout-to-mpo
    - bash "$E2E_SCRIPT_DIR/patch-virtualization-feature-gates.sh" "$MODULES_MODULE_TAG"
    # The gates patch triggers another module reconcile; the suite's
    # virtualization-precheck insists on Ready, so wait the reconcile out
    # (the nightly workflow does the same between configuration and tests).
    - |
      source "$E2E_SCRIPT_DIR/wait-virtualization-ready.sh"
      d8_queue
      virtualization_ready
      kubectl -n d8-virtualization wait --for=condition=Available deploy --all --timeout 900s
      virt_handler_ready
    # detect-k8s-version decides whether USB (DRA) specs can run on this
    # cluster: below k8s 1.34 they are excluded via a ginkgo label filter,
    # exactly like the nightly workflow does.
    - |
      bash "$E2E_SCRIPT_DIR/detect-k8s-version.sh" "$CI_PROJECT_DIR/.k8s-version.env"
      export SERVER_K8S_VERSION="$(grep '^server-version=' "$CI_PROJECT_DIR/.k8s-version.env" | cut -d= -f2-)"
      export USB_SUPPORTED="$(grep '^usb-supported=' "$CI_PROJECT_DIR/.k8s-version.env" | cut -d= -f2-)"
      export LABELS="$(grep '^label-filter=' "$CI_PROJECT_DIR/.k8s-version.env" | cut -d= -f2-)"
      echo -e "\e[0Ksection_end:$(date +%s):e2e_prepare\r\e[0K"
      # The wrapper, not run-nightly-e2e.sh directly: a cancel does not stop
      # the suite by itself, see the wrapper's header.
      bash "$CI_PROJECT_DIR/.gitlab/ci/scripts/bash/e2e/run-mr-e2e.sh"
  after_script:
    # A separate step in a separate shell, which also runs on failure and on job
    # timeout — that is why the lease is handed back here and not from a `trap`.
    # The shell of `script` is gone by now, so `env` re-derives KUBECONFIG from
    # the lease file in $CI_PROJECT_DIR before anything touches the cluster.
    # Collapsed section over the whole cleanup: it is noise unless the release
    # went wrong, and then it is one click away.
    - |
      : fold the cleanup into a collapsed log section
      echo -e "\e[0Ksection_start:$(date +%s):e2e_cleanup[collapsed=true]\r\e[0KCleanup cluster and release the lease"
    - !reference [.e2e_pool, env]
    # The DOCKER_CONFIG variable from before_script does not survive into this
    # shell either; the config file it points at does, but the login is repeated
    # rather than relying on the workspace, since checkout-to-mpo below reads
    # the module image with crane.
    - |
      set -e
      # Fail here, not in checkout-to-mpo, when the credentials are empty.
      # `:` is a no-op; on an empty variable bash prints only its name.
      : "${MODULES_REGISTRY_LOGIN:?}" "${MODULES_REGISTRY_PASSWORD:?}"
      export DOCKER_CONFIG="$CI_PROJECT_DIR/.docker-e2e"
      mkdir -p "$DOCKER_CONFIG"
      printf '%s' "$MODULES_REGISTRY_PASSWORD" | crane auth login "${MODULES_REGISTRY%%/*}" -u "$MODULES_REGISTRY_LOGIN" --password-stdin
    # Hand the cluster back ready to use; on any failure it goes back dirty (the
    # lease template default). Order matters: drop the gates main rejects while the
    # MR's module can still admit the change, roll the tag back, wait for the module
    # on main, then set main's own gates - that call needs the module's webhook.
    - |
      if timeout 10m task -d test/e2e cleanup &&
        timeout 10m bash "$E2E_SCRIPT_DIR/patch-virtualization-feature-gates.sh" "$MODULES_MODULE_TAG" main &&
        v12n_tag=main timeout 10m task -d test/e2e checkout-to-mpo &&
        timeout 10m bash -c 'source "$E2E_SCRIPT_DIR/wait-virtualization-ready.sh"
          d8_queue
          virtualization_ready
          kubectl -n d8-virtualization wait --for=condition=Available deploy --all --timeout 300s
          virt_handler_ready' &&
        timeout 10m bash "$E2E_SCRIPT_DIR/patch-virtualization-feature-gates.sh" main; then
        export E2E_POOL_STATE=free
      fi
    - !reference [.e2e_pool, release]
    - |
      : close the cleanup log section
      echo -e "\e[0Ksection_end:$(date +%s):e2e_cleanup\r\e[0K"
  artifacts:
    when: always
    # Same as the unit-test jobs; a run is triaged the day it happens, and the
    # instance default of 60 days is not ours to rely on.
    expire_in: 3 days
    paths:
      - test/e2e/e2e_report_*.json
      - test/e2e/e2e_output_*.log
      # The only record of what the watchdog did: it outlives the job log.
      - e2e_watchdog.log

# The buttons. Pool clusters carry every storage type at once (the release
# pipeline's "mixed" layout), so the matrix is just variables on one lease —
# no separate pool types, the queue stays whole.
e2e:nfs:
  extends: .e2e
  variables:
    CSI: nfs
    STORAGE_CLASS_NAME: nfs

e2e:replicated:
  extends: .e2e
  variables:
    CSI: replicated
    STORAGE_CLASS_NAME: nested-thin-r1

e2e:local:
  extends: .e2e
  variables:
    CSI: local
    STORAGE_CLASS_NAME: nested-local-thin

# ---------------------------------------------------------------------------
# Nightly: the suite on the per-OS cloud stands, run on a schedule.
#
# These are not the buttons above. The buttons lease one homogeneous
# `e2e-regular` cluster and are pressed by hand on an MR. The nightly jobs lease
# a per-OS stand (Astra / ALT / RED OS) from the pool, one boskos type each, and
# fire from a scheduled pipeline. They `extends: .e2e` to reuse its whole body -
# before_script (login, storage rotation), script (lease, module image,
# readiness, suite), after_script (cleanup, release), artifacts - and override
# only the MR-specific wiring (`.dev` rules, MR-iid tag, build_dev dependency),
# so there is one copy of the hard part.
#
# What differs from the buttons:
#   - the module under test is `main` (the rolling DEV slot), not an MR build,
#     so there is no build to wait for - `needs: []`;
#   - the stand lives on dvp.flant.dev, a different domain than the e2e-regular
#     pool, so E2E_POOL_API_DOMAIN is set for the lease check;
#   - E2E_POOL_TYPE selects the OS stand's boskos type;
#   - the storage class is not fixed per job but rotates by the day
#     (nightly-storage-class.sh), exported before the referenced script runs.
#
# Enabling: set up a schedule on `main` with SCHEDULE_TYPE=e2e-nightly (the
# repo-wide schedule discriminator, see .gitlab/ci/variables.yml; nothing else
# triggers these). Note the lease variables above take effect only once the
# `ref:` of the pool include is bumped to a tag whose lease.yml honours
# E2E_POOL_TYPE / E2E_POOL_API_DOMAIN; until then a scheduled run would lease an
# e2e-regular cluster. Both - the ref bump and the schedule - are deliberately
# separate, flipped once the stands are registered in the pool.
# ---------------------------------------------------------------------------

.e2e-nightly:
  # Inherit the whole body of .e2e - before_script (registry login), script
  # (lease, module image, readiness, suite), after_script (cleanup, release),
  # artifacts, timeout, tags. Only the pipeline wiring differs, overridden below.
  extends: .e2e
  # The main-tagged module image already exists in the DEV registry; nothing to
  # build or wait for in a scheduled pipeline.
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "e2e-nightly"'
      when: always
    - when: never
  # One stand per OS, so one run of each OS at a time; no MR iid here.
  resource_group: e2e-nightly-$E2E_OS
  variables:
    # Test the rolling `main` module image; .e2e/.dev use the MR's mr<iid> tag.
    MODULES_MODULE_TAG: main
    # The cloud stands answer on api.<name>.dvp.flant.dev, not the e2e-regular
    # pool's domain; the lease check in the pool template is built against this.
    E2E_POOL_API_DOMAIN: dvp.flant.dev
    # Picked up by .e2e's before_script: a non-empty E2E_OS turns on the per-day
    # storage-class rotation for that stand. The per-OS jobs set it below.

e2e-nightly:redos:
  extends: .e2e-nightly
  variables:
    E2E_OS: redos
    E2E_POOL_TYPE: e2e-redos

e2e-nightly:astra:
  extends: .e2e-nightly
  variables:
    E2E_OS: astra
    E2E_POOL_TYPE: e2e-astra

# ALT lands on nested-thin-r1 one day in three, where replicated storage does
# not build on the ALT kernel - that run fails on purpose (see
# nightly-storage-class.sh). Left visible rather than hidden, so the day it
# starts passing shows up; flip this to allow_failure or drop the class from the
# rotation if the red night becomes noise.
e2e-nightly:alt:
  extends: .e2e-nightly
  variables:
    E2E_OS: alt
    E2E_POOL_TYPE: e2e-alt

# ---------------------------------------------------------------------------
# Nightly report: collect the three OS runs and post one threaded summary to
# Loop, reusing the GitHub report scripts in place (as the bash scripts are
# reused). No npm install - the report path is node built-ins + global fetch.
#
# dependencies (not needs): the OS jobs publish `artifacts: when: always`, so
# their raw reports are here even when a run failed; `needs` on a failed job
# would skip this one, but the report must run regardless. allow_failure keeps a
# broken report (or Loop outage) from reddening the nightly pipeline on its own.
#
# Three docker runs share the workspace (-w /src, runner-owned via -u so the
# shell executor's git clean is not left root-owned files):
#   1. node    cluster-report.js  raw ginkgo -> processed/e2e_report_<os>.json
#   2. python  charts.py          processed  -> tmp/messenger-charts/*.png + manifest
#   3. node    messenger-report.js processed + manifest -> threaded Loop post
#
# Requires three user-provided CI variables (Loop API, same channel as the old
# GitHub nightly): LOOP_API_BASE_URL, LOOP_CHANNEL_ID, LOOP_TOKEN. With all three
# absent the messenger step is a silent no-op (the report scripts disable Loop).
# ---------------------------------------------------------------------------
e2e-nightly:report:
  stage: notify
  tags:
    - deckhouse
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "e2e-nightly"'
      when: always
    - when: never
  allow_failure: true
  dependencies:
    - e2e-nightly:redos
    - e2e-nightly:astra
    - e2e-nightly:alt
  variables:
    EXPECTED_STORAGE_TYPES: '["redos","astra","alt"]'
    E2E_OS_LIST: "redos astra alt"
    PROCESSED_DIR: processed
  before_script:
    - bash .gitlab/ci/scripts/bash/check-runner-tools.sh docker
  script:
    - |
      set -e
      # 1. raw ginkgo reports (test/e2e/e2e_report_<os>_*.json, pulled via
      #    dependencies) -> processed/e2e_report_<os>.json.
      docker run --rm --platform linux/amd64 \
        -v "${PWD}:/src" -w /src -u "$(id -u):$(id -g)" -e HOME=/tmp \
        -e CI_SERVER_URL -e CI_PROJECT_PATH -e CI_PIPELINE_ID -e CI_COMMIT_REF_NAME \
        -e E2E_OS_LIST -e PROCESSED_DIR -e RAW_REPORTS_DIR=test/e2e \
        "node:${NODE_VERSION}" \
        node .gitlab/ci/scripts/js/e2e-nightly-report.js cluster-reports
    - |
      set -e
      # 2. render per-cluster charts + manifest (matplotlib). pip --user so the
      #    non-root container writes under HOME=/tmp, not system site-packages.
      docker run --rm --platform linux/amd64 \
        -v "${PWD}:/src" -w /src -u "$(id -u):$(id -g)" -e HOME=/tmp \
        -e PROCESSED_DIR \
        python:3.12 \
        sh -c '
          set -e
          pip install --user --quiet --no-cache-dir -r .github/scripts/python/requirements.txt
          python .github/scripts/python/e2e_report/charts.py messenger-all \
            --reports-dir "${PROCESSED_DIR}" \
            --out-dir tmp/messenger-charts \
            --manifest tmp/messenger-charts/manifest.json
        '
    - |
      set -e
      # 3. post the threaded report (text + chart images) to Loop.
      # No CI_* here: the messenger reads only the processed reports (context was
      # baked into them in step 1), EXPECTED_STORAGE_TYPES and LOOP_*.
      docker run --rm --platform linux/amd64 \
        -v "${PWD}:/src" -w /src -u "$(id -u):$(id -g)" -e HOME=/tmp \
        -e REPORTS_DIR="${PROCESSED_DIR}" -e EXPECTED_STORAGE_TYPES \
        -e LOOP_API_BASE_URL -e LOOP_CHANNEL_ID -e LOOP_TOKEN \
        "node:${NODE_VERSION}" \
        node .gitlab/ci/scripts/js/e2e-nightly-report.js messenger
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - processed/
      - tmp/messenger-charts/
