# Build_Fuzz publishes the images and generates the child pipeline for Replay_Fuzz.
# Keep fuzzing scoped to MR pipelines and release-branch pushes, like the module's
# builds; unrelated cleanup/changelog schedules must not start fuzz builds or publish
# reports.
#
# This is the release-1.10 counterpart of the main job: .main would never fire
# here, so the automatic run is keyed on a push to release-X.Y instead. The
# corpus is tied to the code that produced it, and pvc-artifact on this branch
# is even a differently named Go module, so main's corpus entries never match
# its packages. The shared template defaults FUZZ_S3_BRANCH_SLUG to main for
# merge requests; override it with this branch's slug so an MR into
# release-1.10 replays release-1-10, the same prefix the push run reports under.
# Until the external platform has filled that prefix the replay runs on the
# committed seeds only.
.virtualization_fuzz_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        FUZZ_S3_BRANCH_SLUG: release-1-10
    - if: '$CI_COMMIT_BRANCH =~ /^release-[0-9]+\.[0-9]+/ && $CI_PIPELINE_SOURCE == "push"'
      variables:
        FUZZ_S3_BRANCH_SLUG: ${CI_COMMIT_REF_SLUG}
        FUZZ_PUBLISH_REPORT: "true"
    - when: never

.fuzz_source_auth:
  script:
    - |
      if [[ -n "${SOURCE_REPO_SSH_KEY}" ]]; then
        if [[ -z "${SSH_AUTH_SOCK}" ]]; then
          eval "$(ssh-agent -s)" >/dev/null
          trap 'kill -3 ${SSH_AGENT_PID}' ERR EXIT HUP INT QUIT TERM
        fi
        source_repo_key="${SOURCE_REPO_SSH_KEY}"
        if [[ -f "${source_repo_key}" ]]; then
          source_repo_key="$(cat "${source_repo_key}")"
        fi
        printf '%b\n' "${source_repo_key}" | ssh-add -
      else
        echo "SOURCE_REPO_SSH_KEY is not set: private mirror dependencies may fail."
      fi

build_fuzz:
  extends: [.fuzz_build, .dev_vars, .virtualization_fuzz_rules]
  before_script:
    # Setup selects TRDL_BIN before invoking trdl. Avoid the runner-wide
    # current symlink, which another concurrent job can replace.
    - |
      trdl() {
        "${TRDL_BIN:?Setup must select a TRDL binary}" "$@"
      }
    - !reference [before_script]
  needs:
    - job: set_vars
      artifacts: true
  variables:
    WERF_VIRTUAL_MERGE: "0"
  script:
    - !reference [.fuzz_source_auth, script]
    - !reference [.fuzz_build, script]

replay_fuzz:
  extends: [.fuzz_replay, .dev_vars, .virtualization_fuzz_rules]
  trigger:
    include:
      - artifact: fuzz-replay-pipeline.yml
        job: build_fuzz
      - local: .gitlab/ci/jobs/replay-fuzz.yml
  variables:
    VAULT_AUTH_ROLE: ${MODULES_MODULE_NAME}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
      variables:
        FUZZ_S3_BRANCH_SLUG: release-1-10
    - !reference [.virtualization_fuzz_rules, rules]
