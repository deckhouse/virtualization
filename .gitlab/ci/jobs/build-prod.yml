# Release build job.
#
# Builds the module images for every edition on tag push (vX.Y.Z) into the
# STAGE registry, then leaves the copy into PROD to Promote
# (.gitlab/ci/jobs/promote.yml) and the channel deploys to
# .gitlab/ci/jobs/deploy-prod.yml. Nothing here writes to PROD: PROD receives
# only what Promote copies from STAGE, by digest.
#
# Parity with .github/workflows/release_module_build-and-registration.yml:
# four editions ce / ee / se-plus / fe, each with its own
# MODULES_MODULE_SOURCE subpath and the correct MODULE_EDITION (CE only for
# ce, EE for ee/se-plus/fe). MODULE_EDITION is consumed by
# .werf/consts.yaml (defaults to EE) and used as a Go build tag plus an
# EE-only image gate, so it MUST be set per edition — otherwise the ce prod
# image is built as EE.
#
# Note vs GitHub: GH runs ce and ee in parallel, then se-plus and fe after
# ee (needs: prod_ee_setup_build). The GitLab matrix runs all four in
# parallel (each leg gets its own resource_group via $EDITION — see below).
# Each edition builds into its own registry subpath with no shared artifact,
# so the GH `needs: ee` ordering is a sequencing/resource guard, not a data
# dependency; the parallel matrix is acceptable.
#
# Resource group: prod:$CI_COMMIT_TAG:$EDITION — a per-(tag, edition) mutex.
# resource_group is a project-wide mutex: only one job sharing a given value
# runs at a time, across all pipelines. A constant "prod" therefore serialized
# every prod build project-wide — different tags waited on each other, and the
# four parallel:matrix legs (which all share the job's resource_group) even
# serialized against one another within a single tag pipeline. Scoping the
# group by $CI_COMMIT_TAG and $EDITION lets distinct tags and distinct editions
# build concurrently, while a re-run of the same (tag, edition) still
# serializes — the only race worth guarding against (two builds pushing the
# same image path).
#
# Upstream .build expects MODULES_MODULE_SOURCE and WERF_REPO; .stage_vars
# (via .prod_always) sets MODULES_MODULE_SOURCE per-edition
# (STAGE_MODULES_REGISTRY/PROD_MODULE_SOURCE_NAME/EDITION/modules), and
# WERF_REPO defaults to MODULES_MODULE_SOURCE/MODULES_MODULE_NAME in upstream
# Setup — the STAGE repo the release is built into.
#
# No DEV registry here: the release contour must not read from the dev one, so
# there is no DEV login and no WERF_SECONDARY_REPO_1 = DEV cache (the GH
# `secondary_repo` input to build@v4 is intentionally gone). werf reuses only
# what is already in the STAGE repo, so the first release build of an empty
# STAGE repo is a cold one.

build_prod:
  stage: build
  resource_group: "prod:${CI_COMMIT_TAG}:${EDITION}"
  # interruptible: false is inherited from .stage_vars (via .prod_always).
  # needs: [] opts into DAG mode with NO dependencies so build_prod does not
  # inherit prior-stage dotenv. On a vX.Y.Z tag, set_vars (info stage) emits
  # MODULE_EDITION=EE, and a dotenv var overrides variables: set in YAML —
  # including the parallel:matrix. Without this, the ce leg's MODULE_EDITION: CE
  # is clobbered to EE and the ce prod image is built as EE. build_prod needs no
  # data from the tag pipeline; all its vars come from .stage_tag + the matrix.
  needs: []
  extends:
    - .base_build
    - .prod_always
  parallel:
    matrix:
      - EDITION: ce
        MODULE_EDITION: CE
      - EDITION: ee
        MODULE_EDITION: EE
      - EDITION: se-plus
        MODULE_EDITION: EE
      - EDITION: fe
        MODULE_EDITION: EE
