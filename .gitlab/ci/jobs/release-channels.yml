# Prod release-channels parity with GitHub.
#
# Port of .github/workflows/release_module_release-channels.yml: a manual,
# single-channel/single-tag release dispatch with on-demand build, deploy,
# version verification, GitLab release creation, and a Loop notification.
#
# Trigger: CI/CD -> Pipelines -> Run pipeline, on ANY ref (typically main) with
# $RELEASE_TAG set (CI_PIPELINE_SOURCE == "web"). These jobs run ONLY on such
# manual web pipelines, so they never collide with the tag-push flow
# (build_prod / deploy_to_prod_* in build-prod.yml / deploy-prod.yml).
#
# Run pipeline UI variables (all optional except RELEASE_TAG):
#   RELEASE_CHANNEL          alpha|beta|early-access|stable|rock-solid (default alpha)
#   RELEASE_TAG              module tag like v1.21.1 (required, ^v\d+\.\d+\.\d+$)
#   EDITION_CE               "true"/"false" (default false) — deploy CE
#   EDITION_EE               "true"/"false" (default false) — deploy EE + SE-Plus + FE
#   ENABLE_BUILD             "true"/"false" (default true)  — run build before deploy
#   CHECK_ONLY               "true"/"false" (default false) — verify only, skip build/deploy
#   SKIP_REQUIREMENTS_CHECK  "true"/"false" (default false)
#   RELEASE_TO_GITLAB        "true"/"false" (default true)  — create GitLab release
#   SEND_RESULTS_TO_LOOP     "true"/"false" (default true)  — post status to Loop
#
# Parity notes vs GitHub:
#   - Release creation targets GitLab Releases (POST /projects/:id/releases)
#     instead of GitHub Releases, because development is moving to GitLab.
#     The notes source is preserved: the merged changelog MR
#     (label:changelog, milestone:$RELEASE_TAG) description.
#   - Run the pipeline on any ref (typically main), NOT on the tag. This mirrors
#     GitHub, where the workflow YAML comes from the dispatch ref while each
#     build job checks out ref:inputs.tag. The build jobs here (.prod_release_build)
#     `git checkout` $RELEASE_TAG before `werf build`, so werf builds the tagged
#     commit even though the pipeline ran on main. The upstream Setup
#     before_script (trdl / werf / registry login) is ref-independent, so it
#     stays untouched — only the working tree is switched to the tag inside the
#     build script. Benefit: if the release pipeline itself is broken, fix it on
#     main and re-run; no need to move or recreate the tag. prod:print-vars only
#     validates the tag format and that the tag exists. Deploy jobs are
#     crane copy :tag -> :channel (registry-only), so they need no checkout.
#     This is the same checkout-a-tag-off-any-ref pattern as build_dev_manual in
#     build-dev.yml. Like that job we do NOT re-run `werf ci-env`, so the
#     ci.werf.io/commit image annotation reflects the pipeline ref's commit —
#     cosmetic; the built content and the applied :$RELEASE_TAG are correct.
#   - Per-(channel,tag) concurrency uses resource_group (a mutex); GitLab has
#     no cancel-in-progress equivalent, so concurrent same-(channel,tag)
#     dispatches serialize instead of cancelling.
#   - Edition cascade (GitHub parity — job-SE-Plus / job-FE): SE-Plus and FE both
#     derive from EE, so neither builds nor deploys until EE does. Both the build
#     and the deploy of se-plus/fe `needs` the ee counterpart; ce/ee themselves
#     build+deploy in parallel and gate on prod:check-requirements. This keeps the
#     requirements check binding for the whole family even on a deploy-only run
#     (ENABLE_BUILD=false), where the build cascade is absent: ee's deploy still
#     `needs: prod:check-requirements`, and se-plus/fe deploys inherit the gate
#     transitively through deploy:ee. Without this, se-plus/fe deploys had only an
#     optional need on their (absent) build job, so a failed check-requirements
#     did not block them.

variables:
  RELEASE_CHANNEL:
    value: "alpha"
    options: ["alpha", "beta", "early-access", "stable", "rock-solid"]
    description: "Release channel to deploy"
  RELEASE_TAG:
    value: ""
    description: "Module tag like v1.21.1 (required, ^v\\d+\\.\\d+\\.\\d+$). The tag must already exist; run the pipeline on any ref (e.g. main)."
  EDITION_CE:
    value: "false"
    options: ["true", "false"]
    description: "Build+deploy CE edition"
  EDITION_EE:
    value: "false"
    options: ["true", "false"]
    description: "Build+deploy EE + SE-Plus + FE editions"
  ENABLE_BUILD:
    value: "true"
    options: ["true", "false"]
    description: "Run build before deploy (false = deploy only, image already in registry)"
  CHECK_ONLY:
    value: "false"
    options: ["true", "false"]
    description: "Skip build/deploy; only verify the version on the release channel"
  SKIP_REQUIREMENTS_CHECK:
    value: "false"
    options: ["true", "false"]
    description: "Skip the Deckhouse version requirements check before build"
  RELEASE_TO_GITLAB:
    value: "true"
    options: ["true", "false"]
    description: "Create a GitLab release from the merged changelog MR"
  SEND_RESULTS_TO_LOOP:
    value: "true"
    options: ["true", "false"]
    description: "Send the release result summary to Loop via webhook"

# Common rule: only on manual web pipelines with a valid tag. Every prod:* job
# extends this; interruptible:false keeps the whole manual release flow from
# being auto-cancelled (overrides the global interruptible:true default).
.prod_release_rules:
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_TAG =~ /^v\d+\.\d+\.\d+$/
    - when: never

# ---------------------------------------------------------------------------
# 1. print-vars + tag/ref validation
# ---------------------------------------------------------------------------
prod:print-vars:
  stage: info
  extends: .prod_release_rules
  variables:
    MODULES_MODULE_TAG: "${RELEASE_TAG}"
    # Full clone so the tag object is fetchable for the existence check below
    # (and, in the build jobs, for the checkout).
    GIT_DEPTH: 0
  before_script:
    - bash .gitlab/ci/scripts/bash/check-runner-tools.sh bash git
  script:
    - |
      set -e
      echo "MODULES_REGISTRY=${PROD_REGISTRY}"
      echo "MODULES_MODULE_SOURCE=${PROD_REGISTRY}/${PROD_MODULE_SOURCE_NAME}/<edition>/modules"
      echo "MODULES_MODULE_NAME=${MODULES_MODULE_NAME}"
      echo "PIPELINE_REF=${CI_COMMIT_REF_NAME}"
      echo "RELEASE_CHANNEL=${RELEASE_CHANNEL}"
      echo "RELEASE_TAG=${RELEASE_TAG}"
      echo "EDITION_CE=${EDITION_CE} EDITION_EE=${EDITION_EE}"
      echo "ENABLE_BUILD=${ENABLE_BUILD} CHECK_ONLY=${CHECK_ONLY}"
      echo "SKIP_REQUIREMENTS_CHECK=${SKIP_REQUIREMENTS_CHECK}"
      echo "RELEASE_TO_GITLAB=${RELEASE_TO_GITLAB} SEND_RESULTS_TO_LOOP=${SEND_RESULTS_TO_LOOP}"
      echo "${RELEASE_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
        || { echo "Error: invalid tag format '${RELEASE_TAG}'. Use vX.Y.Z"; exit 1; }
      # GitHub parity: the pipeline may run on any ref (e.g. main); the build
      # jobs check out ${RELEASE_TAG} so werf builds the tagged commit. Verify
      # the tag actually exists so the release fails fast here instead of deep
      # in build/deploy.
      git fetch --tags --force
      git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null \
        || { echo "Error: tag '${RELEASE_TAG}' not found. Push the tag before releasing."; exit 1; }
      echo "Release tag ${RELEASE_TAG} resolves to $(git rev-parse --short "refs/tags/${RELEASE_TAG}")"

# ---------------------------------------------------------------------------
# 2. check-requirements-before-build
# ---------------------------------------------------------------------------
prod:check-requirements:
  stage: prod_check
  extends:
    - .prod_release_rules
    - .login_prod_read_registry
  needs: ["prod:print-vars"]
  variables:
    MODULES_MODULE_TAG: "${RELEASE_TAG}"
  # NOTE: do NOT define a job-level before_script here. The registry login
  # (`werf cr login` into $PROD_READ_REGISTRY == registry.deckhouse.io) comes
  # from the inherited global default before_script (upstream Setup); a
  # job-level before_script REPLACES it, dropping the login. Without it the
  # shared DOCKER_CONFIG has no credentials and `crane` in tools/moduleversions
  # pulls registry.deckhouse.io/deckhouse/<edition> anonymously, failing with
  # UNAUTHORIZED. So the check-runner-tools guard goes in `script` (first line),
  # exactly like .base_build / .base_deploy / .prod_deploy_script.
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_TAG =~ /^v\d+\.\d+\.\d+$/ && $CHECK_ONLY != "true" && $SKIP_REQUIREMENTS_CHECK != "true" && ($EDITION_CE == "true" || $EDITION_EE == "true")
    - when: never
  script:
    - bash .gitlab/ci/scripts/bash/check-runner-tools.sh bash go task curl jq
    - CHANNEL="${RELEASE_CHANNEL}" VERSION="${RELEASE_TAG}" task -d tools/moduleversions check:requirements

# ---------------------------------------------------------------------------
# 3+4. build (toggleable) + deploy, per edition
# ---------------------------------------------------------------------------
# Deploy step (crane copy :tag -> :channel). Separate from .base_deploy so
# the job can land in the deploy_prod stage.
#
# It must NOT define its own before_script: the inherited Setup before_script is
# what runs `werf cr login`, and that login is what authenticates crane against
# the PROD registry (via the shared DOCKER_CONFIG). Overriding before_script here
# would drop that login and crane copy fails with UNAUTHORIZED. So the crane
# tool guard goes in `script` (first line), exactly like .base_deploy.
.prod_deploy_script:
  script:
    - bash .gitlab/ci/scripts/bash/check-runner-tools.sh crane
    - |
      REPO="${MODULES_MODULE_SOURCE}/${MODULES_MODULE_NAME}/release"
      IMAGE_SRC="${REPO}:${MODULES_MODULE_TAG}"
      IMAGE_DST="${REPO}:${RELEASE_CHANNEL}"
      echo "✨ Pushing ${IMAGE_SRC} to ${IMAGE_DST}"
      crane copy "${IMAGE_SRC}" "${IMAGE_DST}"

# Release build body: build the module at the release TAG regardless of the ref
# the pipeline runs on (GitHub parity — workflow YAML from the dispatch ref,
# source from ref:inputs.tag). Same pattern as build_dev_manual in build-dev.yml:
# the inherited Setup before_script (trdl / werf / registry login) is
# ref-independent and runs on the pipeline ref, then the script fetches and
# checks out ${RELEASE_TAG} before `werf build`, so werf builds the tag's
# committed tree under giterminism even when the pipeline ran on main.
# `!reference [.base_build, script]` reuses the parent build body (check-runner
# tools guard + the upstream .build_base werf build + registration).
.prod_release_build:
  extends: .base_build
  variables:
    # Full clone so even an old tag is fetchable and werf sees full history.
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  script:
    - git fetch --tags --force
    - git checkout "tags/${RELEASE_TAG}"
    - !reference [.base_build, script]

# --- CE ---
prod:build:ce:
  stage: build
  resource_group: "prod-release:${RELEASE_CHANNEL}:${RELEASE_TAG}:ce"
  extends:
    - .prod_release_rules
    - .prod_release_build
    - .prod_vars
    - .dev_registry_pull_login
    - .werf_secondary_repo
  needs:
    - job: prod:check-requirements
      optional: true
  variables:
    EDITION: ce
    MODULE_EDITION: CE
    MODULES_MODULE_TAG: "${RELEASE_TAG}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_TAG =~ /^v\d+\.\d+\.\d+$/ && $EDITION_CE == "true" && $CHECK_ONLY != "true" && $ENABLE_BUILD == "true"
    - when: never

prod:deploy:ce:
  stage: deploy_prod
  resource_group: "prod-release:${RELEASE_CHANNEL}:${RELEASE_TAG}:ce"
  extends:
    - .prod_release_rules
    - .prod_deploy_script
    - .prod_vars
    - .dev_registry_pull_login
  needs:
    - job: prod:check-requirements
      optional: true
    - job: prod:build:ce
      optional: true
  variables:
    EDITION: ce
    MODULE_EDITION: CE
    MODULES_MODULE_TAG: "${RELEASE_TAG}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_TAG =~ /^v\d+\.\d+\.\d+$/ && $EDITION_CE == "true" && $CHECK_ONLY != "true"
    - when: never

# --- EE ---
prod:build:ee:
  stage: build
  resource_group: "prod-release:${RELEASE_CHANNEL}:${RELEASE_TAG}:ee"
  extends:
    - .prod_release_rules
    - .prod_release_build
    - .prod_vars
    - .dev_registry_pull_login
    - .werf_secondary_repo
  needs:
    - job: prod:check-requirements
      optional: true
  variables:
    EDITION: ee
    MODULE_EDITION: EE
    MODULES_MODULE_TAG: "${RELEASE_TAG}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_TAG =~ /^v\d+\.\d+\.\d+$/ && $EDITION_EE == "true" && $CHECK_ONLY != "true" && $ENABLE_BUILD == "true"
    - when: never

prod:deploy:ee:
  stage: deploy_prod
  resource_group: "prod-release:${RELEASE_CHANNEL}:${RELEASE_TAG}:ee"
  extends:
    - .prod_release_rules
    - .prod_deploy_script
    - .prod_vars
    - .dev_registry_pull_login
  needs:
    - job: prod:check-requirements
      optional: true
    - job: prod:build:ee
      optional: true
  variables:
    EDITION: ee
    MODULE_EDITION: EE
    MODULES_MODULE_TAG: "${RELEASE_TAG}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_TAG =~ /^v\d+\.\d+\.\d+$/ && $EDITION_EE == "true" && $CHECK_ONLY != "true"
    - when: never

# --- SE-Plus (needs EE build, mirrors GH job-SE-Plus) ---
prod:build:se-plus:
  stage: build
  resource_group: "prod-release:${RELEASE_CHANNEL}:${RELEASE_TAG}:se-plus"
  extends:
    - .prod_release_rules
    - .prod_release_build
    - .prod_vars
    - .dev_registry_pull_login
    - .werf_secondary_repo
  needs: ["prod:build:ee"]
  variables:
    EDITION: se-plus
    MODULE_EDITION: EE
    MODULES_MODULE_TAG: "${RELEASE_TAG}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_TAG =~ /^v\d+\.\d+\.\d+$/ && $EDITION_EE == "true" && $CHECK_ONLY != "true" && $ENABLE_BUILD == "true"
    - when: never

prod:deploy:se-plus:
  stage: deploy_prod
  resource_group: "prod-release:${RELEASE_CHANNEL}:${RELEASE_TAG}:se-plus"
  extends:
    - .prod_release_rules
    - .prod_deploy_script
    - .prod_vars
    - .dev_registry_pull_login
  needs:
    - job: prod:build:se-plus
      optional: true
    # SE-Plus derives from EE: block its deploy whenever the EE deploy is
    # blocked (e.g. a failed prod:check-requirements skips deploy:ee). On a
    # deploy-only run the build cascade is absent, so this is the only link
    # that keeps the requirements gate binding for SE-Plus.
    - job: prod:deploy:ee
      optional: true
  variables:
    EDITION: se-plus
    MODULE_EDITION: EE
    MODULES_MODULE_TAG: "${RELEASE_TAG}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_TAG =~ /^v\d+\.\d+\.\d+$/ && $EDITION_EE == "true" && $CHECK_ONLY != "true"
    - when: never

# --- FE (needs EE build, mirrors GH job-FE) ---
prod:build:fe:
  stage: build
  resource_group: "prod-release:${RELEASE_CHANNEL}:${RELEASE_TAG}:fe"
  extends:
    - .prod_release_rules
    - .prod_release_build
    - .prod_vars
    - .dev_registry_pull_login
    - .werf_secondary_repo
  needs: ["prod:build:ee"]
  variables:
    EDITION: fe
    MODULE_EDITION: EE
    MODULES_MODULE_TAG: "${RELEASE_TAG}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_TAG =~ /^v\d+\.\d+\.\d+$/ && $EDITION_EE == "true" && $CHECK_ONLY != "true" && $ENABLE_BUILD == "true"
    - when: never

prod:deploy:fe:
  stage: deploy_prod
  resource_group: "prod-release:${RELEASE_CHANNEL}:${RELEASE_TAG}:fe"
  extends:
    - .prod_release_rules
    - .prod_deploy_script
    - .prod_vars
    - .dev_registry_pull_login
  needs:
    - job: prod:build:fe
      optional: true
    # FE derives from EE: block its deploy whenever the EE deploy is blocked
    # (e.g. a failed prod:check-requirements skips deploy:ee). On a deploy-only
    # run the build cascade is absent, so this is the only link that keeps the
    # requirements gate binding for FE.
    - job: prod:deploy:ee
      optional: true
  variables:
    EDITION: fe
    MODULE_EDITION: EE
    MODULES_MODULE_TAG: "${RELEASE_TAG}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_TAG =~ /^v\d+\.\d+\.\d+$/ && $EDITION_EE == "true" && $CHECK_ONLY != "true"
    - when: never

# ---------------------------------------------------------------------------
# 5. check-version-on-release-channel (registry / releases / documentation)
# ---------------------------------------------------------------------------
prod:check-version:
  stage: prod_verify
  extends:
    - .prod_release_rules
    - .login_prod_read_registry
  needs:
    - job: prod:deploy:ce
      optional: true
    - job: prod:deploy:ee
      optional: true
    - job: prod:deploy:se-plus
      optional: true
    - job: prod:deploy:fe
      optional: true
  parallel:
    matrix:
      - CHECK: [registry, releases, documentation]
  # NOTE: do NOT define a job-level before_script here. The CHECK=registry leg
  # runs `task check:registry`, which `crane export`s the license-gated ee/fe
  # release images; it relies on the `werf cr login` from the inherited global
  # default before_script (upstream Setup). A job-level before_script REPLACES
  # that default, dropping the login, so crane pulls anonymously and fails with
  # UNAUTHORIZED (same trap as prod:check-requirements above). The
  # check-runner-tools guard therefore goes in `script` (first line). The
  # releases/documentation legs hit public HTTP sites and need no login.
  script:
    - bash .gitlab/ci/scripts/bash/check-runner-tools.sh bash go task crane curl jq
    - |
      set -euo pipefail
      if [ "$CHECK_ONLY" != "true" ]; then
        echo "Waiting for the site to update (versions usually update within 5 minutes)..."
        sleep 300
      fi
      case "$CHECK" in
        registry)
          CHANNEL="${RELEASE_CHANNEL}" VERSION="${RELEASE_TAG}" task -d tools/moduleversions check:registry
          ;;
        releases)
          echo "Checking the version is deployed on the releases site (10 attempts, 60s apart)"
          CHANNEL="${RELEASE_CHANNEL}" VERSION="${RELEASE_TAG}" COUNT=10 task -d tools/moduleversions check:releases
          ;;
        documentation)
          echo "Checking the version is deployed on the docs site (5 attempts, 60s apart)"
          CHANNEL="${RELEASE_CHANNEL}" VERSION="${RELEASE_TAG}" COUNT=5 task -d tools/moduleversions check:docs
          ;;
      esac

# ---------------------------------------------------------------------------
# 6. create-gitlab-release (was create-github-release)
# ---------------------------------------------------------------------------
prod:create-gitlab-release:
  stage: prod_release
  extends: .prod_release_rules
  needs:
    - job: prod:deploy:ce
      optional: true
    - job: prod:deploy:ee
      optional: true
    - job: prod:deploy:se-plus
      optional: true
    - job: prod:deploy:fe
      optional: true
    - job: prod:check-version
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_TAG =~ /^v\d+\.\d+\.\d+$/ && $CHECK_ONLY != "true" && $RELEASE_TO_GITLAB == "true" && ($EDITION_CE == "true" || $EDITION_EE == "true")
    - when: never
  before_script:
    - bash .gitlab/ci/scripts/bash/check-runner-tools.sh bash curl jq
  script:
    - |
      set -euo pipefail
      source .gitlab/ci/scripts/bash/lib/api.sh
      TAG="${RELEASE_TAG}"

      # Skip if a release already exists.
      if api GET "/projects/${CI_PROJECT_ID}/releases/${TAG}" >/dev/null 2>&1; then
        echo "GitLab release already exists for ${TAG}, skipping"
        {
          echo "GH_RELEASE_STATUS=skipped"
          echo "GH_RELEASE_REASON=GitLab release already exists for ${TAG}"
        } > release.env
        exit 0
      fi

      # Find the single merged changelog MR for this milestone (label:changelog).
      MRS=$(api GET "/projects/${CI_PROJECT_ID}/merge_requests?state=merged&labels=changelog&milestone=${TAG}")
      COUNT=$(echo "$MRS" | jq 'length')
      echo "Found ${COUNT} merged changelog MR(s) for milestone ${TAG}"
      if [ "$COUNT" -ne 1 ]; then
        echo "Expected exactly one merged changelog MR for milestone ${TAG}, found ${COUNT}" >&2
        exit 1
      fi

      PR_BODY=$(echo "$MRS" | jq -r '.[0].description')
      PR_IID=$(echo "$MRS" | jq -r '.[0].iid')
      PR_URL=$(echo "$MRS" | jq -r '.[0].web_url')
      if [ -z "${PR_BODY//[[:space:]]/}" ]; then
        echo "Changelog MR !${PR_IID} description is empty" >&2
        exit 1
      fi

      # Create the GitLab release from the changelog MR description.
      api POST "/projects/${CI_PROJECT_ID}/releases" \
        --data "$(jq -n --arg tag "$TAG" --arg name "$TAG" --arg desc "$PR_BODY" \
          '{tag_name: $tag, name: $name, description: $desc}')"

      echo "GitLab release created for ${TAG}"
      {
        echo "GH_RELEASE_STATUS=created"
        echo "GH_RELEASE_URL=${CI_PROJECT_URL}/-/releases/${TAG}"
        echo "GH_RELEASE_PR_IID=${PR_IID}"
        echo "GH_RELEASE_PR_URL=${PR_URL}"
        echo "GH_RELEASE_REASON=GitLab release created from changelog MR !${PR_IID}"
      } > release.env
  artifacts:
    reports:
      dotenv: release.env

# ---------------------------------------------------------------------------
# 7. send-release-results-to-loop
# ---------------------------------------------------------------------------
prod:notify-loop:
  stage: notify
  extends: .prod_release_rules
  needs:
    - job: prod:deploy:ce
      optional: true
    - job: prod:deploy:ee
      optional: true
    - job: prod:deploy:se-plus
      optional: true
    - job: prod:deploy:fe
      optional: true
    - job: prod:check-version
      optional: true
    - job: prod:create-gitlab-release
      optional: true
  # when: always so the result is posted to Loop regardless of whether the
  # deploy / check-version / release jobs above succeeded or FAILED. All needs
  # are optional, so skipped upstream jobs do not block this notify; the script
  # derives the real status of each job via the API.
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_TAG =~ /^v\d+\.\d+\.\d+$/ && $SEND_RESULTS_TO_LOOP == "true"
      when: always
    - when: never
  before_script:
    - bash .gitlab/ci/scripts/bash/check-runner-tools.sh bash curl jq
  script:
    - bash .gitlab/ci/scripts/bash/notify-release-loop.sh
