# Top-level include fan-out for the deckhouse/virtualization GitLab pipeline.
#
# Order is significant: stages/variables/defaults must be loaded before any
# job file because GitLab CI merges variables and stages across all included
# documents. The Setup template provides its own stages: [build, deploy]; we
# explicitly extend stages via .gitlab/ci/stages.yml so the final list is the
# union of both.
#
# Upstream template names (deckhouse/ssdlc/gitlab-ci, v1.0.5):
#   - Setup.gitlab-ci.yml           (trdl + werf + ci-env + dev/stage/primary
#                                   registry login)
#   - Build.gitlab-ci.yml           (.build_base — werf build + bundle/attestation
#                                   copy + release-channel copy + registration;
#                                   .lint_base — dmt lint)
#   - Deploy.gitlab-ci.yml          (.deploy_base — release-channel crane copy)
#   - Promote.gitlab-ci.yml         (.promote — copy a release from the stage
#                                   registry to prod by digest)
#   - CVE_Scan.gitlab-ci.yml        (.cve_scan — Trivy scan via Vault)
#   - gitleaks.gitlab-ci.yml        (.gitleaks_scan — secrets scanning)
#   - Svace.gitlab-ci.yml           (.svace — analysis + svacer autoimport +
#                                   autoreview in a single job; replaces the old
#                                   .svace_analyze from Svace_Analayze.gitlab-ci.yml)
#   - Build_Fuzz.gitlab-ci.yml     (.fuzz_build + .fuzz_replay child pipeline)
#   - Translate_Changelog.gitlab-ci.yml (.translate_and_create_mr, consumed by
#                                   jobs/translate-changelog.yml)
#
# We include only the templates actually consumed by local jobs. The *_base
# bodies are rules-free, so our own .dev / .main / .prod context templates
# drive gating.

include:
  # --- Upstream ssdlc/gitlab-ci (ref v1.0.5) ---
  # Pinned to a release tag on purpose: the templates have no compatibility
  # contract or test suite, and every release-channel rollout (Run pipeline,
  # release-channels.yml) is a new pipeline that would otherwise pick up a new
  # template version in the middle of a release. Bump the ref by hand in a
  # dedicated MR. It is the only template ref in the pipeline: every template,
  # Translate_Changelog included, is listed here, and FUZZ_REPLAY_TEMPLATE_REF
  # below reuses the anchor (YAML anchors do not cross files, and include:ref
  # does not expand variables from `variables:`).
  - project: "deckhouse/ssdlc/gitlab-ci"
    ref: &templates_ref v1.0.5
    file:
      # Setup.gitlab-ci.yml provides trdl + werf setup + `werf cr login` into
      # the primary registry (plus DEV/STAGE when their credentials are set)
      # in before_script. See templates/Setup.gitlab-ci.yml.
      - "/templates/Setup.gitlab-ci.yml"
      # Build.gitlab-ci.yml provides the rules-free `.build_base` (werf build +
      # bundle/attestation copy + release-channel copy + module registration)
      # and `.lint_base`. Deploy.gitlab-ci.yml provides the rules-free
      # `.deploy_base` (release-channel crane copy). Our `.base_build` /
      # `.base_deploy` in templates/base/{build,deploy}.yml consume these via
      # `!reference`, so gating stays driven by our own .dev / .main / .prod
      # context templates (upstream `.build` / `.deploy` bake in `rules:` that
      # would otherwise override it).
      - "/templates/Build.gitlab-ci.yml"
      - "/templates/Deploy.gitlab-ci.yml"
      # Promote.gitlab-ci.yml provides `.promote`: the only way release images
      # reach the prod registry (stage -> prod by digest). Consumed by
      # jobs/promote.yml and the prod:promote:* jobs in jobs/release-channels.yml.
      - "/templates/Promote.gitlab-ci.yml"
      # Validation/scanning jobs extend these upstream templates.
      - "/templates/CVE_Scan.gitlab-ci.yml"
      - "/templates/gitleaks.gitlab-ci.yml"
      # Svace.gitlab-ci.yml provides `.svace`: Svace analysis, svacer autoimport
      # (reuse of decisions from other snapshots) and LLM autoreview folded into
      # one job. Consumed by svace:analyze in jobs/svace.yml.
      - "/templates/Svace.gitlab-ci.yml"
      - "/templates/Build_Fuzz.gitlab-ci.yml"
      - "/templates/Translate_Changelog.gitlab-ci.yml"

  # --- Local structural fragments (order: stages, vars, defaults, then jobs) ---
  - local: ".gitlab/ci/stages.yml"
  - local: ".gitlab/ci/variables.yml"
  - local: ".gitlab/ci/defaults.yml"
  - local: ".gitlab/ci/workflow.yml"

  # --- Local shared templates (extends: ...) ---
  # templates/ is grouped by the two global processes plus shared base:
  #   base/    - process-agnostic base job bodies + helpers
  #   dev/     - development process (DEV registry): MR / main / release / dev-tag
  #   release/ - release process (STAGE -> PROD registries): tag-push + manual
  #              dispatch
  # Anchor names are unchanged (.base_build, .dev, .prod_vars, ...), so no job
  # `extends:` edits are needed.
  # Registry-login helpers must load before dev_vars/stage_vars/prod_vars,
  # which extend them (.login_dev_registry / .login_stage_registry /
  # .login_prod_registry).
  - local: ".gitlab/ci/templates/base/registry-login.yml"
  - local: ".gitlab/ci/templates/dev/dev_vars.yml"
  - local: ".gitlab/ci/templates/release/stage_vars.yml"
  - local: ".gitlab/ci/templates/release/prod_vars.yml"
  - local: ".gitlab/ci/templates/dev/dev.yml"
  - local: ".gitlab/ci/templates/dev/dev_tags.yml"
  - local: ".gitlab/ci/templates/dev/main.yml"
  - local: ".gitlab/ci/templates/dev/release.yml"
  - local: ".gitlab/ci/templates/release/prod_tag.yml"
  - local: ".gitlab/ci/templates/base/info.yml"
  - local: ".gitlab/ci/templates/base/build.yml"
  - local: ".gitlab/ci/templates/base/deploy.yml"

  # --- Local job files owned by this issue ---
  - local: ".gitlab/ci/jobs/info.yml"
  - local: ".gitlab/ci/jobs/test.yml"
  - local: ".gitlab/ci/jobs/test-scripts-js.yml"
  - local: ".gitlab/ci/jobs/test-changelog.yml"
  - local: ".gitlab/ci/jobs/test-d8v-cli.yml"
  - local: ".gitlab/ci/jobs/build-dev.yml"
  - local: ".gitlab/ci/jobs/build-fuzz.yml"
  - local: ".gitlab/ci/jobs/build-prod.yml"
  # Copies a release built into STAGE by build_prod into PROD.
  - local: ".gitlab/ci/jobs/promote.yml"
  # No deploy-dev.yml: the DEV registry has no release channels (only tags),
  # so a dev tag is just built (build_dev_tags) and never crane-copied into
  # alpha/beta/... The GitHub "Deploy Dev" workflow
  # (dev_module_build-and-registration.yml) is build-only as well.
  - local: ".gitlab/ci/jobs/deploy-prod.yml"
  # Prod release-channels parity flow (manual single-channel dispatch):
  # requirements check, build/deploy per edition, version verification,
  # GitLab release creation, Loop notification.
  - local: ".gitlab/ci/jobs/release-channels.yml"
  - local: ".gitlab/ci/jobs/cleanup.yml"
  # e2e.yml carries its own `include:` of the lease template from the sibling
  # cluster-pool CI project; GitLab flattens nested includes, so importing the
  # job file from here pulls the template in with it.
  - local: ".gitlab/ci/jobs/e2e.yml"

  # --- Local validation and scanning jobs ---
  - local: ".gitlab/ci/jobs/lint-dmt.yml"
  - local: ".gitlab/ci/jobs/lint-validate.yml"
  - local: ".gitlab/ci/jobs/precache.yml"
  - local: ".gitlab/ci/jobs/svace.yml"
  - local: ".gitlab/ci/jobs/cve-scan.yml"
  - local: ".gitlab/ci/jobs/gitleaks.yml"

  # --- Local GitLab API automation, changelog, backport, and manual tools ---
  - local: ".gitlab/ci/jobs/auto-assign-author.yml"
  - local: ".gitlab/ci/jobs/backport.yml"
  - local: ".gitlab/ci/jobs/changelog.yml"
  - local: ".gitlab/ci/jobs/check-changelog.yml"
  - local: ".gitlab/ci/jobs/check-milestone.yml"
  - local: ".gitlab/ci/jobs/check-mr-title.yml"
  - local: ".gitlab/ci/jobs/manual-tools.yml"
  - local: ".gitlab/ci/jobs/check-and-rebuild.yml"
  - local: ".gitlab/ci/jobs/translate-changelog.yml"

variables:
  # The generated replay pipeline uses the same ref as the parent templates.
  FUZZ_REPLAY_TEMPLATE_REF: *templates_ref
