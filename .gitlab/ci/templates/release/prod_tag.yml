# Release pipeline context: vX.Y.Z tag-push build, promote & deploy.
#
# .prod_always (build) and .prod_manual (deploy) share the same tag match and
# differ in the rule's `when:` — build fires automatically once the tag is
# pushed, each channel deploy waits for a human click — and in the registry:
#   - .prod_always builds into the STAGE registry (.stage_tag);
#   - .prod_manual deploys inside the PROD registry (.prod_tag).
# Between them sits Promote (jobs/promote.yml), the only job that copies the
# release from STAGE into PROD.
#
# Note: the GH release_module_release-channels.yml inputs (channel, ce/ee,
# tag, enableBuild, release_to_github, check_only, ...) are collapsed here into
# a hardcoded matrix (RELEASE_CHANNEL x EDITION) in deploy-prod.yml. The
# single-channel dispatch that exposes those inputs lives in
# release-channels.yml (prod:* jobs, manual Run pipeline); this template stays
# the tag-push context.

.prod_tag:
  extends:
    - .prod_vars
  variables:
    MODULES_MODULE_TAG: ${CI_COMMIT_REF_NAME}

.stage_tag:
  extends:
    - .stage_vars
  variables:
    MODULES_MODULE_TAG: ${CI_COMMIT_REF_NAME}

# Build context: auto on a vX.Y.Z tag push, into STAGE.
.prod_always:
  extends:
    - .stage_tag
  rules:
    # https://regex101.com/r/lToOvi/1
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: always
    - when: never

# Deploy context: same tag match, but each channel deploy is manual.
.prod_manual:
  extends:
    - .prod_tag
  rules:
    # https://regex101.com/r/lToOvi/1
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
    - when: never
