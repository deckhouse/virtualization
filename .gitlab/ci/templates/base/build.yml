# Base build template (.base_build).
#
# `.base_build` is the werf-build job body extended by every build job
# (build_dev / build_main / build_prod / prod:build:* / precache / svace:build).
#
# It no longer carries a verbatim copy of the upstream build script. Instead it
# consumes the rules-free `.build_base` from the upstream modules-gitlab-ci
# Build.gitlab-ci.yml (included via .gitlab/ci/includes.yml) with
# `!reference [.build_base, script]`, and only prepends the local
# check-runner-tools guard. This keeps a single source of truth for the build
# script upstream while letting our job-level rules (.dev / .main / .prod_always
# / ...) drive gating.
#
# Why not `extends: .build`: upstream `.build` bakes in `rules:` that fire on
# ANY branch / tag push and, because GitLab merges `extends:` rules parent-first,
# would override our strict per-context gating. `.build_base` is the same script
# WITHOUT those rules (see upstream Build.gitlab-ci.yml). `!reference` is used
# instead of `extends: .build_base` so the local check-runner-tools line is
# prepended to the upstream script (extends would replace the whole `script:`).
#
# Required variables (documented in variables.yml + upstream Setup):
#   MODULES_MODULE_SOURCE, MODULES_MODULE_NAME, MODULES_MODULE_TAG,
#   WERF_REPO, SVACE_ENABLED (optional), SOURCE_REPO_SSH_KEY.

.base_build:
  stage: build
  script:
    - bash .gitlab/ci/scripts/bash/check-runner-tools.sh werf jq crane
    # Load the private-mirror key into the ssh-agent werf forwards into stapel
    # build containers. The `*-src-artifact` stages clone package sources from
    # git@${DECKHOUSE_PRIVATE_REPO}:deckhouse/3p (see .werf/images.yaml), and
    # the container has no key files of its own, so the agent is the only way a
    # key gets there. werf picks keys in the order $WERF_SSH_KEY_* -> running
    # ssh-agent -> ~/.ssh/id_{rsa,dsa}, and the upstream Setup before_script
    # already exports SSH_AUTH_SOCK for an agent holding the svace key alone —
    # which is why every such clone failed with "Permission denied (publickey)"
    # as soon as a src stage lost its cache. The GitHub path does the same in
    # deckhouse/modules-actions/build (step "Add source repo key").
    #
    # before_script and script share one shell, so ssh-add here lands in that
    # agent. The fallback branch only fires when upstream started no agent (no
    # svace key configured), so overriding its EXIT trap is not a concern.
    - |
      if [[ -n "${SOURCE_REPO_SSH_KEY}" ]]; then
        if [[ -z "${SSH_AUTH_SOCK}" ]]; then
          eval "$(ssh-agent -s)" >/dev/null
          trap 'kill -3 ${SSH_AGENT_PID}' ERR EXIT HUP INT QUIT TERM
        fi
        # The variable is declared as a "file" type, so the environment holds a
        # path rather than the key, and the stored content keeps its newlines
        # escaped as literal \n. printf %b turns those back into real newlines
        # (and leaves a key that already has them alone) — ssh-add rejects the
        # key otherwise with `error in libcrypto`. Both branches keep working if
        # the variable is ever switched back to a plain value.
        source_repo_key="${SOURCE_REPO_SSH_KEY}"
        if [[ -f "${source_repo_key}" ]]; then
          source_repo_key="$(cat "${source_repo_key}")"
        fi
        printf '%b\n' "${source_repo_key}" | ssh-add -
        ssh-add -l
      else
        echo "SOURCE_REPO_SSH_KEY is not set: clones from the private mirror will fail."
      fi
    - !reference [.build_base, script]
